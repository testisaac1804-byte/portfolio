<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>404 — Not found · Isaac's Projects</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050508;--sf:#0d0e12;--t1:#f0f0f5;--t2:#c8ccd6;--t3:#6b7080;--bd:rgba(255,255,255,0.07);--grad:linear-gradient(135deg,#6366f1,#8b5cf6,#06b6d4)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t2);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.box{max-width:520px}
.code{font-size:96px;font-weight:800;line-height:1;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.04em}
h1{font-size:22px;font-weight:700;color:var(--t1);margin:14px 0 8px}
p{color:var(--t3);font-size:14.5px;line-height:1.7;margin-bottom:26px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;border-radius:9px;text-decoration:none;font-size:14px;font-weight:600;transition:all .2s}
.primary{background:var(--grad);color:#fff}
.primary:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(99,102,241,.35)}
.ghost{border:1px solid var(--bd);color:var(--t2)}
.ghost:hover{border-color:#818cf8;color:var(--t1)}
.hint{margin-top:30px;font-size:12.5px;color:#3d4150}
code{background:rgba(255,255,255,.05);padding:2px 6px;border-radius:5px;font-size:12.5px}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>That file isn't here</h1>
  <p>The page or file you asked for doesn't exist on this site — it may have been renamed, moved, or never uploaded.</p>
  <div class="btns">
    <a class="primary" href="/">← All projects</a>
    <a class="ghost" href="/">🔍 Search the portfolio</a>
  </div>
  <div class="hint">Looking for a download? Open the project card and use its <code>📂 Files</code> button.</div>
</div>
</body>
</html>

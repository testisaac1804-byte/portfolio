<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Fusion Workbook</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0a0b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#swrap{position:relative;width:100%;height:100%}
#slide{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
#hot{position:absolute;inset:0}
.hs{position:absolute;cursor:pointer;border-radius:4px;transition:background .15s,box-shadow .15s}
.hs:hover{background:rgba(255,196,0,.22);box-shadow:0 0 0 2px rgba(255,196,0,.85)}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;mix-blend-mode:difference;z-index:12;pointer-events:none}
#counter{font-variant-numeric:tabular-nums}
#hint{position:fixed;left:20px;bottom:18px;font-size:11px;letter-spacing:.05em;color:#fff;mix-blend-mode:difference;z-index:12;transition:opacity .4s}
#mediaBtn{position:fixed;right:18px;bottom:16px;z-index:13;display:flex;gap:8px;align-items:center;background:rgba(20,20,22,.82);border:1px solid rgba(255,255,255,.16);color:#fff;font:inherit;font-size:12px;padding:8px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(10px)}
#mediaBtn b{color:#ffc400}
#dock{position:fixed;left:50%;bottom:0;transform:translate(-50%,112%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:14;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 14px 14px;max-width:94vw;background:rgba(12,12,14,.88);border:1px solid rgba(255,255,255,.13);border-bottom:none;border-radius:16px 16px 0 0;backdrop-filter:blur(14px)}
#dock.on{transform:translate(-50%,0)}
.card{position:relative;cursor:pointer;border-radius:8px;overflow:hidden;background:#191919;flex:0 0 auto;height:var(--ch,76px)}
.card img,.card video{height:100%;width:auto;display:block;object-fit:cover}
.card .tag{position:absolute;top:4px;left:4px;font-size:9px;letter-spacing:.08em;background:rgba(0,0,0,.72);color:#ffc400;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.card .num{position:absolute;bottom:0;right:0;font-size:10px;background:rgba(0,0,0,.72);color:#fff;padding:1px 5px;border-radius:4px 0 0 0}
.card:hover{outline:2px solid #ffc400}
.card.vid{display:flex;align-items:center;justify-content:center;width:calc(var(--ch,76px) * 1.65);background:linear-gradient(135deg,#1d1d21,#101012);border:1px solid rgba(255,196,0,.3)}
.card.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.card.vid .play{position:absolute;font-size:22px;color:#ffc400;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.card.vid .lbl{font-size:9px;line-height:1.25;padding:0 8px;color:#ddd;text-align:center;letter-spacing:.02em}
#lb{position:fixed;inset:0;background:rgba(6,6,8,.95);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:30;padding:28px}
#lb.on{display:flex}
#lbBody{display:flex;align-items:center;justify-content:center;max-width:96vw;max-height:84vh}
#lbBody img,#lbBody video{max-width:96vw;max-height:84vh;display:block;border-radius:4px}
#lbBody iframe{width:min(92vw,1280px);height:min(78vh,720px);border:1px solid rgba(255,255,255,.16);border-radius:6px;background:#000}
#lbCap{font-size:12px;color:#9a9a9a;letter-spacing:.05em}
#lbCap a{color:#ffc400}
#lbClose{position:absolute;top:18px;right:22px;font-size:12px;color:#bbb;cursor:pointer;border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;background:none}
#links{position:fixed;right:0;top:0;bottom:0;width:min(420px,44vw);background:rgba(14,14,16,.96);border-left:1px solid rgba(255,255,255,.12);padding:24px 22px;overflow:auto;z-index:20;transform:translateX(102%);transition:transform .26s ease}
#links.on{transform:none}
#links h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8a8a8a;margin-bottom:14px;font-weight:600}
#links a{display:block;color:#eaeaea;text-decoration:none;font-size:13px;line-height:1.45;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)}
#links a:hover{color:#ffc400}
#links .u{display:block;color:#6f6f6f;font-size:10px;margin-top:3px;word-break:break-all}
#grid{position:fixed;inset:0;background:rgba(8,8,10,.97);z-index:25;display:none;padding:26px;overflow:auto}
#grid.on{display:block}
#gridIn{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
#gridIn img{width:100%;border-radius:4px;cursor:pointer;border:2px solid transparent}
#gridIn img:hover{border-color:#ffc400}
#gridIn img.cur{border-color:#ffc400}
.hide{opacity:0!important}
</style></head><body>

<script>
const $=s=>document.querySelector(s);
const slideImg=$('#slide'), hot=$('#hot'), dock=$('#dock'), mediaBtn=$('#mediaBtn');
const lb=$('#lb'), lbBody=$('#lbBody'), lbCap=$('#lbCap');
const linksPane=$('#links'), linksIn=$('#linksIn'), grid=$('#grid'), gridIn=$('#gridIn');
let i=0, sel=0, dockOpen=false, lbIdx=-1, linksOpen=false, gridOpen=false, chromeHidden=false;

function slideOf(n){return DECK[Math.max(0,Math.min(DECK.length-1,n))];}

function closeLb(){
  lb.classList.remove('on'); lbIdx=-1;
  const v=lbBody.querySelector('video'); if(v) v.pause();
  lbBody.innerHTML='';
}

function fitImg(im){
  const availW=innerWidth*.92, availH=innerHeight*.82;
  const nw=im.naturalWidth||1, nh=im.naturalHeight||1;
  const s=Math.min(availW/nw, availH/nh);
  im.style.width=Math.round(nw*s)+'px'; im.style.height=Math.round(nh*s)+'px';
}

function openLb(k){
  const d=slideOf(i), m=d.media[k]; if(!m) return;
  lbIdx=k; lbBody.innerHTML=''; lb.classList.add('on');
  if(m.kind==='vid'){
    const f=document.createElement('iframe');
    f.src='https://drive.google.com/file/d/'+m.fid+'/preview';
    f.allow='autoplay; encrypted-media; fullscreen';
    f.setAttribute('allowfullscreen','');
    lbBody.appendChild(f);
    lbCap.innerHTML=(m.title||m.fid)+' · <a href="'+m.href+'" target="_blank" rel="noopener">open in Drive ↗</a>';
  } else if(m.kind==='gif' && m.mp4){
    const v=document.createElement('video');
    v.src=m.mp4; v.autoplay=true; v.loop=true; v.muted=true; v.playsInline=true; v.controls=true;
    v.onloadedmetadata=()=>{ const s=Math.min(innerWidth*.92/v.videoWidth, innerHeight*.82/v.videoHeight, 3); v.style.width=Math.round(v.videoWidth*s)+'px'; v.style.height=Math.round(v.videoHeight*s)+'px'; };
    lbBody.appendChild(v);
    lbCap.textContent=m.name+' · video · '+(k+1)+' / '+d.media.length+'  (← → to browse, click to pause)';
    v.onclick=()=>{ v.paused?v.play():v.pause(); };
  } else {
    const im=document.createElement('img'); im.src=m.src;
    im.onload=()=>fitImg(im);
    lbBody.appendChild(im);
    lbCap.textContent=m.name+' · photo · '+(k+1)+' / '+d.media.length+'  (← → to browse, click to zoom)';
    im.onclick=()=>{ im.style.width=(im.style.width? '' : Math.round(im.naturalWidth*1.9)+'px'); im.style.height=(im.style.height? '' : Math.round(im.naturalHeight*1.9)+'px'); };
  }
}

function buildHotspots(d){
  hot.innerHTML='';
  (d.links||[]).forEach(L=>{
    const a=document.createElement('a');
    a.className='hs'; a.href=L.href; a.target='_blank'; a.rel='noopener';
    a.title=(L.text? L.text+' — ' : '')+L.href;
    a.style.left=(L.nx*100)+'%'; a.style.top=(L.ny*100)+'%';
    a.style.width=(L.nw*100)+'%'; a.style.height=(Math.max(L.nh,0.02)*100)+'%';
    hot.appendChild(a);
  });
}

function buildDock(d){
  dock.innerHTML='';
  d.media.forEach((m,k)=>{
    const c=document.createElement('div');
    if(m.kind==='vid'){
      c.className='card vid';
      const th=m.fid?('<img src="https://drive.google.com/thumbnail?id='+m.fid+'&sz=w400" alt="" onerror="this.style.display=\'none\'">'):'';
      c.innerHTML=th+'<div class="play">▶</div><div class="num">'+(k+1)+'</div>';
    } else if(m.kind==='gif' && m.mp4){
      c.className='card';
      c.innerHTML='<video src="'+m.mp4+'" autoplay loop muted playsinline></video><div class="tag">video</div><div class="num">'+(k+1)+'</div>';
    } else {
      c.className='card';
      c.innerHTML='<img src="'+m.src+'" loading="lazy" alt=""><div class="num">'+(k+1)+'</div>';
    }
    c.onclick=()=>openLb(k);
    dock.appendChild(c);
  });
  fitDock();
  const refit=()=>fitDock();
  dock.querySelectorAll('img,video').forEach(el=>{
    el.addEventListener('load',refit); el.addEventListener('loadedmetadata',refit);
  });
  [60,250,700,1400].forEach(ms=>setTimeout(refit,ms));
}

function fitDock(){
  const cards=dock.querySelectorAll('.card');
  if(!cards.length) return;
  const h=document.getElementById('hint'); if(h) h.style.opacity=0;
  let ch = Math.min(84, Math.max(56, Math.round(innerHeight*0.10)));
  const maxH = innerHeight*0.42;
  for(let guard=0; guard<30; guard++){
    dock.style.setProperty('--ch', ch+'px');
    if(dock.getBoundingClientRect().height <= maxH || ch<=34) break;
    ch -= 4;
  }
}

function buildLinks(d){
  linksIn.innerHTML='';
  const L=d.links||[];
  if(!L.length){ linksIn.innerHTML='<div style="color:#6f6f6f;font-size:12px">No links on this slide.</div>'; return; }
  L.forEach(l=>{
    const a=document.createElement('a');
    a.href=l.href; a.target='_blank'; a.rel='noopener';
    a.innerHTML=(l.text||l.href)+'<span class="u">'+l.href+'</span>';
    linksIn.appendChild(a);
  });
}

function show(n){
  i=Math.max(0,Math.min(DECK.length-1,n));
  const d=DECK[i];
  slideImg.src=d.src;
  $('#counter').textContent=(i+1)+' / '+DECK.length;
  $('#mcount').textContent=d.media.length;
  mediaBtn.style.opacity=d.media.length?1:.35;
  buildHotspots(d);
  if(dockOpen) buildDock(d);
  if(linksOpen) buildLinks(d);
  closeLb();
  history.replaceState(null,'','#s'+(i+1));
}

function toggleDock(force){
  const d=DECK[i];
  if(!d.media.length){ dockOpen=false; dock.classList.remove('on'); return; }
  dockOpen=(force!==undefined)?force:!dockOpen;
  if(dockOpen){ buildDock(d); dock.classList.add('on'); mediaBtn.style.opacity=0; }
  else { dock.classList.remove('on'); mediaBtn.style.opacity=1; }
  $('#hint').style.opacity = dockOpen ? 0 : .45;
}

addEventListener('resize', ()=>{ if(dockOpen) fitDock(); });

function toggleLinks(){
  linksOpen=!linksOpen;
  linksPane.classList.toggle('on',linksOpen);
  if(linksOpen) buildLinks(DECK[i]);
}

function buildGrid(){
  if(gridIn.childElementCount) return;
  DECK.forEach((d,k)=>{
    const im=document.createElement('img');
    im.src=d.src; im.loading='lazy'; im.alt='Slide '+(k+1);
    im.onclick=()=>{ grid.classList.remove('on'); gridOpen=false; show(k); };
    gridIn.appendChild(im);
  });
}

function toggleGrid(){
  buildGrid(); gridOpen=!gridOpen;
  grid.classList.toggle('on',gridOpen);
  if(gridOpen){ [...gridIn.children].forEach((im,k)=>im.classList.toggle('cur',k===i)); }
}

function toggleFs(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='Escape'){
    if(lb.classList.contains('on')) return closeLb();
    if(gridOpen) return toggleGrid();
    if(linksOpen) return toggleLinks();
    return;
  }
  if(lb.classList.contains('on')){
    const d=DECK[i];
    if(k==='ArrowRight'&&lbIdx<d.media.length-1) return openLb(lbIdx+1);
    if(k==='ArrowLeft'&&lbIdx>0) return openLb(lbIdx-1);
    return;
  }
  const d=DECK[i];
  if(k>='1'&&k<='9'){ const idx=+k-1; if(d.media[idx]) openLb(idx); return; }
  switch(k){
    case 'ArrowRight': case 'ArrowDown': case ' ': case 'PageDown': case 'j': show(i+1); break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'k': show(i-1); break;
    case 'Home': show(0); break;
    case 'End': show(DECK.length-1); break;
    case 'm': case 'M': toggleDock(); break;
    case 'l': case 'L': toggleLinks(); break;
    case 'g': case 'G': toggleGrid(); break;
    case 'f': case 'F': toggleFs(); break;
    case 'h': case 'H': chromeHidden=!chromeHidden;
      $('#top').classList.toggle('hide',chromeHidden);
      $('#hint').classList.toggle('hide',chromeHidden);
      mediaBtn.classList.toggle('hide',chromeHidden); break;
    default: return;
  }
  e.preventDefault();
});

mediaBtn.onclick=()=>toggleDock();
$('#lbClose').onclick=()=>closeLb();
lb.onclick=e=>{ if(e.target===lb) closeLb(); };
slideImg.onclick=e=>{ const r=slideImg.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width; if(x>0.72) show(i+1); else if(x<0.12) show(i-1); };
window.addEventListener('wheel',e=>{ if(lb.classList.contains('on')) return; show(i+(e.deltaY>0?1:-1)); },{passive:true});
setTimeout(()=>{ $('#hint').style.opacity=.0? .45 : .45; },1);

if(location.hash.startsWith('#s')){ const n=parseInt(location.hash.slice(2),10); show(isNaN(n)?0:n-1); }
else show(0);

</script></body></html>

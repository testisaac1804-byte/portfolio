<!DOCTYPE html>
<html>
<head>
  <title>{{ title }} — IsaacNet Reader</title>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #f5f0eb; --text: #2c2c2c; --text2: #555;
      --accent: #6c8cff; --font: Georgia, 'Times New Roman', serif;
      --mono: 'SF Mono', monospace;
    }
    body.dark {
      --bg: #1a1a1a; --text: #d4d4d4; --text2: #999; --accent: #8ab4f8;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      font-family: var(--font); background: var(--bg); color: var(--text);
      padding: 0; margin: 0; line-height: 1.7;
    }
    .reader-toolbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 20px; background: var(--bg);
      border-bottom: 1px solid rgba(0,0,0,0.1);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .reader-toolbar h2 {
      font-size: 14px; font-weight: 600; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .reader-toolbar a, .reader-toolbar button {
      font-size: 12px; color: var(--accent); text-decoration: none;
      padding: 4px 12px; border-radius: 4px; border: 1px solid var(--accent);
      background: transparent; cursor: pointer; font-family: inherit;
    }
    .reader-toolbar a:hover, .reader-toolbar button:hover {
      background: var(--accent); color: #fff;
    }
    .reader-content {
      max-width: 680px; margin: 0 auto; padding: 40px 20px 80px;
    }
    .reader-content h1 {
      font-size: 28px; font-weight: 700; line-height: 1.3;
      margin-bottom: 8px; letter-spacing: -0.3px;
    }
    .reader-content .meta {
      font-size: 13px; color: var(--text2); margin-bottom: 24px;
      font-family: -apple-system, sans-serif;
    }
    .reader-content p {
      font-size: 17px; margin-bottom: 16px;
      text-align: justify; hyphens: auto;
    }
    .reader-content h2 { font-size: 22px; margin: 24px 0 12px; }
    .reader-content h3 { font-size: 18px; margin: 20px 0 8px; }
    .reader-content ul, .reader-content ol { margin: 12px 0 12px 24px; }
    .reader-content li { margin-bottom: 6px; }
    .reader-content blockquote {
      border-left: 3px solid var(--accent); padding-left: 16px;
      margin: 16px 0; color: var(--text2); font-style: italic;
    }
    .reader-content code {
      font-family: var(--mono); font-size: 14px;
      background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 3px;
    }
    .reader-content a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="reader-toolbar">
    <h2>📖 IsaacNet Reader</h2>
    <a href="/isaacium/fetch?u={{ source_url | urlencode }}">Original Page</a>
    <button onclick="document.body.classList.toggle('dark')">🌓 Theme</button>
    <button onclick="window.print()">🖨 Print</button>
  </div>
  <div class="reader-content">
    <h1>{{ title }}</h1>
    <div class="meta">From: <a href="{{ source_url }}">{{ source_url }}</a></div>
    <div>
      {% for line in content_lines %}
        {% if line.strip() %}
          <p>{{ line }}</p>
        {% endif %}
      {% endfor %}
    </div>
  </div>
</body>
</html>

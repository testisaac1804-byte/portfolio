<!DOCTYPE html>
<html>
<title>IsaacNet — Error</title>
<style>
  body { 
    background: #0b0d14; color: #e4e6f0; font-family: -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; height: 100vh;
    margin: 0; text-align: center;
  }
  .container { max-width: 500px; padding: 40px; }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #8a8ea0; font-size: 14px; line-height: 1.5; word-break: break-all; }
  .url { 
    background: #1a1d2e; padding: 8px 12px; border-radius: 6px;
    font-size: 12px; color: #6c8cff; margin: 16px 0; font-family: monospace;
  }
  .btn {
    display: inline-block; padding: 8px 24px; border-radius: 6px;
    background: #6c8cff; color: #fff; text-decoration: none; font-size: 13px;
    margin-top: 8px;
  }
  .btn:hover { background: #5a7ae8; }
</style></head>
<body>
  <div class="container">
    <div class="icon">⚠️</div>
    <h1>Couldn't load this page</h1>
    <p>{{ message }}</p>
    <div class="url">{{ url }}</div>
    <a class="btn" href="/">Go to IsaacNet Home</a>
  </div>
</body>
</html>

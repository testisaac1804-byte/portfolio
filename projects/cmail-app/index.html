<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox - CMail</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        :root { --bg-color: #f6f8fc; --surface-color: #ffffff; --text-primary: #1f1f1f; --text-secondary: #474747; --gmail-red: #ea4335; --sidebar-active: #d3e3fd; --sidebar-active-text: #041e49; --compose-bg: #c2e7ff; --search-bg: #eaf1fb; --border-color: #f2f2f2; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { background-color: var(--bg-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: var(--text-primary); }

        #gmail-loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.4s ease, visibility 0.4s; }
        .loader-logo { font-size: 64px; margin-bottom: 25px; animation: pulse 1.5s infinite ease-in-out; }
        .progress-container { width: 250px; height: 4px; background-color: #f1f1f1; border-radius: 2px; overflow: hidden; position: relative; }
        .progress-bar { width: 100%; height: 100%; background-color: var(--gmail-red); position: absolute; left: -100%; animation: lineLoad 1.8s infinite ease-in-out; }
        @keyframes lineLoad { 0% { left: -100%; width: 30%; } 50% { width: 60%; } 100% { left: 100%; width: 20%; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }

        .header { height: 64px; display: flex; align-items: center; padding: 0 16px; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 4px; width: 240px; }
        .icon-btn { cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 40px; height: 40px; color: var(--text-secondary); transition: 0.2s; }
        .icon-btn:hover { background-color: rgba(60,64,67,0.08); }
        .logo-area { font-size: 22px; font-weight: 500; color: #444746; display: flex; align-items: center; gap: 8px; margin-left: 4px; letter-spacing: -0.5px; }
        
        .search-area { flex: 1; max-width: 720px; background-color: var(--search-bg); border-radius: 24px; height: 48px; display: flex; align-items: center; padding: 0 16px; gap: 12px; }
        .search-area input { border: none; background: transparent; outline: none; font-size: 16px; flex: 1; color: var(--text-primary); }
        .header-right { display: flex; gap: 4px; align-items: center; }
        .status-pill { display: flex; align-items: center; gap: 8px; border: 1px solid #747775; padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; color: #444746; margin-right: 8px; cursor: pointer; }
        .status-dot { width: 10px; height: 10px; background-color: #0f9d58; border-radius: 50%; }
        .avatar { width: 32px; height: 32px; background-color: #1a73e8; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; margin-left: 8px; font-size: 14px; }

        .main-body { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 256px; display: flex; flex-direction: column; padding-right: 8px; }
        .compose-btn { background-color: var(--compose-bg); color: #001d35; border: none; height: 56px; border-radius: 16px; padding: 0 24px 0 18px; margin: 8px 0 16px 8px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 12px; cursor: pointer; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1); }
        
        .nav-item { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 26px; height: 32px; border-radius: 0 16px 16px 0; cursor: pointer; font-size: 14px; color: #444746; }
        .nav-item-left { display: flex; align-items: center; gap: 18px; }
        .nav-item:hover { background-color: rgba(60,64,67,0.06); }
        .nav-item.active { background-color: var(--sidebar-active); color: var(--sidebar-active-text); font-weight: 700; }
        .nav-item.active .material-symbols-outlined { font-variation-settings: 'FILL' 1; }

        .inbox-container { flex: 1; background-color: var(--surface-color); border-radius: 16px; margin: 0 16px 16px 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05); }
        .list-toolbar { padding: 8px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; color: var(--text-secondary); }
        .toolbar-left { display: flex; align-items: center; gap: 12px; }
        
        .email-list { flex: 1; overflow-y: auto; }
        .email-row { display: flex; align-items: center; padding: 0 16px; height: 40px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-size: 14px; background-color: #ffffff; }
        .email-row:hover { box-shadow: inset 1px 0 0 #dadce0, inset -1px 0 0 #dadce0, 0 1px 3px 0 rgba(60,64,67,0.2); z-index: 1; position: relative; }
        .email-selectors { display: flex; gap: 12px; margin-right: 16px; color: rgba(0,0,0,0.25); }
        .email-selectors .material-symbols-outlined:hover { color: var(--text-primary); }
        
        .star-active { color: #f4b400 !important; font-variation-settings: 'FILL' 1; }

        .email-sender { width: 180px; padding-right: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .email-body-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; }
        .email-subject { font-weight: 500; }
        .email-snippet { color: #5f6368; }
        .email-date { width: 60px; text-align: right; font-size: 12px; color: #5f6368; }

        .compose-window { position: fixed; bottom: 0; right: 80px; width: 520px; height: 500px; background: white; border-radius: 8px 8px 0 0; box-shadow: 0 8px 24px rgba(0,0,0,0.2); display: flex; flex-direction: column; z-index: 1000; }
        .compose-header { background-color: #f2f6fc; padding: 12px 16px; border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; }
        .compose-body { display: flex; flex-direction: column; flex: 1; }
        .compose-input { border: none; border-bottom: 1px solid var(--border-color); padding: 12px 16px; outline: none; font-size: 14px; }
        .compose-textarea { flex: 1; border: none; padding: 16px; outline: none; resize: none; font-size: 14px; }
        .compose-footer { padding: 12px 16px; display: flex; align-items: center; border-top: 1px solid var(--border-color); }
        .send-btn { background-color: #0b57d0; color: white; border: none; padding: 10px 24px; border-radius: 20px; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>

    <div id="gmail-loader">
        <div class="loader-logo"><span style="color:var(--gmail-red);">✉️</span></div>
        <div class="progress-container"><div class="progress-bar"></div></div>
    </div>

    <header class="header">
        <div class="header-left">
            <div class="icon-btn"><span class="material-symbols-outlined">menu</span></div>
            <div class="logo-area"><span style="color: var(--gmail-red); font-size: 24px;">✉️</span> CMail</div>
        </div>
        
        <div class="search-area">
            <div class="icon-btn"><span class="material-symbols-outlined">search</span></div>
            <input type="text" placeholder="Search mail">
            <div class="icon-btn"><span class="material-symbols-outlined">tune</span></div>
        </div>
        
        <div class="header-right">
            <div class="status-pill"><div class="status-dot"></div><span>Active</span></div>
            <div class="icon-btn" onclick="window.location.href='/login'" title="重新授權權限"><span class="material-symbols-outlined">settings</span></div>
            <div class="icon-btn"><span class="material-symbols-outlined">apps</span></div>
            <div class="avatar">I</div>
        </div>
    </header>

    <div class="main-body">
        <nav class="sidebar" id="sidebar">
            <button class="compose-btn" onclick="toggleCompose()">
                <span class="material-symbols-outlined">edit</span> Compose
            </button>
            <div class="nav-item active" onclick="loadCategory('INBOX', this)">
                <div class="nav-item-left"><span class="material-symbols-outlined">inbox</span> Inbox</div>
            </div>
            <div class="nav-item" onclick="loadCategory('STARRED', this)">
                <div class="nav-item-left"><span class="material-symbols-outlined">star</span> Starred</div>
            </div>
            <div class="nav-item" onclick="loadCategory('SENT', this)">
                <div class="nav-item-left"><span class="material-symbols-outlined">send</span> Sent</div>
            </div>
            <div class="nav-item" onclick="loadCategory('DRAFT', this)">
                <div class="nav-item-left"><span class="material-symbols-outlined">draft</span> Drafts</div>
            </div>
        </nav>

        <main class="inbox-container">
            <div class="list-toolbar" id="listToolbar">
                <div class="toolbar-left">
                    <span class="material-symbols-outlined" style="cursor: pointer; font-size: 20px;">check_box_outline_blank</span>
                    <span class="material-symbols-outlined" style="cursor: pointer; font-size: 20px;" onclick="loadCategory(currentLabel, null)">refresh</span>
                </div>
            </div>
            
            <div class="list-toolbar" id="detailToolbar" style="display: none;">
                <div class="toolbar-left">
                    <span class="material-symbols-outlined" style="cursor: pointer; font-size: 20px;" onclick="closeEmailView()">arrow_back</span>
                </div>
            </div>

            <div class="email-list" id="inbox"></div>

            <div id="emailDetailView" style="display: none; padding: 24px; overflow-y: auto; flex: 1; background: #fff;">
                <h2 id="detailSubject" style="font-size: 20px; font-weight: 400; margin-bottom: 20px; color: var(--text-primary);"></h2>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div style="width: 40px; height: 40px; background-color: #e8f0fe; color: #1a73e8; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px;" id="detailAvatar"></div>
                        <div>
                            <div id="detailFrom" style="font-weight: 700; font-size: 14px; color: var(--text-primary);"></div>
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">寄給 我</div>
                        </div>
                    </div>
                    <div id="detailDate" style="font-size: 12px; color: var(--text-secondary);"></div>
                </div>
                <div id="detailBody" style="font-size: 14px; line-height: 1.6; color: var(--text-primary); white-space: pre-wrap; margin-top: 16px; border-top: 1px solid var(--border-color); padding-top: 16px;"></div>
            </div>
        </main>
    </div>

    <div class="compose-window" id="composeWindow" style="display: none;">
        <div class="compose-header">
            <span>New Message</span>
            <span style="cursor: pointer;" onclick="toggleCompose()"><span class="material-symbols-outlined" style="font-size: 18px;">close</span></span>
        </div>
        <div class="compose-body">
            <input type="text" id="mail-to" class="compose-input" placeholder="Recipients">
            <input type="text" id="mail-subject" class="compose-input" placeholder="Subject">
            <textarea id="mail-content" class="compose-textarea"></textarea>
        </div>
        <div class="compose-footer">
            <button class="send-btn" id="sendBtn" onclick="sendEmail()">Send</button>
        </div>
    </div>

    <script>
        let currentLabel = 'INBOX';

        window.onload = () => loadCategory('INBOX', document.querySelector('.nav-item.active'));

        // 讀取分類信件列表
        async function loadCategory(labelId, element) {
            currentLabel = labelId;
            closeEmailView(); // 切換分類時，返回列表畫面

            if (element) {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');
            }

            const loader = document.getElementById('gmail-loader');
            loader.style.opacity = '1'; loader.style.visibility = 'visible';
            
            const list = document.getElementById('inbox');
            list.innerHTML = '';

            try {
                const res = await fetch(`/list-messages?labelId=${labelId}`);
                const data = await res.json();
                
                if (data.error) throw new Error(data.error);

                data.forEach((msg) => {
                    const div = document.createElement('div');
                    div.className = 'email-row';
                    
                    // 點擊整列（扣除星星與核取方塊）時，觸發開啟詳細內文
                    div.onclick = () => viewEmail(msg.id);
                    
                    const starClass = msg.isStarred ? 'star-active' : '';

                    div.innerHTML = `
                        <div class="email-selectors" onclick="event.stopPropagation()">
                            <span class="material-symbols-outlined" style="font-size: 20px;">check_box_outline_blank</span>
                            <span class="material-symbols-outlined ${starClass}" style="font-size: 20px; cursor: pointer;" onclick="toggleStar(event, '${msg.id}', this)">star_border</span>
                        </div>
                        <div class="email-sender">${msg.from}</div>
                        <div class="email-body-text">
                            <span class="email-subject">${msg.subject}</span>
                            <span class="email-snippet">— ${msg.snippet}</span>
                        </div>
                        <div class="email-date">${msg.date}</div>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                list.innerHTML = `<div style="padding: 40px; text-align: center; color: #ea4335;"><p>載入失敗或授權過期，請點擊右上角齒輪重新登入</p></div>`;
            } finally {
                setTimeout(() => { loader.style.opacity = '0'; loader.style.visibility = 'hidden'; }, 400);
            }
        }

        // 切換星號狀態
        async function toggleStar(event, messageId, starElement) {
            event.stopPropagation();
            const isCurrentlyStarred = starElement.classList.contains('star-active');
            const addStar = !isCurrentlyStarred;

            starElement.classList.toggle('star-active');

            try {
                const res = await fetch('/toggle-star', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messageId, addStar })
                });
                const data = await res.json();
                if (!data.success) throw new Error('API Failed');
            } catch (err) {
                starElement.classList.toggle('star-active');
                alert("無法同步星號狀態");
            }
        }

        // 點擊讀取單封詳細信件
        async function viewEmail(messageId) {
            const loader = document.getElementById('gmail-loader');
            loader.style.opacity = '1'; loader.style.visibility = 'visible';

            try {
                const res = await fetch(`/get-message?id=${messageId}`);
                if (!res.ok) throw new Error("Backend route missing or error");
                
                const msg = await res.json();
                if (msg.error) throw new Error(msg.error);

                // 填入詳細內文資料
                document.getElementById('detailSubject').textContent = msg.subject || '(無主旨)';
                document.getElementById('detailFrom').textContent = msg.from || '未知寄件者';
                document.getElementById('detailDate').textContent = msg.date || '';
                
                const firstChar = (msg.from || 'U').trim().charAt(0).toUpperCase();
                document.getElementById('detailAvatar').textContent = firstChar;
                document.getElementById('detailBody').textContent = msg.body || msg.snippet || '';

                // 切換介面顯示：隱藏列表，顯示內文
                document.getElementById('listToolbar').style.display = 'none';
                document.getElementById('inbox').style.display = 'none';
                
                document.getElementById('detailToolbar').style.display = 'flex';
                document.getElementById('emailDetailView').style.display = 'block';

            } catch (err) {
                console.error(err);
                alert("無法讀取信件內容。請確保您的後端 Node.js 已成功新增 /get-message 路由介面。");
            } finally {
                setTimeout(() => { loader.style.opacity = '0'; loader.style.visibility = 'hidden'; }, 400);
            }
        }

        // 關閉信件內文，返回列表
        function closeEmailView() {
            const detailToolbar = document.getElementById('detailToolbar');
            if (detailToolbar) {
                document.getElementById('detailToolbar').style.display = 'none';
                document.getElementById('emailDetailView').style.display = 'none';
                
                document.getElementById('listToolbar').style.display = 'flex';
                document.getElementById('inbox').style.display = 'block';
            }
        }

        function toggleCompose() {
            const win = document.getElementById('composeWindow');
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }

        async function sendEmail() {
            const btn = document.getElementById('sendBtn');
            const to = document.getElementById('mail-to').value;
            const subject = document.getElementById('mail-subject').value;
            const message = document.getElementById('mail-content').value;

            if (!to || !subject) return alert("請填寫收件者與主旨");

            btn.textContent = "Sending..."; btn.style.backgroundColor = "#dadce0";

            try {
                const res = await fetch('/send-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to, subject, message })
                });
                const data = await res.json();
                if (data.success) {
                    alert("Message sent!");
                    toggleCompose();
                    document.getElementById('mail-to').value = '';
                    document.getElementById('mail-subject').value = '';
                    document.getElementById('mail-content').value = '';
                }
            } catch (err) {
                alert("傳送失敗");
            } finally {
                btn.textContent = "Send"; btn.style.backgroundColor = "#0b57d0";
            }
        }
    </script>
</body>
</html>

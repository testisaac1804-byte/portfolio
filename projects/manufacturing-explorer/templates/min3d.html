<!DOCTYPE html>
<html><body style="margin:0;background:#0d1117;overflow:hidden">
<script type="importmap">
{"imports":{"three":"/static/three.module.js","three/addons/":"/static/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const S=new THREE.Scene(); S.background=new THREE.Color(0x0d1117);
const C=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,2000);
C.position.set(10,8,10); C.lookAt(0,0,0);
const R=new THREE.WebGLRenderer({antialias:true});
R.setSize(innerWidth,innerHeight); R.shadowMap.enabled=true;
document.body.appendChild(R.domElement);
new OrbitControls(C,R.domElement);

S.add(new THREE.AmbientLight(0xffffff,0.6));
S.add(new THREE.DirectionalLight(0xffffff,2).position.set(5,10,5));
S.add(new THREE.GridHelper(10,10,0x30363d,0x21262d));

// Red cube — unmistakable
S.add(new THREE.Mesh(new THREE.BoxGeometry(2,2,2),new THREE.MeshStandardMaterial({color:0xff3333,roughness:0.2,metalness:0.3})));
// Blue sphere
S.add(new THREE.Mesh(new THREE.SphereGeometry(0.8,32,32),new THREE.MeshStandardMaterial({color:0x3388ff,roughness:0.1,metalness:0.5})).translateX(2.5));
// Green cone
S.add(new THREE.Mesh(new THREE.ConeGeometry(1,2,16),new THREE.MeshStandardMaterial({color:0x33ff55,roughness:0.1,metalness:0.5})).translateX(-2.5).translateY(0.5));

function anim(){requestAnimationFrame(anim);R.render(S,C)}
anim();
</script>
</body></html>

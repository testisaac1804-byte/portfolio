<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32-C3 AdBlock</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--text:#e6edf3;--muted:#8b949e;--accent:#22c55e;--accentdim:rgba(34,197,94,.14);--border:#30363d;--red:#f85149;--amber:#f0883e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.win{width:100%;max-width:800px;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.tb{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#10151c;border-bottom:1px solid var(--border)}
.dots{display:flex;gap:7px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.tb .t{flex:1;text-align:center;font-size:12.5px;color:var(--muted);letter-spacing:.3px}
.tb .side{width:44px}
.body{padding:22px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.hd h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accentdim);display:flex;align-items:center;justify-content:center;font-size:18px}
.pill{font-size:11px;font-weight:600;color:var(--accent);background:var(--accentdim);border:1px solid rgba(34,197,94,.4);padding:4px 10px;border-radius:20px;font-family:ui-monospace,Menlo,monospace}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.8px}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:16px}
.card h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.dev{display:flex;flex-direction:column;gap:8px}
.dev .row{display:flex;align-items:center;gap:10px;padding:9px 11px;background:#21262d;border-radius:8px}
.dev .icon{width:30px;height:30px;border-radius:7px;background:var(--accentdim);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.dev .meta{flex:1;min-width:0}
.dev .name{font-size:13px;font-weight:600}
.dev .sub{font-size:10.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev .cnt{font-size:13px;font-weight:700;color:var(--accent);flex-shrink:0;text-align:right}
.dev .cnt .k{display:block;font-size:9px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:8px}
.bars .b{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:3px;opacity:.85;transition:height .4s ease}
.bars .b.dim{opacity:.25}
.bars-wrap .axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px;font-family:ui-monospace,Menlo,monospace}
@media(max-width:620px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="win">
  <div class="tb">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="t">ESP32-C3 AdBlock — Network DNS Sinkhole</div>
    <div class="side"></div>
  </div>
  <div class="body">
    <div class="hd">
      <h1><span class="logo">📶</span> ESP32-C3 AdBlock</h1>
      <span class="pill">SINKHOLE ACTIVE</span>
    </div>

    <div class="stats">
      <div class="stat"><div class="v" id="stDevices">5</div><div class="k">Devices</div></div>
      <div class="stat"><div class="v" id="stBlocked">0</div><div class="k">Queries blocked</div></div>
      <div class="stat"><div class="v" id="stPct">98.2%</div><div class="k">Block rate</div></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3>Connected devices</h3>
        <div class="dev" id="devices"></div>
      </div>
      <div class="card bars-wrap">
        <h3>Blocks over time</h3>
        <div class="bars" id="bars"></div>
        <div class="axis"><span>60s ago</span><span>now</span></div>
      </div>
    </div>
  </div>
</div>
<script>
var A = {
  total: 0,
  devices: [
    {name:"MacBook Pro", mac:"A4:83:E7:11:22:33", ip:"192.168.4.11", icon:"💻", count:0},
    {name:"iPhone 14", mac:"F0:18:98:55:66:77", ip:"192.168.4.12", icon:"📱", count:0},
    {name:"iPad Air", mac:"D4:61:DA:88:99:00", ip:"192.168.4.13", icon:"📱", count:0},
    {name:"Smart TV", mac:"B8:27:EB:AA:BB:CC", ip:"192.168.4.14", icon:"📺", count:0},
    {name:"Google Nest", mac:"48:D6:D5:DD:EE:FF", ip:"192.168.4.15", icon:"🔊", count:0}
  ],
  bars: [6,9,12,8,15,11,18,14,9,13,17,12,8,10,16,20,13,11,15,9,14,18,12,10],
  tick: function(){
    var d = A.devices[Math.floor(Math.random() * A.devices.length)];
    var inc = Math.floor(Math.random() * 4);
    d.count += inc; A.total += inc;
    A.bars.push(Math.max(3, Math.floor(Math.random() * 22)));
    if (A.bars.length > 24) A.bars.shift();
    A.renderBars();
    A.renderDevices();
    document.getElementById("stBlocked").textContent = A.total.toLocaleString();
  },
  renderDevices: function(){
    var html = "";
    for (var i = 0; i < A.devices.length; i++) {
      var d = A.devices[i];
      html += '<div class="row"><div class="icon">' + d.icon + '</div>' +
        '<div class="meta"><div class="name">' + d.name + '</div>' +
        '<div class="sub">' + d.mac + ' · ' + d.ip + '</div></div>' +
        '<div class="cnt">' + d.count + '<span class="k">blocked</span></div></div>';
    }
    document.getElementById("devices").innerHTML = html;
  },
  renderBars: function(){
    var html = "";
    var max = 22;
    for (var i = 0; i < A.bars.length; i++) {
      var h = Math.round((A.bars[i] / max) * 150);
      var dim = (i < A.bars.length - 1) ? " dim" : "";
      html += '<div class="b' + dim + '" style="height:' + h + 'px"></div>';
    }
    document.getElementById("bars").innerHTML = html;
  },
  init: function(){
    A.renderDevices();
    A.renderBars();
    document.getElementById("stBlocked").textContent = A.total.toLocaleString();
    setInterval(A.tick, 1000);
  }
};
A.init();
</script>
</body>
</html>

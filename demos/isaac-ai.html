<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Isaac AI — Multi-Personality Assistant</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--text:#e6edf3;--muted:#8b949e;--accent:#6366f1;--border:#30363d;--good:#4ade80}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.window{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:840px;max-width:100%;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden}
.titlebar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--panel2);border-bottom:1px solid var(--border)}
.dots{display:flex;gap:8px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.title{margin:0 auto;font-size:13px;color:var(--muted);font-weight:600}
.title .ic{color:var(--accent)}
.layout{display:flex;height:480px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.picker{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.persona{flex:1;min-width:90px;text-align:center;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 6px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600}
.persona .emo{font-size:18px;display:block;margin-bottom:2px}
.persona.on{border-color:var(--accent);color:var(--text);background:rgba(99,102,241,.12)}
.persona.on .emo{filter:none}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.5;animation:pop .18s ease}
.msg.in{background:var(--panel2);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
.msg.out{background:rgba(99,102,241,.2);border:1px solid rgba(99,102,241,.4);align-self:flex-end;border-bottom-right-radius:4px}
.msg .who{font-size:11px;font-weight:700;margin-bottom:3px;color:var(--accent)}
.msg.out .who{color:var(--muted)}
.compose{border-top:1px solid var(--border);padding:12px;display:flex;gap:10px}
.compose input{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px 13px;font-size:14px;outline:none}
.compose input:focus{border-color:var(--accent)}
.compose button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer}
.compose button:hover{background:#4f46e5}
.memory{width:230px;border-left:1px solid var(--border);background:var(--panel2);display:flex;flex-direction:column}
.memhead{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 14px 8px;display:flex;align-items:center;gap:6px}
.memlist{flex:1;overflow-y:auto;padding:0 14px 14px}
.fact{background:var(--panel);border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:8px;color:var(--text);line-height:1.4}
.fact .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.memempty{color:var(--muted);font-size:12px;font-style:italic}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
    <div class="title"><span class="ic">✨</span> Isaac AI</div>
  </div>
  <div class="layout">
    <div class="main">
      <div class="picker" id="picker">
        <div class="persona on" id="p0" onclick="IA.setPersona(0)"><span class="emo">😊</span>Friendly</div>
        <div class="persona" id="p1" onclick="IA.setPersona(1)"><span class="emo">🎓</span>Teacher</div>
        <div class="persona" id="p2" onclick="IA.setPersona(2)"><span class="emo">💻</span>Hacker</div>
      </div>
      <div class="msgs" id="msgs">
        <div class="msg in"><div class="who">Isaac AI</div>Hi! I'm Isaac AI. I can switch personalities and I remember things you tell me. Try "My name is Alex" or "I like pizza" — I'll store it in memory. 🧠</div>
      </div>
      <div class="compose">
        <input type="text" id="txt" placeholder="Message Isaac AI…" onkeydown="if(event.key==='Enter')IA.send()">
        <button onclick="IA.send()">Send</button>
      </div>
    </div>
    <div class="memory">
      <div class="memhead">🧠 Memory</div>
      <div class="memlist" id="mem"><div class="memempty">Nothing remembered yet.</div></div>
    </div>
  </div>
</div>
<script>
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pick(arr){return arr[(Math.random()*arr.length)|0];}
var PERSONAS=[
  {name:'Friendly',emo:'😊',greet:function(n){return 'Hey'+(n?' '+n:'')+'! 😊 So great to chat. What\u2019s up?'},},
  {name:'Teacher',emo:'🎓',greet:function(n){return 'Welcome'+(n?' '+n:'')+'. Today we\u2019ll learn something new. What would you like to understand? 📚'}},
  {name:'Hacker',emo:'💻',greet:function(n){return 'Yo'+(n?' '+n:'')+'. sys://online. I speak in packets and privileges. What\u2019s the mission? ⚡'}}
];
function extractFacts(t){
  var facts=[];
  var m;
  m=t.match(/my name is (\w[\w\s']*)/i);if(m)facts.push(['name',m[1].trim()]);
  if(!facts.length){m=t.match(/i am (\w[\w\s']*)/i);if(m)facts.push(['name',m[1].trim()]);}
  m=t.match(/i like (\w[\w\s']*)/i);if(m)facts.push(['likes',m[1].trim()]);
  m=t.match(/i love (\w[\w\s']*)/i);if(m)facts.push(['loves',m[1].trim()]);
  m=t.match(/i (?:live in|am from|study) ([A-Z][\w\s']*)/i);if(m)facts.push(['context',m[1].trim()]);
  m=t.match(/my (?:favourite|favorite) (\w+) is (\w[\w\s']*)/i);if(m)facts.push(['favourite '+m[1].toLowerCase(),m[2].trim()]);
  return facts;
}
function reply(raw,persona,name){
  var t=raw.toLowerCase();
  if(/remember|my name|i am|i like|i love|i live|favourite|favorite/.test(t)){
    if(persona===0)return 'Noted! 🧠 I\u2019ve saved that to my memory. I\u2019ll remember it next time we talk.';
    if(persona===1)return 'Excellent — I\u2019ve recorded that in long-term memory. Good students share details like this. 📚';
    return 'saved >> /memory/user.profile ✓ (sha256 verified). I won\u2019t forget it.';
  }
  if(/what do you remember|what do you know about me|memory/.test(t)){
    return persona===2 ? 'dumping user.profile from cache… check the memory panel on the right. ⚡'
      : 'Check the 🧠 Memory panel on the right — that\u2019s everything I\u2019ve learned about you!';
  }
  if(/what is|how do|why|explain/.test(t)){
    if(persona===0)return 'Great question! In simple terms: it comes down to a few key ideas working together. Want me to break it down step by step? 😊';
    if(persona===1)return 'Let\u2019s approach this systematically. First, define the core concept. Second, understand the mechanism. Finally, test with an example. Shall we start with the definition? 🎓';
    return 'Interesting query. Decomposing into layers: concept → mechanism → edge cases. The short answer requires a kernel-level explanation. Want the deep dive? ⚡';
  }
  if(/hello|hi |hey|yo/.test(t)){
    return PERSONAS[persona].greet(name);
  }
  if(/thank/.test(t)){
    return persona===0?'You\u2019re so welcome! Anytime. 😊':persona===1?'You\u2019re welcome. Keep asking great questions. 🎓':'np. credits to your curiosity. ⚡';
  }
  if(persona===0)return pick(['That\u2019s really interesting — tell me more! 😊','Got it! I\u2019m here to help with anything.','Love that. What else is on your mind?']);
  if(persona===1)return pick(['A thoughtful point. Let\u2019s explore that idea further.','Good — consider this: there may be a deeper principle at work.','I see. Would you like me to frame that as a lesson?']);
  return pick(['ACK. processing… that\u2019s an interesting input vector.','hmm. low entropy answer, but I\u2019ll run with it. ⚡','firewall\u2019s up, coffee\u2019s hot. say more?']);
}
var IA={
  persona:0,facts:[],name:null,
  setPersona:function(i){
    this.persona=i;
    for(var k=0;k<3;k++){document.getElementById('p'+k).className='persona'+(k===i?' on':'');}
    var msgs=document.getElementById('msgs');
    msgs.insertAdjacentHTML('beforeend','<div class="msg in"><div class="who">Isaac AI · '+PERSONAS[i].emo+' '+PERSONAS[i].name+'</div>'+esc(PERSONAS[i].greet(this.name))+'</div>');
    msgs.scrollTop=msgs.scrollHeight;
  },
  send:function(){
    var t=document.getElementById('txt');var v=t.value.trim();if(!v)return;t.value='';
    var msgs=document.getElementById('msgs');
    msgs.insertAdjacentHTML('beforeend','<div class="msg out"><div class="who">You</div>'+esc(v)+'</div>');
    var fs=extractFacts(v);
    var learned=false;
    for(var i=0;i<fs.length;i++){
      if(!this.hasFact(fs[i][0],fs[i][1])){this.facts.push(fs[i]);learned=true;}
      if(fs[i][0]==='name')this.name=fs[i][1];
    }
    if(learned)this.renderMem();
    setTimeout(function(){
      msgs.insertAdjacentHTML('beforeend','<div class="msg in"><div class="who">Isaac AI · '+PERSONAS[IA.persona].emo+' '+PERSONAS[IA.persona].name+'</div>'+esc(reply(v,IA.persona,IA.name))+'</div>');
      msgs.scrollTop=msgs.scrollHeight;
    },650);
  },
  hasFact:function(k,v){for(var i=0;i<this.facts.length;i++){if(this.facts[i][0]===k&&this.facts[i][1].toLowerCase()===v.toLowerCase())return true;}return false;},
  renderMem:function(){
    var el=document.getElementById('mem');
    if(!this.facts.length){el.innerHTML='<div class="memempty">Nothing remembered yet.</div>';return;}
    var h='';
    for(var i=0;i<this.facts.length;i++){h+='<div class="fact"><div class="k">'+esc(this.facts[i][0])+'</div>'+esc(this.facts[i][1])+'</div>';}
    el.innerHTML=h;
  }
};
</script>
</body>
</html>

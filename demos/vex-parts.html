<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEX Components — Interactive Reference (IQ 2nd Gen + V5)</title>
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#243349; --line:#334155; --txt:#e2e8f0; --dim:#94a3b8;
  --acc:#38bdf8; --iq:#f97316; --v5:#0ea5e9;
  --c-electronics:#2563eb; --c-sensors:#16a34a; --c-structure:#ea580c; --c-fasteners:#64748b;
  --c-motion:#dc2626; --c-specialty:#9333ea; --c-tools:#a16207;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:50;background:rgba(15,23,42,.96);border-bottom:1px solid var(--line);padding:14px 20px 10px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:22px;letter-spacing:.4px}
h1 small{color:var(--dim);font-weight:400;font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--acc)}
button.active{background:var(--acc);color:#06121f;border-color:var(--acc);font-weight:600}
input[type=search]{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 12px;font-size:13px;width:230px;font-family:inherit}
input[type=search]:focus{outline:none;border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:1400px;margin:10px auto 0}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--dim);cursor:pointer}
.chip.on{color:#fff;border-color:transparent}
.chip .n{opacity:.75;font-size:10.5px;margin-left:3px}
#info{max-width:1400px;margin:10px auto 0;color:var(--dim);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
main{max-width:1400px;margin:18px auto;padding:0 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:transform .08s,border-color .08s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-2px);border-color:var(--acc)}
.card .bar{height:4px;border-radius:3px;margin-bottom:9px}
.card .nm{font-size:14.5px;font-weight:600;line-height:1.25}
.card .sub{font-size:11.5px;color:var(--dim);margin-top:3px}
.card .dd{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:11px;color:var(--dim)}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.5px}
.badge.IQ{background:rgba(249,115,22,.16);color:#fdba74;border:1px solid rgba(249,115,22,.4)}
.badge.V5{background:rgba(14,165,233,.16);color:#7dd3fc;border:1px solid rgba(14,165,233,.4)}
.qty{font-weight:600;color:var(--txt)}
.qty.addon{color:#c084fc}
.pn{font-family:ui-monospace,Menlo,monospace;font-size:10.5px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(2,6,23,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.open{display:flex}
.dbox{background:var(--card2);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;padding:24px;max-height:85vh;overflow:auto}
.dbox h2{font-size:19px;margin-bottom:2px}
.dbox .pn{color:var(--dim);margin:6px 0 12px}
.dbox .desc{font-size:14.5px;line-height:1.6;color:var(--txt)}
.dbox .row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.k{font-size:12px;color:var(--dim)}
.k b{color:var(--txt)}
.close{float:right;background:none;border:none;font-size:22px;color:var(--dim);cursor:pointer}
.empty{color:var(--dim);text-align:center;padding:50px 0;font-size:15px}
/* quiz */
#quiz{max-width:640px;margin:20px auto;text-align:center}
#quiz .qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
#quiz .qname{font-size:22px;font-weight:700;margin:14px 0 4px}
#quiz .qsub{color:var(--dim);font-size:13px}
#quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
#quiz .opt{font-size:14px;padding:14px;text-align:center}
#quiz .opt.correct{background:#14532d;border-color:#4ade80;color:#bbf7d0}
#quiz .opt.wrong{background:#7f1d1d;border-color:#f87171;color:#fecaca}
#quiz .opt:disabled{cursor:default}
.score{font-size:14px;color:var(--dim);margin-top:14px}
.score b{color:var(--acc);font-size:18px}
.hidden{display:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media print{
  @page{size:A3 landscape;margin:8mm}
  body{background:#fff}
  header,.chips,#info,.no-print,.legend{display:none!important}
  main{margin:0;padding:0;max-width:none}
  .grid{grid-template-columns:repeat(3,1fr);gap:6px}
  .card{background:#fff;border:1px solid #ccc;border-radius:6px;break-inside:avoid;padding:8px}
  .card .dd{color:#444}
  .card .sub,.card .meta{color:#666}
  .card:hover{transform:none;border-color:#ccc}
  .card .bar{margin-bottom:6px}
  #quiz{display:none!important}
  .badge.IQ{background:#fde7d2;color:#7c2d12;border-color:#fdba74}
  .badge.V5{background:#d7ecfb;color:#075985;border-color:#7dd3fc}
}
</style>
</head>
<body>
<header>
  <div class="top">

    <div class="controls no-print">

  <div id="info"><span id="count"></span><span class="legend"></span></div>

<main id="browse"><div class="grid" id="grid"></div></main>

<div id="quiz" class="hidden">

  <p class="score">Round <span id="quizRound">1</span>/10 · score <b id="quizPts">0</b></p>
  <button class="no-print" style="margin-top:10px" onclick="backToBrowse()">← Back to parts</button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeM()">
  <div class="dbox">
    <button class="close" onclick="closeM()">×</button>
    <div id="mBadge"></div>
    <h2 id="mName"></h2>
    <div class="pn" id="mPn"></div>
    <div class="desc" id="mDesc"></div>
    <div class="row">
      <span class="k"><b>Category:</b> <span id="mCat"></span></span>
      <span class="k"><b>Platform:</b> <span id="mPl"></span></span>
      <span class="k"><b>In kit:</b> <span id="mQty"></span></span>
    </div>
  </div>
</div>

, anti-static rubber.", "sub": "Wheels"}, {"pl": "V5", "cat": "Wheels", "n": "Wheel 4 in Omni (320 mm travel)", "q": 4, "pn": "", "d": "Omni wheel — small rollers let the robot strafe sideways.", "sub": "Wheels"}, {"pl": "V5", "cat": "Wheels", "n": "Intake Roller", "q": 8, "pn": "", "d": "Soft roller — pulls game objects into an intake.", "sub": "Wheels"}, {"pl": "V5", "cat": "Pneumatics", "n": "Air Cylinder", "q": null, "pn": "", "d": "Add-on (Pneumatics kit) — pneumatic ram that pushes/pulls with air power.", "sub": "Pneumatics"}, {"pl": "V5", "cat": "Pneumatics", "n": "Solenoid Valve", "q": null, "pn": "", "d": "Add-on — electrically switches air to the cylinders (3-wire port).", "sub": "Pneumatics"}, {"pl": "V5", "cat": "Pneumatics", "n": "Air Tank", "q": null, "pn": "", "d": "Add-on — stores compressed air.", "sub": "Pneumatics"}, {"pl": "V5", "cat": "Pneumatics", "n": "Pneumatic Tubing & Fittings", "q": null, "pn": "", "d": "Add-on — hoses and connectors between tank, valve and cylinders.", "sub": "Pneumatics"}, {"pl": "V5", "cat": "Tools", "n": "T15 Star Screwdriver", "q": 4, "pn": "", "d": "Torx screwdriver for all V5 screws.", "sub": "Tools"}, {"pl": "V5", "cat": "Tools", "n": "T15 Star Key", "q": 2, "pn": "", "d": "Small Torx L-wrench.", "sub": "Tools"}, {"pl": "V5", "cat": "Tools", "n": "T8 Star Key", "q": 2, "pn": "", "d": "Tiny Torx wrench — setscrews and collars.", "sub": "Tools"}, {"pl": "V5", "cat": "Tools", "n": "Open-End Wrench", "q": 6, "pn": "", "d": "Wrench for hex nuts.", "sub": "Tools"}, {"pl": "V5", "cat": "Tools", "n": "Zip Tie 4 in", "q": 600, "pn": "", "d": "Cable ties — tidy wiring, quick mounting.", "sub": "Tools"}, {"pl": "V5", "cat": "Tools", "n": "Zip Tie 11 in", "q": 50, "pn": "", "d": "Long cable ties.", "sub": "Tools"}, {"pl": "V5", "cat": "Tools", "n": "Rubber Band #64", "q": 20, "pn": "", "d": "Small rubber bands — spring tension.", "sub": "Tools"}, {"pl": "V5", "cat": "Tools", "n": "Anti-Slip Mat 12x15 in", "q": 1, "pn": "", "d": "Stops the robot sliding on the workbench.", "sub": "Tools"}];
var PL = "ALL", CATS = new Set(), curCat = "";
var CAT_COLORS = {Electronics:"#2563eb",Sensors:"#16a34a",Structure:"#ea580c",Fasteners:"#64748b","Gears & Sprockets":"#dc2626","Chain & Treads":"#dc2626",Wheels:"#dc2626","Shafts & Bearings":"#dc2626","Plates & Connectors":"#ea580c",Pins:"#64748b",Pneumatics:"#9333ea",Tools:"#a16207",Specialty:"#9333ea"};
var QUIZ = [], qi = 0, pts = 0, round = 1;

PARTS.forEach(function(p){ if(!CATS.has(p.cat)) CATS.add(p.cat); });
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function catColor(c){return CAT_COLORS[c]||"#38bdf8"}
function barColor(p){return p.pl==="IQ" ? "rgba(249,115,22,.75)" : "rgba(14,165,233,.75)"}

function legend(){
  var el=document.querySelector(".legend"), h="";
  Array.from(CATS).forEach(function(c){h+='<span><i style="background:'+catColor(c)+'"></i>'+esc(c)+'</span>'});
  el.innerHTML=h;
}
function chips(){
  var el=document.getElementById("chips"), h='<button class="chip on" data-c="" onclick="setCat(this,this.dataset.c)">All categories <span class="n"></span></button>';
  Array.from(CATS).sort().forEach(function(c){
    var n=PARTS.filter(function(p){return (PL==="ALL"||p.pl===PL)&&p.cat===c}).length;
    h+='<button class="chip" data-c="'+esc(c)+'" style="border-color:'+catColor(c)+'" onclick="setCat(this,this.dataset.c)">'+esc(c)+' <span class="n">'+n+'</span></button>';
  });
  el.innerHTML=h;
}
function setPl(pl){
  PL=pl;
  ["bAll","bIQ","bV5"].forEach(function(id){document.getElementById(id).classList.toggle("active", id==="bAll"?pl==="ALL":id==="bIQ"?pl==="IQ":pl==="V5")});
  chips(); render();
}
function setCat(btn,c){
  curCat=c;
  document.querySelectorAll("#chips .chip").forEach(function(b){b.classList.toggle("on", b.dataset.c===c)});
  render();
}
function filtered(){
  var q=(document.getElementById("q").value||"").toLowerCase();
  return PARTS.filter(function(p){
    if(PL!=="ALL"&&p.pl!==PL)return false;
    if(curCat&&p.cat!==curCat)return false;
    if(q&&(p.n.toLowerCase().indexOf(q)<0)&&(p.d||"").toLowerCase().indexOf(q)<0&&(p.pn||"").toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function render(){
  var arr=filtered(), sort=document.getElementById("sort").value;
  if(sort==="name")arr.sort(function(a,b){return a.n.localeCompare(b.n)});
  else if(sort==="qty")arr.sort(function(a,b){return (b.q||0)-(a.q||0)});
  else arr.sort(function(a,b){return (a.pl===b.pl?0:a.pl<b.pl?-1:1)||a.cat.localeCompare(b.cat)||a.n.localeCompare(b.n)});
  document.getElementById("count").textContent=arr.length+" of "+PARTS.length+" parts shown";
  var el=document.getElementById("grid");
  if(!arr.length){el.innerHTML='<div class="empty">No parts match — try a different search or filter.</div>';return}
  el.innerHTML=arr.map(function(p,i){
    var qty = p.q ? '<span class="qty">'+p.q+'×</span>' : '<span class="qty addon">add-on</span>';
    return '<div class="card" onclick="openM('+(PARTS.indexOf(p))+')">'+
      '<div class="bar" style="background:'+catColor(p.cat)+'"></div>'+
      '<span class="badge '+p.pl+'">'+p.pl+'</span> '+
      '<div class="nm">'+esc(p.n)+'</div>'+
      '<div class="sub">'+esc(p.cat)+'</div>'+
      '<div class="dd">'+esc(p.d)+'</div>'+
      '<div class="meta"><span>'+qty+'</span><span class="pn">'+(p.pn?esc(p.pn):"")+'</span></div>'+
      '</div>';
  }).join("");
}
function openM(i){
  var p=PARTS[i];
  document.getElementById("mBadge").innerHTML='<span class="badge '+p.pl+'">'+p.pl+'</span>';
  document.getElementById("mName").textContent=p.n;
  document.getElementById("mPn").textContent=p.pn?("Part # "+p.pn):"No part number listed (kit bulk part)";
  document.getElementById("mDesc").textContent=p.d;
  document.getElementById("mCat").textContent=p.cat;
  document.getElementById("mPl").textContent=p.pl==="IQ"?"VEX IQ (2nd Gen)":"VEX V5";
  document.getElementById("mQty").textContent=p.q?(p.q+" in the standard kit"):"add-on / not in standard kit";
  document.getElementById("modal").classList.add("open");
}
function closeM(){document.getElementById("modal").classList.remove("open")}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});

/* ---------- self-test quiz (Can You Name That Part?) ---------- */
function showQuiz(){
  document.getElementById("browse").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  var pool=PARTS.slice();
  QUIZ=[]; qi=0; pts=0; round=1;
  while(QUIZ.length<10&&pool.length){var j=Math.floor(Math.random()*pool.length);QUIZ.push(pool.splice(j,1)[0])}
  nextQ();
}
function nextQ(){
  if(qi>=QUIZ.length){finishQuiz();return}
  document.getElementById("quizNext").style.display="none";
  var p=QUIZ[qi];
  document.getElementById("quizPl").innerHTML='<span class="badge '+p.pl+'">'+p.pl+'</span>';
  document.getElementById("quizName").textContent=p.n;
  document.getElementById("quizSub").textContent="What category is this part from?";
  var opts=[p.cat];
  var others=Array.from(CATS).filter(function(c){return c!==p.cat});
  while(opts.length<4&&others.length){var j=Math.floor(Math.random()*others.length);var c=others.splice(j,1)[0];if(opts.indexOf(c)<0)opts.push(c)}
  opts.sort(function(){return Math.random()-.5});
  document.getElementById("quizOpts").innerHTML=opts.map(function(c){
    return '<button class="opt" data-c="'+esc(c)+'" onclick="pick(this,this.dataset.c)">'+esc(c)+'</button>';
  }).join("");
  document.getElementById("quizRound").textContent=qi+1;
  document.getElementById("quizPts").textContent=pts;
}
function pick(btn,c){
  var p=QUIZ[qi], correct=p.cat===c;
  if(correct)pts++;
  document.querySelectorAll("#quizOpts .opt").forEach(function(b){
    b.disabled=true;
    if(b.textContent===p.cat)b.classList.add("correct");
    else if(b===btn)b.classList.add("wrong");
  });
  qi++;
  document.getElementById("quizPts").textContent=pts;
  document.getElementById("quizNext").style.display="inline-block";
  document.getElementById("quizNext").textContent=qi>=QUIZ.length?"See result ➜":"Next ➜";
}
function finishQuiz(){
  document.getElementById("quizName").textContent="Done!";
  document.getElementById("quizSub").textContent="You scored "+pts+" / "+QUIZ.length+(pts>=8?" — VEX parts master! 🏆":pts>=5?" — getting there!":" — open the reference and study the categories");
  document.getElementById("quizPl").innerHTML="";
  document.getElementById("quizOpts").innerHTML="";
  document.getElementById("quizNext").style.display="none";
}
function backToBrowse(){
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("browse").classList.remove("hidden");
}
legend(); chips(); render();
</script>

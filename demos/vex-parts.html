<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEX Universe — Interactive Reference</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#243349;--line:#334155;--txt:#e2e8f0;--dim:#94a3b8;--acc:#38bdf8;--iq:#f97316;--v5:#0ea5e9;
--c-electronics:#2563eb;--c-sensors:#16a34a;--c-structure:#ea580c;--c-fasteners:#64748b;--c-motion:#dc2626;--c-specialty:#9333ea;--c-tools:#a16207}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:50;background:rgba(15,23,42,.97);border-bottom:1px solid var(--line);padding:12px 20px 10px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:21px;letter-spacing:.4px}
h1 small{color:var(--dim);font-weight:400;font-size:12.5px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:inherit}
button:hover{border-color:var(--acc)}
button.active{background:var(--acc);color:#06121f;border-color:var(--acc);font-weight:600}
input[type=search],select{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit}
input[type=search]:focus{outline:none;border-color:var(--acc)}
input[type=number]{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 8px;font-size:13px;width:80px;font-family:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:1400px;margin:8px auto 0}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--dim);cursor:pointer}
.chip.on{color:#fff;border-color:transparent}
.chip .n{opacity:.75;font-size:10.5px;margin-left:3px}
.krow{margin-top:6px}
#info{max-width:1400px;margin:8px auto 0;color:var(--dim);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
main{max-width:1400px;margin:16px auto;padding:0 20px 60px}
section{display:none}
section.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:transform .08s,border-color .08s}
.card:hover{transform:translateY(-2px);border-color:var(--acc)}
.card .bar{height:4px;border-radius:3px;margin-bottom:9px}
.card .nm{font-size:14.5px;font-weight:600;line-height:1.25}
.card .sub{font-size:11.5px;color:var(--dim);margin-top:3px}
.card .dd{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:11px;color:var(--dim);gap:6px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.5px;white-space:nowrap}
.badge.IQ{background:rgba(249,115,22,.16);color:#fdba74;border:1px solid rgba(249,115,22,.4)}
.badge.V5{background:rgba(14,165,233,.16);color:#7dd3fc;border:1px solid rgba(14,165,233,.4)}
.kit{font-size:9.5px;padding:2px 6px;border-radius:6px;background:#334155;color:#cbd5e1;border:1px solid #475569;white-space:nowrap}
.kit.addon{background:#3b1d5c;color:#d8b4fe;border-color:#6b21a8}
.qty{font-weight:600;color:var(--txt)}
.qty.addon{color:#c084fc}
.pn{font-family:ui-monospace,Menlo,monospace;font-size:10px;color:var(--dim)}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.open{display:flex}
.dbox{background:var(--card2);border:1px solid var(--line);border-radius:16px;max-width:580px;width:100%;padding:24px;max-height:85vh;overflow:auto}
.dbox h2{font-size:19px;margin-bottom:2px}
.dbox .pn{color:var(--dim);margin:6px 0 12px}
.dbox .desc{font-size:14.5px;line-height:1.6}
.dbox .row{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}
.k{font-size:12px;color:var(--dim)}
.k b{color:var(--txt)}
.close{float:right;background:none;border:none;font-size:22px;color:var(--dim);cursor:pointer}
.empty{color:var(--dim);text-align:center;padding:50px 0;font-size:15px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* tools */
.calc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:720px}
.calc .row{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:16px;align-items:end}
.calc label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.calc .out{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:6px}
.calc .out b{color:var(--acc);font-size:22px}
.calc .out .ln{font-size:13px;color:var(--txt);margin:4px 0}
.calc .out .note{font-size:12px;color:var(--dim);margin-top:8px}
.pills{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.pill{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--dim);cursor:pointer}
.pill.on{background:var(--acc);color:#06121f;border-color:var(--acc);font-weight:600}
/* mechanisms & platforms */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.mcard h3{font-size:16px;margin-bottom:4px}
.mcard .tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(56,189,248,.14);color:#7dd3fc;border:1px solid rgba(56,189,248,.35);display:inline-block;margin-bottom:8px}
.mcard .dd{font-size:13px;color:var(--dim);line-height:1.55;margin-bottom:10px}
.mcard .pl{font-size:11.5px;color:var(--dim);margin-bottom:8px}
.mcard .pl b{color:var(--txt)}
.pchip{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:#93c5fd;cursor:pointer;margin:2px 3px 0 0;display:inline-block}
.pchip:hover{border-color:var(--acc)}
.tip{font-size:12px;color:#86efac;background:rgba(74,222,128,.07);border-left:3px solid #4ade80;padding:7px 10px;border-radius:0 8px 8px 0;margin-top:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.pcard h3{font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pcard .g{font-size:11px;color:#fbbf24;font-weight:600;white-space:nowrap}
.pcard .dd{font-size:13px;color:var(--dim);line-height:1.55;margin:8px 0}
.pcard .hw{font-size:11.5px;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pcard .hw b{color:var(--dim);font-weight:600}
/* glossary */
.gterm{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.gterm b{color:var(--acc);font-size:14px}
.gterm p{color:var(--dim);font-size:12.5px;margin-top:3px;line-height:1.5}
/* quiz */
#quiz{max-width:640px;margin:20px auto;text-align:center}
#quiz .qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
#quiz .qname{font-size:22px;font-weight:700;margin:14px 0 4px}
#quiz .qsub{color:var(--dim);font-size:13px}
#quiz .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
#quiz .opt{font-size:14px;padding:14px;text-align:center}
#quiz .opt.correct{background:#14532d;border-color:#4ade80;color:#bbf7d0}
#quiz .opt.wrong{background:#7f1d1d;border-color:#f87171;color:#fecaca}
#quiz .opt:disabled{cursor:default}
.hidden{display:none}
@media print{
  @page{size:A3 landscape;margin:8mm}
  body{background:#fff}
  header,.chips,#info,.no-print,.legend{display:none!important}
  main{margin:0;padding:0;max-width:none}
  section{display:none!important}
  #secParts{display:block!important}
  .grid{grid-template-columns:repeat(3,1fr);gap:6px}
  .card{background:#fff;border:1px solid #ccc;border-radius:6px;break-inside:avoid;padding:8px;cursor:default}
  .card .dd{color:#444}
  .card .sub,.card .meta,.card .pn{color:#666}
  .card:hover{transform:none;border-color:#ccc}
  .badge.IQ{background:#fde7d2;color:#7c2d12;border-color:#fdba74}
  .badge.V5{background:#d7ecfb;color:#075985;border-color:#7dd3fc}
  .kit{background:#eee;color:#333;border-color:#bbb}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>VEX Universe <small>— parts, tools &amp; platforms · IQ (2nd Gen) + V5 + the whole ecosystem</small></h1>
    <div class="controls no-print">
      <button id="tParts" class="active" onclick="switchTab('Parts')">🧩 Parts</button>
      <button id="tTools" onclick="switchTab('Tools')">🧮 Tools</button>
      <button id="tMech" onclick="switchTab('Mech')">⚙️ Mechanisms</button>
      <button id="tGloss" onclick="switchTab('Gloss')">📖 Glossary</button>
      <button id="tPlat" onclick="switchTab('Plat')">🌐 Platforms</button>
      <button onclick="window.print()" title="Save as PDF — enable ‘Background graphics’">🖨 Print</button>
    </div>
  </div>
  <div class="chips no-print" id="chips"></div>
  <div class="chips krow no-print" id="kchips"></div>
  <div id="info"><span id="count"></span><span class="legend" id="legend"></span></div>
</header>

<main>
<section id="secParts" class="on">
  <div class="controls no-print" style="margin-bottom:12px;gap:8px">
    <input type="search" id="q" placeholder="Search part, number, keyword…" oninput="render()">
    <select id="sort" onchange="render()">
      <option value="cat">Category order</option>
      <option value="name">Name A–Z</option>
      <option value="qty">Most parts</option>
    </select>
    <button id="btnQuiz" onclick="showQuiz()">🎯 Self-Test</button>
    <button id="bAll" class="active" onclick="setPl('ALL')">All</button>
    <button id="bIQ" onclick="setPl('IQ')">IQ</button>
    <button id="bV5" onclick="setPl('V5')">V5</button>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section id="secTools">
  <div class="calc">
    <h2 style="margin-bottom:14px">⚙️ Gear-Ratio Calculator</h2>
    <div class="row">
      <div>
        <label>Platform</label>
        <select id="gcPl" onchange="gcPlChange()">
          <option value="IQ">VEX IQ (gears: 12 / 24 / 36 / 48 / 60)</option>
          <option value="V5">VEX V5 (gears: 12 / 36 / 60 / 84)</option>
        </select>
      </div>
      <div>
        <label>Driving gear (on motor)</label>
        <select id="gcDrv" onchange="gcCalc()"></select>
      </div>
      <div>
        <label>Driven gear (on output)</label>
        <select id="gcDrn" onchange="gcCalc()"></select>
      </div>
      <div>
        <label>Motor RPM</label>
        <input type="number" id="gcRpm" value="100" min="1" oninput="gcCalc()">
      </div>
    </div>
    <div class="pills" id="gcPills"></div>
    <div class="out" id="gcOut"></div>
    <div class="out" style="margin-top:12px" id="gcSpeed"></div>
  </div>
</section>

<section id="secMech">
  <div class="controls no-print" style="margin-bottom:14px"><input type="search" id="mq" placeholder="Search mechanisms…" oninput="renderMech()"></div>
  <div class="mgrid" id="mgrid"></div>
</section>

<section id="secGloss">
  <div class="controls no-print" style="margin-bottom:14px"><input type="search" id="gq" placeholder="Search glossary terms…" oninput="renderGloss()"></div>
  <div id="glist"></div>
</section>

<section id="secPlat">
  <div class="controls no-print" style="margin-bottom:14px"><input type="search" id="pq" placeholder="Search platforms…" oninput="renderPlat()"></div>
  <div class="mgrid" id="pgrid"></div>
</section>
</main>

<div id="quiz" class="hidden">
  <div class="qcard">
    <div id="quizPl"></div>
    <div class="qname" id="quizName"></div>
    <div class="qsub" id="quizSub"></div>
    <div class="opts" id="quizOpts"></div>
    <div class="score" id="quizScore"></div>
    <button class="no-print" id="quizNext" style="margin-top:16px;display:none" onclick="nextQ()">Next ➜</button>
  </div>
  <p class="score">Round <span id="quizRound">1</span>/10 · score <b id="quizPts">0</b></p>
  <button class="no-print" style="margin-top:10px" onclick="backToBrowse()">← Back to parts</button>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeM()">
  <div class="dbox">
    <button class="close" onclick="closeM()">×</button>
    <div id="mBadge"></div>
    <h2 id="mName"></h2>
    <div class="pn" id="mPn"></div>
    <div class="desc" id="mDesc"></div>
    <div class="row">
      <span class="k"><b>Category:</b> <span id="mCat"></span></span>
      <span class="k"><b>Platform:</b> <span id="mPl"></span></span>
      <span class="k"><b>In kit:</b> <span id="mQty"></span></span>
    </div>
  </div>
</div>

 Vision with depth, and sensor-fusion mapping.", "hw": "VEX GPS · AI Vision · LINK radio"}];
var PL="ALL", curCat="", curKit="", QUIZ=[], qi=0, pts=0, round=1;
var KITS=["edu","comp","super","booster","addon"];
var KIT_LABEL={edu:"Edu Kit",comp:"Comp Kit",super:"Super Kit",booster:"Booster",addon:"add-on"};
var CAT_COLORS={Electronics:"#2563eb",Sensors:"#16a34a",Structure:"#ea580c",Fasteners:"#64748b","Gears, Sprockets & Chain":"#dc2626","Shafts & Collars":"#dc2626","Wheels & Treads":"#dc2626","Plates & Connectors":"#ea580c","Pins & Standoffs":"#64748b","Pneumatics & Tools":"#9333ea",Specialty:"#9333ea"};
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function catColor(c){return CAT_COLORS[c]||"#38bdf8"}
function kitHtml(k){return k?'<span class="kit'+(k==="addon"?" addon":"")+'">'+KIT_LABEL[k]+'</span>':""}

/* ---------- tabs ---------- */
function switchTab(t){
  ["Parts","Tools","Mech","Gloss","Plat"].forEach(function(x){document.getElementById("sec"+x).classList.toggle("on",x===t)});
  ["tParts","tTools","tMech","tGloss","tPlat"].forEach(function(x){document.getElementById(x).classList.toggle("active",x==="t"+t)});
}
function goParts(q){
  PL="ALL"; curCat=""; curKit="";
  ["bAll","bIQ","bV5"].forEach(function(id){document.getElementById(id).classList.toggle("active",id==="bAll")});
  document.getElementById("q").value=q||"";
  document.querySelectorAll("#chips .chip").forEach(function(b){b.classList.toggle("on",!b.dataset.c)});
  document.querySelectorAll("#kchips .chip").forEach(function(b){b.classList.toggle("on",!b.dataset.c)});
  switchTab("Parts"); render();
}

/* ---------- parts ---------- */
function legend(){
  var h="",seen={};
  PARTS.forEach(function(p){if(!seen[p.cat]){seen[p.cat]=1;h+='<span><i style="background:'+catColor(p.cat)+'"></i>'+esc(p.cat)+'</span>'}});
  document.getElementById("legend").innerHTML=h;
}
function chips(){
  var cats={},h='<button class="chip on" data-c="" onclick="setCat(this)">All categories <span class="n"></span></button>';
  PARTS.forEach(function(p){if(PL==="ALL"||p.pl===PL)cats[p.cat]=(cats[p.cat]||0)+1});
  Object.keys(cats).sort().forEach(function(c){
    h+='<button class="chip" data-c="'+esc(c)+'" style="border-color:'+catColor(c)+'" onclick="setCat(this)">'+esc(c)+' <span class="n">'+cats[c]+'</span></button>';
  });
  document.getElementById("chips").innerHTML=h;
  var kh='<button class="chip on" data-c="" onclick="setKit(this)">All kits <span class="n"></span></button>';
  KITS.forEach(function(k){
    var n=PARTS.filter(function(p){return (PL==="ALL"||p.pl===PL)&&(p.k||"edu")===k}).length;
    kh+='<button class="chip" data-c="'+k+'" onclick="setKit(this)">'+KIT_LABEL[k]+' <span class="n">'+n+'</span></button>';
  });
  document.getElementById("kchips").innerHTML=kh;
}
function setPl(pl){
  PL=pl;
  [["bAll","ALL"],["bIQ","IQ"],["bV5","V5"]].forEach(function(x){document.getElementById(x[0]).classList.toggle("active",x[1]===pl)});
  chips(); render();
}
function setCat(btn){curCat=btn.dataset.c||"";document.querySelectorAll("#chips .chip").forEach(function(b){b.classList.toggle("on",b===btn)});render()}
function setKit(btn){curKit=btn.dataset.c||"";document.querySelectorAll("#kchips .chip").forEach(function(b){b.classList.toggle("on",b===btn)});render()}
function filtered(){
  var q=(document.getElementById("q").value||"").toLowerCase();
  return PARTS.filter(function(p){
    if(PL!=="ALL"&&p.pl!==PL)return false;
    if(curCat&&p.cat!==curCat)return false;
    if(curKit&&(p.k||"edu")!==curKit)return false;
    if(q&&p.n.toLowerCase().indexOf(q)<0&&(p.d||"").toLowerCase().indexOf(q)<0&&(p.pn||"").toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}
function render(){
  var arr=filtered(),sort=document.getElementById("sort").value;
  if(sort==="name")arr.sort(function(a,b){return a.n.localeCompare(b.n)});
  else if(sort==="qty")arr.sort(function(a,b){return (b.q||0)-(a.q||0)});
  else arr.sort(function(a,b){return (a.pl===b.pl?0:a.pl<b.pl?-1:1)||a.cat.localeCompare(b.cat)||a.n.localeCompare(b.n)});
  document.getElementById("count").textContent=arr.length+" of "+PARTS.length+" parts shown";
  var el=document.getElementById("grid");
  if(!arr.length){el.innerHTML='<div class="empty">No parts match — try a different search or filter.</div>';return}
  el.innerHTML=arr.map(function(p,i){
    var qty=p.q?'<span class="qty">'+p.q+'×</span>':'<span class="qty addon">add-on</span>';
    return '<div class="card" onclick="openM('+(PARTS.indexOf(p))+')">'+
      '<div class="bar" style="background:'+catColor(p.cat)+'"></div>'+
      '<span class="badge '+p.pl+'">'+p.pl+'</span> '+kitHtml(p.k)+
      '<div class="nm">'+esc(p.n)+'</div>'+
      '<div class="sub">'+esc(p.cat)+'</div>'+
      '<div class="dd">'+esc(p.d)+'</div>'+
      '<div class="meta"><span>'+qty+'</span><span class="pn">'+(p.pn?esc(p.pn):"")+'</span></div>'+
      '</div>';
  }).join("");
}
function openM(i){
  var p=PARTS[i];
  document.getElementById("mBadge").innerHTML='<span class="badge '+p.pl+'">'+p.pl+'</span> '+kitHtml(p.k);
  document.getElementById("mName").textContent=p.n;
  document.getElementById("mPn").textContent=p.pn?("Part # "+p.pn):"No part number listed";
  document.getElementById("mDesc").textContent=p.d;
  document.getElementById("mCat").textContent=p.cat;
  document.getElementById("mPl").textContent=p.pl==="IQ"?"VEX IQ (2nd Gen)":"VEX V5";
  document.getElementById("mQty").textContent=p.q?(p.q+" in the "+KIT_LABEL[p.k||"edu"]):"add-on / not in standard kit";
  document.getElementById("modal").classList.add("open");
}
function closeM(){document.getElementById("modal").classList.remove("open")}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});

/* ---------- quiz ---------- */
function showQuiz(){
  document.getElementById("secParts").classList.remove("on");
  document.getElementById("quiz").classList.remove("hidden");
  var pool=PARTS.slice(); QUIZ=[]; qi=0; pts=0;
  while(QUIZ.length<10&&pool.length){var j=Math.floor(Math.random()*pool.length);QUIZ.push(pool.splice(j,1)[0])}
  nextQ();
}
function nextQ(){
  if(qi>=QUIZ.length){finishQuiz();return}
  document.getElementById("quizNext").style.display="none";
  var p=QUIZ[qi];
  document.getElementById("quizPl").innerHTML='<span class="badge '+p.pl+'">'+p.pl+'</span>';
  document.getElementById("quizName").textContent=p.n;
  document.getElementById("quizSub").textContent="What category is this part from?";
  var opts=[p.cat],others=[];
  PARTS.forEach(function(x){if(others.indexOf(x.cat)<0&&x.cat!==p.cat)others.push(x.cat)});
  while(opts.length<4&&others.length){var j=Math.floor(Math.random()*others.length);var c=others.splice(j,1)[0];if(opts.indexOf(c)<0)opts.push(c)}
  opts.sort(function(){return Math.random()-.5});
  document.getElementById("quizOpts").innerHTML=opts.map(function(c){
    return '<button class="opt" data-c="'+esc(c)+'" onclick="pick(this)">'+esc(c)+'</button>';
  }).join("");
  document.getElementById("quizRound").textContent=qi+1;
  document.getElementById("quizPts").textContent=pts;
}
function pick(btn){
  var p=QUIZ[qi],correct=p.cat===btn.dataset.c;
  if(correct)pts++;
  document.querySelectorAll("#quizOpts .opt").forEach(function(b){
    b.disabled=true;
    if(b.dataset.c===p.cat)b.classList.add("correct");
    else if(b===btn)b.classList.add("wrong");
  });
  qi++;
  document.getElementById("quizPts").textContent=pts;
  document.getElementById("quizNext").style.display="inline-block";
  document.getElementById("quizNext").textContent=qi>=QUIZ.length?"See result ➜":"Next ➜";
}
function finishQuiz(){
  document.getElementById("quizName").textContent="Done!";
  document.getElementById("quizSub").textContent="You scored "+pts+" / "+QUIZ.length+(pts>=8?" — VEX parts master! 🏆":pts>=5?" — getting there!":" — study the categories and try again");
  document.getElementById("quizPl").innerHTML="";
  document.getElementById("quizOpts").innerHTML="";
  document.getElementById("quizNext").style.display="none";
}
function backToBrowse(){
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("secParts").classList.add("on");
}

/* ---------- gear calculator ---------- */
var GEARS={IQ:[12,24,36,48,60],V5:[12,36,60,84]};
var TRAVEL={IQ:{label:"200 mm Travel wheel",mm:200},V5:{label:"4 in (320 mm) wheel",mm:320}};
function gcFill(sel,arr,selv){
  var h="";
  arr.forEach(function(t){h+='<option value="'+t+'">'+t+'T</option>'});
  document.getElementById(sel).innerHTML=h;
  if(selv)document.getElementById(sel).value=selv;
}
function gcPlChange(){
  var pl=document.getElementById("gcPl").value||"IQ";
  gcFill("gcDrv",GEARS[pl],12);
  gcFill("gcDrn",GEARS[pl],pl==="IQ"?36:60);
  var pills="";
  if(pl==="V5"){
    [[36,100],[18,200],[6,600]].forEach(function(x){
      pills+='<button class="pill" onclick="gcCartridge(this,'+x[0]+','+x[1]+')">cartridge '+x[0]+':1 → '+x[1]+' rpm</button>';
    });
    document.getElementById("gcRpm").value=100;
  }else{
    pills+='<button class="pill" onclick="gcCartridge(this,null,100)">IQ motor ≈ 100 rpm</button>';
    document.getElementById("gcRpm").value=100;
  }
  document.getElementById("gcPills").innerHTML=pills;
  gcCalc();
}
function gcCartridge(btn,r,spd){document.querySelectorAll("#gcPills .pill").forEach(function(b){b.classList.remove("on")});btn.classList.add("on");document.getElementById("gcRpm").value=spd;gcCalc()}
function gcCalc(){
  var pl=document.getElementById("gcPl").value||"IQ";
  var drv=+document.getElementById("gcDrv").value,drn=+document.getElementById("gcDrn").value;
  var rpm=+document.getElementById("gcRpm").value||0;
  var ratio=drn/drv,out=rpm/ratio;
  var v=ratio>1.49?"🧱 Torque build — slower but strong (good for lifts, arms, climbing)":
          ratio<0.67?"⚡ Speed build — fast but weak (good for launchers, flywheels, quick drive)":
          "⚖️ Balanced — middle ground speed and torque";
  document.getElementById("gcOut").innerHTML=
    '<div class="ln">Gear ratio <b>'+ratio.toFixed(2)+' : 1</b> &nbsp;(driven '+drn+'T ÷ driving '+drv+'T)</div>'+
    '<div class="ln">Output speed <b>'+out.toFixed(0)+' rpm</b> (motor '+rpm+' rpm)</div>'+
    '<div class="note">'+v+'</div>';
  var t=TRAVEL[pl];
  var mps=out/60*t.mm;
  document.getElementById("gcSpeed").innerHTML=
    '<div class="ln">With the '+t.label+' &nbsp;→&nbsp; robot speed ≈ <b>'+(mps/1000).toFixed(2)+' m/s</b> ('+mps.toFixed(0)+' mm/s)</div>'+
    '<div class="note">Wheel travel per output-shaft rotation: '+t.mm+' mm. Ignore wheel loss/weight for a rough estimate.</div>';
}

/* ---------- mechanisms ---------- */
function renderMech(){
  var q=(document.getElementById("mq").value||"").toLowerCase();
  var arr=MECH.filter(function(m){return !q||m.n.toLowerCase().indexOf(q)>=0||m.d.toLowerCase().indexOf(q)>=0||m.parts.join(" ").toLowerCase().indexOf(q)>=0});
  var el=document.getElementById("mgrid");
  if(!arr.length){el.innerHTML='<div class="empty">No mechanisms match.</div>';return}
  el.innerHTML=arr.map(function(m){
    return '<div class="mcard"><span class="tag">'+esc(m.tag)+'</span><h3>'+esc(m.n)+'</h3>'+
      '<div class="dd">'+esc(m.d)+'</div>'+
      '<div class="pl"><b>Key parts:</b> '+m.parts.map(function(p){return '<span class="pchip" onclick="goParts(\''+esc(p).replace(/'/g,"\\'")+'\')">'+esc(p)+'</span>'}).join("")+'</div>'+
      '<div class="tip">💡 '+esc(m.tips)+'</div></div>';
  }).join("");
}

/* ---------- glossary ---------- */
function renderGloss(){
  var q=(document.getElementById("gq").value||"").toLowerCase();
  var arr=GLOSS.filter(function(g){return !q||g[0].toLowerCase().indexOf(q)>=0||g[1].toLowerCase().indexOf(q)>=0});
  var el=document.getElementById("glist");
  if(!arr.length){el.innerHTML='<div class="empty">No terms match.</div>';return}
  el.innerHTML=arr.map(function(g){return '<div class="gterm"><b>'+esc(g[0])+'</b><p>'+esc(g[1])+'</p></div>'}).join("");
}

/* ---------- platforms ---------- */
function renderPlat(){
  var q=(document.getElementById("pq").value||"").toLowerCase();
  var arr=PLAT.filter(function(p){return !q||p.n.toLowerCase().indexOf(q)>=0||p.d.toLowerCase().indexOf(q)>=0||p.t.toLowerCase().indexOf(q)>=0});
  var el=document.getElementById("pgrid");
  if(!arr.length){el.innerHTML='<div class="empty">No platforms match.</div>';return}
  el.innerHTML=arr.map(function(p){
    return '<div class="pcard"><h3>'+esc(p.n)+' <span class="g">'+esc(p.g)+'</span></h3>'+
      '<div class="dd"><b style="color:var(--txt)">'+esc(p.t)+'</b> · '+esc(p.d)+'</div>'+
      '<div class="hw"><b>Key hardware:</b> '+esc(p.hw)+'</div></div>';
  }).join("");
}

legend(); chips(); render(); renderMech(); renderGloss(); renderPlat(); gcPlChange();
</script>

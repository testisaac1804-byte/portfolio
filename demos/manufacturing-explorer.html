<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manufacturing Explorer — 200+ Methods</title>
<style>
:root{--bg:#0d1117;--pn:#161b22;--pn2:#1c2129;--tx:#e6edf3;--ac:#6366f1;--a2:#818cf8;--mu:#8b949e;--bd:#21262d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;display:flex}
/* Left panel: methods list */
.left{width:420px;min-width:320px;display:flex;flex-direction:column;border-right:1px solid var(--bd);background:var(--pn)}
.titlebar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#11151b;border-bottom:1px solid var(--bd)}
.dot{width:11px;height:11px;border-radius:50%}
.dr{background:#ff5f57}.dy{background:#febc2e}.dg{background:#28c840}
.tb-title{flex:1;text-align:center;color:var(--mu);font-size:12.5px;font-weight:600}
.toolbar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.toolbar input{flex:1;min-width:140px;background:var(--pn2);border:1px solid var(--bd);color:var(--tx);padding:7px 10px;border-radius:6px;font-size:13px;outline:none}
.toolbar input:focus{border-color:var(--ac)}
.toolbar select{background:var(--pn2);border:1px solid var(--bd);color:var(--tx);padding:7px 10px;border-radius:6px;font-size:13px;outline:none;cursor:pointer}
.count{color:var(--mu);font-size:11.5px;padding:0 4px;white-space:nowrap}
.list{flex:1;overflow-y:auto;padding:8px 10px}
.card{border:1px solid var(--bd);border-radius:7px;margin-bottom:6px;overflow:hidden;background:var(--pn2);transition:border-color .15s}
.card:hover{border-color:rgba(99,102,241,.3)}
.card.sel{border-color:var(--ac);background:rgba(99,102,241,.08)}
.card-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;user-select:none}
.card-head:hover{background:rgba(99,102,241,.04)}
.card-head .icon{font-size:16px;width:22px;text-align:center}
.card-head .name{font-weight:600;font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.b-add{background:rgba(63,185,80,.15);color:#3fb950}
.b-sub{background:rgba(210,153,34,.15);color:#d29922}
.b-form{background:rgba(99,102,241,.18);color:var(--a2)}
.b-join{background:rgba(255,123,114,.15);color:#ff7b72}
.b-cast{background:rgba(163,113,247,.15);color:#a371f7}
.b-fin{background:rgba(86,211,100,.15);color:#56d364}
.b-hyb{background:rgba(242,201,76,.15);color:#f2c94c}
.card-body{display:none;padding:6px 12px 14px;border-top:1px solid var(--bd);font-size:13px;line-height:1.6;color:var(--mu)}
.card.open .card-body{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card-body .desc{margin-bottom:8px}
.card-body .desc b{color:var(--tx)}
.card-body .act{display:inline-block;margin-top:4px;padding:5px 12px;background:var(--ac);color:#fff;border:none;border-radius:5px;font-size:12px;cursor:pointer;font-weight:600}
.card-body .act:hover{background:var(--a2)}
.empty{color:var(--mu);text-align:center;padding:40px 0;font-size:14px}
/* Right panel: 3D viewport */
.right{flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative;min-width:0}
.view3d{flex:1;position:relative}
.view3d canvas{display:block}
.view3d .overlay{position:absolute;top:12px;left:12px;background:rgba(22,27,34,.9);border:1px solid var(--bd);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--mu);pointer-events:none}
.view3d .overlay b{color:var(--tx)}
/* Param panel */
.params{display:none;border-top:1px solid var(--bd);background:var(--pn);padding:12px 16px;max-height:200px;overflow-y:auto}
.params.visible{display:block}
.params h3{font-size:13px;color:var(--tx);margin-bottom:8px}
.param-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px}
.param-row label{width:110px;color:var(--mu);flex-shrink:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.param-row input[type=range]{flex:1;accent-color:var(--ac)}
.param-row .val{width:50px;color:var(--a2);font-family:ui-monospace,monospace;text-align:right;flex-shrink:0}
.param-row select{background:var(--pn2);border:1px solid var(--bd);color:var(--tx);padding:3px 6px;border-radius:4px;font-size:11px;flex:1;max-width:150px}
.gen-btn{display:block;margin:8px 0 0;padding:6px 16px;background:var(--ac);color:#fff;border:none;border-radius:5px;font-size:12px;cursor:pointer;font-weight:600}
.gen-btn:hover{background:var(--a2)}
/* Resize handle */
.resize{width:4px;cursor:col-resize;background:transparent;flex-shrink:0;transition:background .2s}
.resize:hover{background:var(--ac)}
/* Responsive */
@media(max-width:768px){body{flex-direction:column}.left{width:100%;min-width:0;max-height:45vh}.right{height:55vh}.resize{display:none}}
</style>
</head>
<body>
<div class="left">
  <div class="titlebar"><span class="dot dr"></span><span class="dot dy"></span><span class="dot dg"></span><span class="tb-title">Manufacturing Explorer — 209 methods</span></div>
  <div class="toolbar">
    <input type="text" id="q" placeholder="Search methods… e.g. laser, mold, SLS" oninput="filter()">
    <select id="cat" onchange="filter()">
      <option value="all">All</option>
      <option value="Additive">Additive</option>
      <option value="Subtractive">Subtractive</option>
      <option value="Forming">Forming</option>
      <option value="Joining">Joining</option>
      <option value="Casting">Casting</option>
      <option value="Finishing">Finishing</option>
      <option value="Hybrid">Hybrid</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"></div>
</div>
<div class="resize" id="resize"></div>
<div class="right">
  <div class="view3d" id="view3d">
    <div class="overlay" id="overlay"><b>Select a method</b> to view 3D simulation</div>
  </div>
  <div class="params" id="params"></div>
</div>

// ── G-CODE GENERATOR (ported from app.py) ──
function genGcode(mid, params, wp) {
  const w = wp.w || 100, h = wp.h || 100, d = wp.d || 10;
  const method = METHODS.find(m => m[0] === mid);
  if (!method) return {gcode: '; Unknown method', toolpath: []};
  const cat = method[3];
  let lines = [`; ${method[2]} | ${cat}`, `; Workpiece: ${w}x${h}x${d}mm`, ''];
  for (const [k, v] of Object.entries(params)) { lines.push(`; ${k} = ${v}`); }
  lines.push('');

  if (cat === 'Additive') lines.push(...additive(mid, params, w, h, d));
  else if (cat === 'Subtractive') lines.push(...subtractive(mid, params, w, h, d));
  else if (cat === 'Forming') lines.push(...forming(mid, params, w, h, d));
  else if (cat === 'Joining') lines.push(...joining(mid, params, w, h, d));
  else if (cat === 'Casting') lines.push(...casting(mid, params, w, h, d));
  else if (cat === 'Finishing') lines.push(...finishing(mid, params, w, h, d));
  else lines.push(...generic(mid, params, w, h, d));

  return {gcode: lines.join('\n'), toolpath: parseToolpath(lines)};
}

function parseToolpath(lines) {
  const moves = [];
  let cur = {x:0, y:0, z:10, f:1000};
  let rapid = false;
  for (const line of lines) {
    const l = line.split(';')[0].trim();
    if (!l) continue;
    const parts = l.toUpperCase().split(/\s+/);
    const cmd = parts[0];
    if (cmd === 'G0') rapid = true;
    else if (cmd === 'G1') rapid = false;
    else { const hasCoords = parts.slice(1).some(p => p.length > 1 && 'XYZ'.includes(p[0])); if (!hasCoords) continue; }
    const np = {...cur};
    for (const p of parts.slice(1)) {
      if (p.length < 2) continue;
      const letter = p[0], val = parseFloat(p.slice(1));
      if (isNaN(val)) continue;
      if ('XYZEF'.includes(letter)) np[letter.toLowerCase()] = val;
      else if (letter === 'F') np.f = val;
    }
    const dx = Math.abs(np.x - cur.x), dy = Math.abs(np.y - cur.y), dz = Math.abs(np.z - cur.z);
    if (dx > 0.001 || dy > 0.001 || dz > 0.001) {
      moves.push({x:np.x, y:np.y, z:np.z, f:np.f, rapid, type: rapid ? 'travel' : 'cut'});
      cur = np;
    }
  }
  return moves;
}

function additive(mid, p, w, h, d) {
  const L = ['G90', 'G21', ''];
  const nt = p.nozzle_temp || 210, bt = p.bed_temp || 60;
  let sp = (p.print_speed || 60); if (mid.includes('fdm')) sp *= 60; else sp = p.scan_speed || 1500;
  const lh = p.layer_height || 0.2, nd = p.nozzle_diameter || 0.4;
  if (['fdm','fdm_industrial','peek_printing'].includes(mid)) {
    L.push(`M104 S${nt}`, `M140 S${bt}`, `M109 S${nt}`, `M190 S${bt}`, 'G28', 'G92 E0', '');
    L.push('; Prime', 'G1 Z5 F300', 'G1 X10 Y10 F3000', `G1 Z0.3 F300`, `G1 X${w-10} E${(0.02*w).toFixed(2)} F${sp}`, 'G92 E0', '');
    const nl = Math.max(1, Math.floor(d / lh));
    const inc = d / nl;
    for (let lyr = 0; lyr < nl; lyr++) {
      const z = inc * (lyr + 1);
      L.push(`G1 Z${z.toFixed(3)} F300`);
      if (lyr === 0 || lyr === nl - 1) {
        for (let y = 0; y < h; y += Math.max(1, nd * 2)) {
          L.push(`G1 X5 Y${y.toFixed(1)} F${sp}`, `G1 X${w-5} Y${y.toFixed(1)} E${(0.01*w).toFixed(3)} F${sp}`);
        }
      } else {
        const ip = p.infill || 20;
        const spc = Math.max(nd * 2, w / Math.max(1, ip / 100 * w / nd));
        if (lyr % 2 === 0) {
          for (let y = 0; y < h; y += Math.max(1, Math.floor(spc))) {
            L.push(`G1 X5 Y${y.toFixed(1)} E0.5 F${sp}`, `G1 X${w-5} Y${y.toFixed(1)} E${(0.01*w).toFixed(3)} F${sp}`);
          }
        } else {
          for (let x = 0; x < w; x += Math.max(1, Math.floor(spc))) {
            L.push(`G1 X${x.toFixed(1)} Y5 E0.5 F${sp}`, `G1 X${x.toFixed(1)} Y${h-5} E${(0.01*h).toFixed(3)} F${sp}`);
          }
        }
      }
    }
  } else if (['sla','dlp','cdlp','two_photon'].includes(mid)) {
    L.push('G28');
    const nl = Math.max(1, Math.floor(d * 1000 / (p.layer_height || 50)));
    const exp = p.exposure_time || 6;
    for (let lyr = 0; lyr < Math.min(nl, 20); lyr++) {
      const z = (lyr + 1) * 0.05;
      L.push(`G1 Z${(-z).toFixed(3)} F100`, `G4 P${exp*1000}`, 'G1 Z5 F200');
    }
  } else if (['sls','slm','dmls','ebm'].includes(mid)) {
    L.push('G28');
    const nl = Math.max(1, Math.floor(d * 1000 / (p.layer_height || 100)));
    for (let lyr = 0; lyr < Math.min(nl, 15); lyr++) {
      const z = (lyr + 1) * 0.1;
      L.push(`G1 Z${z.toFixed(3)} F100`);
      for (let sy = 0; sy < h; sy += 5) {
        L.push(`G1 X5 Y${sy} F${sp}`, `G1 X${w-5} Y${sy} F${sp}`);
      }
    }
  } else if (mid === 'waam') {
    const tv = p.travel_speed || 500;
    for (let lyr = 0; lyr < Math.min(Math.floor(d / 2), 10); lyr++) {
      const z = (lyr + 1) * 2;
      L.push(`G1 Z${z.toFixed(1)} F200`);
      for (let y = 0; y < h; y += 10) {
        L.push(`G1 X5 Y${y.toFixed(1)} F${tv}`, `G1 X${w-5} Y${y.toFixed(1)} F${tv}`);
      }
    }
  } else {
    L.push('G28');
    for (let lyr = 0; lyr < Math.min(d, 10); lyr++) {
      L.push(`G1 Z${(lyr+1).toFixed(1)} F200`, 'G1 X0 Y0 F500', `G1 X${w} Y${h} F500`);
    }
  }
  L.push('', 'G1 Z20 F300', 'M104 S0', 'M140 S0', 'M84', 'M30');
  return L;
}

function subtractive(mid, p, w, h, d) {
  const L = [];
  const sr = p.spindle_speed || 10000, fr = p.feed_rate || 800;
  const dc = p.depth_of_cut || p.depth_per_pass || 1;
  L.push('G90 G21 G17 G40 G49 G80', '', 'T1 M6', 'G43 H1', `M3 S${sr}`, 'G54', '', 'G0 Z10', 'G0 X0 Y0', '');
  if (['cnc_mill_3axis','cnc_mill_5axis','cnc_router','micro_machining','kuka_robotic_milling'].includes(mid)) {
    const np = Math.max(1, Math.floor(d / dc));
    const pd = d / np;
    const td = p.tool_diameter || 6;
    const so = td * (p.stepover || 40) / 100;
    const coolant = p.coolant || 'Flood';
    if (coolant === 'Flood') L.push('M8'); else if (coolant === 'Mist') L.push('M7');
    for (let pn = 0; pn < np; pn++) {
      const z = -pd * (pn + 1);
      L.push('G0 Z1', `G1 Z${z.toFixed(2)} F${fr*0.5}`);
      for (let y = 5; y < h - 5; y += Math.max(1, Math.floor(so))) {
        L.push(`G1 X5 Y${y.toFixed(1)} F${fr}`, `G1 X${w-5} Y${y.toFixed(1)} F${fr}`);
      }
      L.push(`G1 X5 Y5 F${fr}`, `G1 X${w-5} Y5 F${fr}`, `G1 X${w-5} Y${h-5} F${fr}`, `G1 X5 Y${h-5} F${fr}`, `G1 X5 Y5 F${fr}`);
    }
    L.push('M9');
  } else if (mid === 'laser_cutting') {
    const pas = p.passes || 1, cs = p.cut_speed || 50;
    for (let pp = 0; pp < pas; pp++) {
      L.push(`M3 S${p.laser_power || 150}`);
      L.push(`G1 X5 Y5 F${cs*60}`, `G1 X${w-5} Y5 F${cs*60}`, `G1 X${w-5} Y${h-5} F${cs*60}`, `G1 X5 Y${h-5} F${cs*60}`, `G1 X5 Y5 F${cs*60}`);
      L.push('M5');
    }
  } else if (mid === 'laser_engraving') {
    const es = p.engrave_speed || 500;
    L.push(`M3 S${(p.laser_power||40)*10}`);
    for (let y = 0; y < h; y += 2) {
      L.push(`G1 X5 Y${y} F${es}`, `G1 X${w-5} Y${y} F${es}`);
    }
    L.push('M5');
  } else if (mid === 'waterjet') {
    const cs = p.cut_speed || 250;
    L.push('M7', 'G4 P2');
    L.push(`G1 X5 Y5 F${cs}`, `G1 X${w-5} Y5 F${cs}`, `G1 X${w-5} Y${h-5} F${cs}`, `G1 X5 Y${h-5} F${cs}`, `G1 X5 Y5 F${cs}`);
    L.push('M9');
  } else if (mid === 'plasma_cutting') {
    const cs = p.cut_speed || 1500, ph = p.pierce_height || 3.8, ch = p.cut_height || 1.5;
    L.push(`G0 Z${ph.toFixed(1)}`, 'M3', 'G4 P0.5', `G1 Z${ch.toFixed(1)} F500`);
    L.push(`G1 X5 Y5 F${cs}`, `G1 X${w-5} Y5 F${cs}`, `G1 X${w-5} Y${h-5} F${cs}`, `G1 X5 Y${h-5} F${cs}`, `G1 X5 Y5 F${cs}`);
    L.push('M5', 'G0 Z10');
  } else if (['edm_sinker','edm_wire','edm_hole_drilling'].includes(mid)) {
    L.push('M60');
    if (mid === 'edm_wire') {
      L.push('M62');
      L.push('G1 X5 Y5 F2', `G1 X${w-5} Y5 F2`, `G1 X${w-5} Y${h-5} F2`, `G1 X5 Y${h-5} F2`);
      L.push('M63');
    } else {
      L.push(`G1 Z-${d} F0.5`, 'G4 P1', 'G1 Z10 F5');
    }
    L.push('M61');
  } else if (mid === 'drill_press') {
    L.push('G81');
    L.push(`G99 G81 X${(w/2).toFixed(1)} Y${(h/2).toFixed(1)} Z-${d.toFixed(1)} R2 F100`);
    for (const xp of [w*0.2, w*0.5, w*0.8]) {
      for (const yp of [h*0.2, h*0.5, h*0.8]) {
        L.push(`G81 X${xp.toFixed(1)} Y${yp.toFixed(1)} Z-${d.toFixed(1)} R2 F100`);
      }
    }
    L.push('G80');
  } else if (mid === 'lathe') {
    L.push('G18', 'G96 S150');
    L.push(`G0 X${(w+10).toFixed(1)} Z2`);
    for (let zc = 0; zc < h; zc += Math.max(1, Math.floor(dc*10))) {
      const z = Math.min(zc/10, h);
      L.push(`G1 X${(w-2*dc).toFixed(1)} Z-${z.toFixed(1)} F200`);
    }
    L.push(`G0 X${(w+10).toFixed(1)} Z10`);
  } else if (mid === 'grinding') {
    L.push(`M3 S${sr}`, 'M8');
    const dpp = (p.depth_per_pass || 10) / 1000;
    const np = Math.max(1, Math.floor(d / dpp));
    for (let pn = 0; pn < np; pn++) {
      const z = -dpp * (pn + 1);
      L.push(`G1 Z${z.toFixed(4)} F50`);
      for (let y = 0; y < h; y += 2) {
        L.push(`G1 X5 Y${y} F${fr}`, `G1 X${w-5} Y${y} F${fr}`);
      }
    }
    L.push('M9');
  } else {
    L.push(`G1 Z-${d} F${fr}`, 'G1 X0 Y0 F' + fr, `G1 X${w} Y0 F${fr}`, `G1 X${w} Y${h} F${fr}`, `G1 X0 Y${h} F${fr}`, 'G1 X0 Y0 F' + fr);
  }
  L.push('', 'G0 Z50', 'M5', 'M9', 'G28', 'M30');
  return L;
}

function forming(mid, p, w, h, d) {
  const L = ['G90'];
  if (['injection_molding','die_casting'].includes(mid)) {
    L.push('G28', 'M103 S1', 'G4 P2', 'M104 S1', `G4 P${p.cooling_time||25}`, 'M105 S1', 'M106 S1');
  } else if (mid === 'heat_press') {
    const t = p.temperature || 190, pt = p.press_time || 45;
    L.push(`M140 S${t}`, `M190 S${t}`, 'G1 Z0 F100', `G4 P${pt*1000}`, 'G1 Z50 F100');
  } else if (mid === 'metal_stamping') {
    L.push('G91');
    for (let i = 0; i < 5; i++) L.push('G1 Z-20 F2000', 'G1 Z20 F2000');
    L.push('G90');
  } else if (mid === 'sheet_bending') {
    const a = p.bend_angle || 90;
    const bd = (w/2) * Math.tan(a * Math.PI/180 / 2);
    L.push('G28', `G1 X${p.backgauge||50} F500`, `G1 Z-${bd.toFixed(1)} F100`, 'G4 P0.5', 'G1 Z10 F200');
  } else if (mid === 'forging') {
    L.push('G91');
    for (let i = 0; i < 8; i++) L.push('G1 Z-15 F1000', 'G1 Z15 F1000');
    L.push('G90');
  } else if (mid === 'spinning') {
    L.push(`M3 S${p.spindle_speed||800}`);
    for (let a = 10; a < 80; a += 10) {
      const r = w * (1 - a/90);
      const rad = a * Math.PI/180;
      L.push(`G1 X${(r*Math.cos(rad)).toFixed(1)} Z${(-r*Math.sin(rad)).toFixed(1)} F100`);
    }
    L.push('M5');
  } else {
    L.push('G28', `G1 X0 Y0 Z-${d} F200`, 'G4 P2', 'G1 Z50 F200');
  }
  L.push('', 'G28', 'M30');
  return L;
}

function joining(mid, p, w, h, d) {
  const L = ['G90 G21'];
  const ts = p.travel_speed || p.welding_speed || 8;
  if (['mig_welding','stick_welding','tig_welding'].includes(mid)) {
    L.push(`M3 S${(p.current||120)*10}`, 'G4 P1');
    L.push(`G1 X5 Y${(h/2).toFixed(1)} F${ts*60}`, `G1 X${w-5} Y${(h/2).toFixed(1)} F${ts*60}`, 'M5');
  } else if (mid === 'laser_welding') {
    L.push(`M3 S${p.laser_power||2000}`, `G1 X5 Y${(h/2).toFixed(1)} F${ts*60}`, `G1 X${w-5} Y${(h/2).toFixed(1)} F${ts*60}`, 'M5');
  } else if (mid === 'spot_welding') {
    for (const x of [w*0.25, w*0.5, w*0.75]) {
      for (const y of [h*0.25, h*0.5, h*0.75]) {
        L.push(`G0 X${x.toFixed(1)} Y${y.toFixed(1)}`, 'M3 S100', 'G4 P0.15', 'M5', 'G4 P0.5');
      }
    }
  } else if (mid === 'friction_stir') {
    L.push(`M3 S${p.rotation_speed||800}`, `G1 Z-${(d/2).toFixed(1)} F20`);
    L.push(`G1 X5 Y${(h/2).toFixed(1)} F${ts*60}`, `G1 X${w-5} Y${(h/2).toFixed(1)} F${ts*60}`, 'G1 Z20 F50', 'M5');
  } else if (mid === 'soldering') {
    L.push(`M140 S${p.solder_temp||250}`, `G1 X5 Y${(h/2).toFixed(1)} F100`, `G1 X${w-5} Y${(h/2).toFixed(1)} F100`);
  } else if (mid === 'friction_welding') {
    L.push(`M3 S${p.rotation_speed||2000}`, `G1 Z-${p.burnoff||5} F50`, 'G4 P2', 'M5', 'G4 P1');
  } else if (mid === 'ultrasonic_welding') {
    L.push('M3 S1', 'G1 Z-1 F10', `G4 P${(p.weld_time||500)/1000}`, 'M5', 'G1 Z20 F50');
  } else {
    L.push('M3 S100', `G1 X5 Y${h/2} F200`, `G1 X${w-5} Y${h/2} F200`, 'M5');
  }
  L.push('', 'G0 Z50', 'M30');
  return L;
}

function casting(mid, p, w, h, d) {
  const L = ['G90', `; Pour temp: ${p.pour_temp||1450}°C`, 'G28'];
  L.push('M103 S1', 'G4 P3', 'M104 S1');
  L.push(`G4 P${Math.floor((p.cooling_time||6)*3600/60)}`, 'M105 S1', 'M106 S1');
  L.push('G1 Z50 F200', 'M30');
  return L;
}

function finishing(mid, p, w, h, d) {
  const L = ['G90'];
  if (mid === 'sandblasting') {
    L.push('M3 S100', 'M7');
    for (let y = 0; y < h; y += 2) {
      L.push(`G1 X5 Y${y} F500`, `G1 X${w-5} Y${y} F500`);
    }
    L.push('M9', 'M5');
  } else if (mid === 'vibratory_finishing') {
    L.push('M3 S1', `G4 P${(p.cycle_time||30)*60}`, 'M5');
  } else if (mid === 'painting') {
    L.push('M7', 'G4 P1');
    for (let y = 0; y < h; y += 5) {
      L.push(`G1 X5 Y${y} F200`, `G1 X${w-5} Y${y} F200`);
    }
    L.push('M9');
  } else {
    L.push('M3 S50', `G1 X0 Y0 F200`, `G1 X${w} Y${h} F200`, 'M5');
  }
  L.push('', 'G28', 'M30');
  return L;
}

function generic(mid, p, w, h, d) {
  return ['G90 G21', 'G28', `G1 X0 Y0 Z-${d} F200`, `G1 X${w} Y0 F200`, `G1 X${w} Y${h} F200`, `G1 X0 Y${h} F200`, `G1 X0 Y0 F200`, '', 'G0 Z50', 'M30'];
}

// ── 3D SCENE ──
const container = document.getElementById('view3d');
const overlay = document.getElementById('overlay');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 2000);
camera.position.set(200, 160, 250);
camera.lookAt(75, 10, 75);
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(75, 10, 75);
controls.update();

// Lighting
scene.add(new THREE.AmbientLight(0x404060, 1.5));
const keyLight = new THREE.DirectionalLight(0xffffff, 3);
keyLight.position.set(200, 300, 200);
keyLight.castShadow = true;
scene.add(keyLight);
scene.add(new THREE.PolarGridHelper(300, 60, 30, 128, 0x30363d, 0x21262d));

// Machine base
const steel = new THREE.MeshStandardMaterial({color: 0x4a5568, roughness: 0.4, metalness: 0.9});
scene.add(new THREE.Mesh(new THREE.BoxGeometry(180, 8, 180), steel).translateY(-4).translateX(90).translateZ(90));
scene.add(new THREE.Mesh(new THREE.BoxGeometry(150, 5, 150), new THREE.MeshStandardMaterial({color: 0x2d3748, roughness: 0.6, metalness: 0.5})).translateY(5).translateX(90).translateZ(90));
// Gantry
const alum = new THREE.MeshStandardMaterial({color: 0x8b9dc3, roughness: 0.3, metalness: 0.7});
for (const z of [15, 165]) {
  scene.add(new THREE.Mesh(new THREE.BoxGeometry(8, 150, 8), alum).translateY(79).translateX(20).translateZ(z));
}
scene.add(new THREE.Mesh(new THREE.BoxGeometry(8, 8, 170), alum).translateY(154).translateX(20).translateZ(90));
// Nozzle/spindle
scene.add(new THREE.Mesh(new THREE.BoxGeometry(10, 8, 10), alum).translateY(142).translateX(90).translateZ(90));
scene.add(new THREE.Mesh(new THREE.ConeGeometry(2, 8, 16), new THREE.MeshStandardMaterial({color: 0xd4a017, roughness: 0.2, metalness: 0.9})).translateY(134).translateX(90).translateZ(90));
// Workpiece
const workpiece = new THREE.Mesh(new THREE.BoxGeometry(100, 10, 100), new THREE.MeshStandardMaterial({color: 0xddccaa, roughness: 0.5, transparent: true, opacity: 0.85}));
workpiece.position.set(65, 13, 65);
scene.add(workpiece);

// Toolpath group
const toolpathGroup = new THREE.Group();
scene.add(toolpathGroup);

// Tool indicator
const toolDot = new THREE.Mesh(new THREE.SphereGeometry(3, 8, 8), new THREE.MeshBasicMaterial({color: 0xff3333}));
toolDot.visible = false;
scene.add(toolDot);

let currentMethod = null;
let currentParams = {};
let animToolpath = [];
let animIndex = 0;
let animActive = false;

function clearToolpath() {
  while (toolpathGroup.children.length > 0) {
    toolpathGroup.remove(toolpathGroup.children[0]);
  }
  toolDot.visible = false;
  animToolpath = [];
  animIndex = 0;
  animActive = false;
}

function showToolpath(moves) {
  clearToolpath();
  if (!moves || moves.length === 0) return;

  // Scale moves to fit the workpiece (100x100x10 at position 65,13,65)
  // Find bounds
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const m of moves) {
    minX = Math.min(minX, m.x); maxX = Math.max(maxX, m.x);
    minY = Math.min(minY, m.y); maxY = Math.max(maxY, m.y);
    minZ = Math.min(minZ, m.z); maxZ = Math.max(maxZ, m.z);
  }
  const sx = (maxX - minX) || 1, sy = (maxY - minY) || 1, sz = (maxZ - minZ) || 1;
  const scaleX = 90 / sx, scaleY = 90 / sy, scaleZ = 8 / Math.max(sz, 0.1);

  // Build line segments
  const points = [];
  for (const m of moves) {
    const x = 20 + (m.x - minX) * scaleX;
    const y = 18 + (m.z - minZ) * scaleZ; // Z in G-code is vertical in 3D
    const z = 20 + (m.y - minY) * scaleY;
    points.push(new THREE.Vector3(x, y, z));
  }

  if (points.length < 2) {
    // Single point - just show a dot
    const dotGeo = new THREE.SphereGeometry(2, 8, 8);
    const dotMat = new THREE.MeshBasicMaterial({color: 0xff3333});
    const dot = new THREE.Mesh(dotGeo, dotMat);
    dot.position.copy(points[0]);
    toolpathGroup.add(dot);
    return;
  }

  // Draw lines
  for (let i = 0; i < points.length - 1; i++) {
    const geo = new THREE.BufferGeometry().setFromPoints([points[i], points[i + 1]]);
    const color = moves[i].type === 'travel' ? 0x58a6ff : 0xf0883e;
    const mat = new THREE.LineBasicMaterial({color, linewidth: 1});
    toolpathGroup.add(new THREE.Line(geo, mat));
  }

  // Store for animation
  animToolpath = points;
  toolDot.visible = true;
  if (points.length > 0) toolDot.position.copy(points[0]);
  animIndex = 0;
  animActive = true;
}

// ── UI ──
let selectedIdx = -1;
let filteredList = [];
let openCards = new Set();

function getBadgeClass(cat) {
  const map = {Additive:'b-add',Subtractive:'b-sub',Forming:'b-form',Joining:'b-join',Casting:'b-cast',Finishing:'b-fin',Hybrid:'b-hyb'};
  return map[cat] || 'b-form';
}

function render(list) {
  const box = document.getElementById('list');
  const count = document.getElementById('count');
  if (list.length === 0) {
    box.innerHTML = '<div class="empty">No methods match your search.</div>';
    count.textContent = '0 methods';
    return;
  }
  count.textContent = list.length + ' methods';
  filteredList = list;
  let html = '';
  for (let i = 0; i < list.length; i++) {
    const m = list[i];
    const bc = getBadgeClass(m[3]);
    const sel = (selectedIdx === i) ? ' sel' : '';
    const open = openCards.has(i) ? ' open' : '';
    html += `<div class="card${sel}${open}" id="card${i}">
      <div class="card-head" onclick="selectMethod(${i})">
        <span class="icon">${m[5]||''}</span>
        <span class="name">${m[1]}</span>
        <span class="badge ${bc}">${m[3]}</span>
      </div>
      <div class="card-body">
        <div class="desc"><b>${m[2]}</b> — ${m[4]}</div>
        <button class="act" onclick="event.stopPropagation();simulate(${i})">▶ Simulate</button>
      </div>
    </div>`;
  }
  box.innerHTML = html;
}

function selectMethod(i) {
  // Toggle open state
  if (openCards.has(i)) openCards.delete(i);
  else openCards.add(i);
  selectedIdx = i;
  // Re-render with updated open state
  render(filteredList);
  // Show params
  showParams(filteredList[i]);
}

function filter() {
  const q = document.getElementById('q').value.toLowerCase().trim();
  const cat = document.getElementById('cat').value;
  const out = [];
  for (const m of METHODS) {
    if (cat !== 'all' && m[3] !== cat) continue;
    if (q && (m[1] + ' ' + m[2] + ' ' + m[4]).toLowerCase().indexOf(q) === -1) continue;
    out.push(m);
  }
  selectedIdx = -1;
  openCards = new Set();
  render(out);
  document.getElementById('params').classList.remove('visible');
  clearToolpath();
  overlay.innerHTML = '<b>Select a method</b> to view 3D simulation';
}

function showParams(m) {
  const paramsDiv = document.getElementById('params');
  const params = m[6];
  const keys = Object.keys(params);
  if (keys.length === 0) {
    paramsDiv.classList.remove('visible');
    return;
  }
  paramsDiv.classList.add('visible');
  currentMethod = m;
  currentParams = {};
  let html = `<h3>${m[1]} — Parameters</h3>`;
  for (const [k, pv] of Object.entries(params)) {
    const dv = pv.d;
    currentParams[k] = dv;
    html += `<div class="param-row">`;
    html += `<label title="${k}">${pv.l}</label>`;
    if (pv.t === 'select') {
      html += `<select data-key="${k}" onchange="updateParam(this)">`;
      for (const o of (pv.o || [])) {
        html += `<option value="${o}"${o === dv ? ' selected' : ''}>${o}</option>`;
      }
      html += `</select>`;
    } else {
      html += `<input type="range" data-key="${k}" min="${pv.mn}" max="${pv.mx}" step="${pv.s||1}" value="${dv}" oninput="updateParam(this)">`;
      html += `<span class="val">${dv}</span>`;
    }
    html += `</div>`;
  }
  html += `<button class="gen-btn" onclick="simulateSelected()">▶ Generate G-code & Simulate</button>`;
  paramsDiv.innerHTML = html;
}

function updateParam(el) {
  const key = el.dataset.key;
  const val = el.tagName === 'SELECT' ? el.value : parseFloat(el.value);
  currentParams[key] = val;
  if (el.tagName === 'INPUT') {
    const valSpan = el.nextElementSibling;
    if (valSpan) valSpan.textContent = val;
  }
}

window.updateParam = updateParam;

function simulateSelected() {
  if (!currentMethod) return;
  simulateMethod(currentMethod, currentParams);
}

function simulate(i) {
  const m = filteredList[i];
  selectMethod(i);
  simulateMethod(m, currentParams);
}

function simulateMethod(m, params) {
  const result = genGcode(m[0], params, {w: 100, h: 100, d: 10});
  showToolpath(result.toolpath);
  overlay.innerHTML = `<b>${m[1]}</b> — ${result.toolpath.length} moves`;
}

window.simulate = simulate;
window.simulateSelected = simulateSelected;
window.selectMethod = selectMethod;
window.filter = filter;

// ── Animation loop ──
function anim() {
  requestAnimationFrame(anim);
  if (animActive && animToolpath.length > 1) {
    animIndex = (animIndex + 1) % animToolpath.length;
    toolDot.position.copy(animToolpath[animIndex]);
  }
  renderer.render(scene, camera);
}
anim();

// ── Resize ──
const resizeHandle = document.getElementById('resize');
const leftPanel = document.querySelector('.left');
let resizing = false;
resizeHandle.addEventListener('mousedown', () => { resizing = true; });
document.addEventListener('mousemove', (e) => {
  if (!resizing) return;
  const w = Math.max(280, Math.min(600, e.clientX));
  leftPanel.style.width = w + 'px';
});
document.addEventListener('mouseup', () => { resizing = false; });

window.addEventListener('resize', () => {
  renderer.setSize(container.clientWidth, container.clientHeight);
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
});

// Initial render
filter();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IsaacBrowser — Category Whitelist</title>
<style>
*{box-sizing:border-box}
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--text:#e6edf3;--muted:#8b949e;--accent:#6366f1;--border:#30363d;--good:#4ade80;--bad:#ff5f57;--warn:#f59e0b}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.window{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:840px;max-width:100%;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden}
.titlebar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--panel2);border-bottom:1px solid var(--border)}
.dots{display:flex;gap:8px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.title{margin:0 auto;font-size:13px;color:var(--muted);font-weight:600}
.title .ic{color:var(--accent)}
.cats{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--panel2)}
.cat{flex:1;border:1px solid var(--border);border-radius:8px;padding:9px 12px;cursor:pointer;user-select:none;transition:all .15s}
.cat .top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
.cat .sub{font-size:11px;color:var(--muted);margin-top:2px}
.cat .state{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.cat.on{border-color:var(--good);background:rgba(74,222,128,.07)}
.cat.on .top{color:var(--text)}
.cat.on .state{background:rgba(74,222,128,.15);color:var(--good)}
.cat.off{border-color:var(--border);background:transparent;opacity:.75}
.cat.off .state{background:rgba(255,95,87,.14);color:var(--bad)}
.chrome{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.navbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.navbtn:hover{border-color:var(--accent)}
.navbtn:disabled{opacity:.35;cursor:default}
.urlbar{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:0 12px;height:34px}
.urlbar input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.go{height:34px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:0 16px;cursor:pointer}
.go:hover{background:#4f46e5}
.viewport{height:340px;overflow-y:auto;padding:26px;background:var(--bg)}
.page{max-width:600px;margin:0 auto}
.page h2{margin:0 0 6px;font-size:22px}
.page .dom{font-size:12px;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;margin-bottom:14px}
.page p{font-size:14px;line-height:1.7}
.catbadge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;margin-bottom:12px}
.blocked{text-align:center;padding-top:60px}
.blocked .big{font-size:54px;margin-bottom:10px}
.blocked h2{color:var(--bad);font-size:20px;margin:0 0 8px}
.blocked p{color:var(--muted);font-size:13px;max-width:430px;margin:0 auto 16px}
.blocked .catpill{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--text)}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar">
    <div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
    <div class="title"><span class="ic">🌐</span> IsaacBrowser — Category Whitelist</div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="chrome">
    <button class="navbtn" id="back" onclick="IB.go(-1)">←</button>
    <button class="navbtn" id="fwd" onclick="IB.go(1)">→</button>
    <div class="urlbar">
      <span id="lock">🔒</span>
      <input type="text" id="url" placeholder="Enter a URL…" onkeydown="if(event.key==='Enter')IB.navigate()">
    </div>
    <button class="go" onclick="IB.navigate()">Go</button>
  </div>
  <div class="viewport" id="viewport"></div>
</div>
<script>
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var CATS={
  'Education':{icon:'🎓',domains:['khanacademy.org','wikipedia.org','coursera.org']},
  'Games':{icon:'🎮',domains:['minecraft.net','roblox.com','chess.com','pokemon.com']},
  'Social':{icon:'📱',domains:['youtube.com','tiktok.com','instagram.com','discord.com']}
};
function categoryOf(domain){
  for(var c in CATS){if(CATS[c].domains.indexOf(domain)!==-1)return c;}
  return null;
}
function domainOf(input){
  var s=input.trim().toLowerCase();
  if(s.indexOf('http://')===0)s=s.slice(7);else if(s.indexOf('https://')===0)s=s.slice(8);
  if(s.indexOf('www.')===0)s=s.slice(4);
  var sl=s.indexOf('/');if(sl!==-1)s=s.slice(0,sl);
  return s;
}
function renderPage(domain,cat){
  var name=domain.split('.')[0];var cap=name.charAt(0).toUpperCase()+name.slice(1);
  return '<div class="page"><div class="catbadge" style="background:rgba(74,222,128,.12);color:var(--good)">✓ Category "'+cat+'" allowed</div>'+
    '<div class="dom">https://'+esc(domain)+'/</div><h2>'+esc(cap)+'</h2>'+
    '<p>This is a simulated render of <b>'+esc(domain)+'</b>. It loaded because the <b>'+cat+'</b> category is currently <b style="color:var(--good)">enabled</b>. Toggle the category off at the top and this page would be blocked.</p></div>';
}
function renderBlocked(domain,cat){
  return '<div class="blocked"><div class="big">⛔</div><h2>Blocked — category disabled</h2>'+
    '<p><b>'+esc(domain)+'</b> belongs to the <b>'+cat+'</b> category, which is currently turned <b style="color:var(--bad)">off</b> by the whitelist policy. Enable the category to load this site.</p>'+
    '<span class="catpill">'+CATS[cat].icon+' '+cat+' · disabled</span></div>';
}
var IB={
  enabled:{'Education':true,'Games':false,'Social':false},
  history:['khanacademy.org'],pos:0,
  renderCats:function(){
    var el=document.getElementById('cats');var h='';
    for(var c in CATS){
      var on=this.enabled[c];
      h+='<div class="cat '+(on?'on':'off')+'" onclick="IB.toggle(\''+c+'\')">'+
        '<div class="top"><span>'+CATS[c].icon+'</span>'+c+'<span class="state">'+(on?'ALLOW':'BLOCK')+'</span></div>'+
        '<div class="sub">'+CATS[c].domains.length+' sites</div></div>';
    }
    el.innerHTML=h;
  },
  toggle:function(c){
    this.enabled[c]=!this.enabled[c];
    this.renderCats();this.render();
  },
  render:function(){
    var url=this.history[this.pos];
    var cat=categoryOf(url);
    var vp=document.getElementById('viewport');
    if(cat&&this.enabled[cat]){vp.innerHTML=renderPage(url,cat);document.getElementById('lock').textContent='🔒';}
    else if(cat&&!this.enabled[cat]){vp.innerHTML=renderBlocked(url,cat);document.getElementById('lock').textContent='⛔';}
    else{vp.innerHTML=renderBlocked(url,'Unknown (not categorized)');document.getElementById('lock').textContent='⛔';}
    document.getElementById('url').value='https://'+url;
    document.getElementById('back').disabled=this.pos===0;
    document.getElementById('fwd').disabled=this.pos===this.history.length-1;
  },
  navigate:function(){
    var d=domainOf(document.getElementById('url').value);
    if(!d)return;
    this.history=this.history.slice(0,this.pos+1);this.history.push(d);this.pos++;
    this.render();
  },
  go:function(delta){
    var np=this.pos+delta;if(np<0||np>=this.history.length)return;this.pos=np;this.render();
  }
};
IB.renderCats();
IB.render();
</script>
</body>
</html>

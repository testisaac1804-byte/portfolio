<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Canvas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.titlebar{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#161b22;border-bottom:1px solid #21262d}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.titlebar span{margin-left:8px;font-size:13px;color:#8b949e}
.bar{display:flex;gap:10px;padding:12px 16px;background:#161b22;border-bottom:1px solid #21262d;align-items:center}
button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
button.on{background:#6366f1;border-color:#6366f1}
canvas{flex:1;background:#0a0e14;cursor:crosshair}
.hint{color:#8b949e;font-size:12px;padding:8px 16px;background:#161b22;border-top:1px solid #21262d}
</style>
</head>
<body>
<div class="titlebar"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span>F1 Canvas — car body sketch</span></div>
<div class="bar">
 <button class="on" onclick="setTool('draw')">✏️ Draw</button>
 <button onclick="setTool('erase')">🧽 Erase</button>
 <button onclick="clearAll()">🗑 Clear</button>
 <label style="margin-left:auto;font-size:13px;color:#8b949e">Color</label>
 <input type="color" value="#6366f1" onchange="col=this.value">
</div>
<canvas id="cv"></canvas>
<div class="hint">Draw an F1 car body outline. Click and drag to sketch.</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let tool='draw',col='#6366f1',drawing=false;
function resize(){cv.width=cv.clientWidth;cv.height=cv.clientHeight}
resize();window.addEventListener('resize',resize);
function setTool(t){tool=t;document.querySelectorAll('button').forEach(b=>b.classList.remove('on'));document.querySelector(`button[onclick="setTool('${t}')"]`).classList.add('on')}
function clearAll(){ctx.clearRect(0,0,cv.width,cv.height)}
cv.addEventListener('mousedown',e=>{drawing=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY)});
cv.addEventListener('mousemove',e=>{if(!drawing)return;ctx.strokeStyle=tool==='draw'?col:'#0a0e14';ctx.lineWidth=tool==='draw'?3:14;ctx.lineCap='round';ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke()});
cv.addEventListener('mouseup',()=>drawing=false);
</script>
</body>
</html>

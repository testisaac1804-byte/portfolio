<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGCSE Tutor — Isaac's Personal Teacher</title>
<style>
:root{--bg:#0a0e17;--card:#111827;--border:#1e293b;--txt:#e2e8f0;--dim:#94a3b8;--acc:#38bdf8;--good:#34d399;--bad:#f87171;--gold:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.6;padding:16px;max-width:960px;margin:0 auto}
h1{font-size:26px;margin:10px 0 4px}
.sub{color:var(--dim);font-size:14px;margin-bottom:16px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
nav button{background:var(--card);color:var(--txt);border:1px solid var(--border);border-radius:8px;padding:9px 14px;cursor:pointer;font-size:14px;transition:.15s}
nav button:hover{border-color:var(--acc)}
nav button.active{background:#0ea5e9;border-color:#0ea5e9;color:#000;font-weight:700}
.mode{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.mode button{background:var(--card);border:1px solid var(--border);color:var(--dim);border-radius:20px;padding:6px 16px;cursor:pointer;font-size:13px}
.mode button.active{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin:14px 0}
.flash{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .q{font-size:20px;font-weight:700;margin-bottom:10px}
.flash .hint{color:var(--dim);font-size:12px;margin-top:16px}
.actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font-size:14px;font-weight:600}
.btn.good{background:#059669}.btn.bad{background:#dc2626}.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--txt)}
.quiz-q{font-size:18px;font-weight:600;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin:8px 0;cursor:pointer;color:var(--txt);font-size:14px;transition:.15s}
.opt:hover{border-color:var(--acc)}
.opt.correct{background:#065f46;border-color:var(--good)}
.opt.wrong{background:#7f1d1d;border-color:var(--bad)}
.explain{background:#0f172a;border-left:3px solid var(--gold);padding:12px;border-radius:0 8px 8px 0;margin-top:12px;font-size:14px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}
.stats div{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px}
.stats b{color:var(--acc);font-size:16px}
.topic{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:6px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.topic:hover{border-color:var(--acc)}
.topic .done{color:var(--good)}
h2{font-size:18px;margin:20px 0 8px;color:var(--acc)}
.lesson{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin:12px 0}
.lesson h3{color:var(--gold);margin-bottom:8px}
.lesson p,.lesson li{font-size:15px;color:#cbd5e1}
.lesson ul{padding-left:20px;margin:8px 0}
.tag{display:inline-block;background:#0f172a;border:1px solid var(--border);border-radius:12px;padding:2px 10px;font-size:11px;color:var(--dim);margin:2px}
</style>
</head>
<body>

  <button data-mode="quiz">❓ Quiz</button>
  <button data-mode="learn">📖 Learn (step-by-step)</button>
</div>

<div id="content"></div>

<script>

  econ: {name:"📈 Economics (0455)", data:[

    {q:"Elastic vs inelastic demand", a:"Elastic (>1): demand responds a lot to price. Inelastic (<1): demand barely responds."},
    {q:"A firm with elastic demand should…?", a:"Cut prices to raise total revenue (quantity rises more than price falls)."},
    {q:"What is a public good?", a:"Non-rival and non-excludable (e.g. street lights, defence). Market won't provide them."},
    {q:"What is a negative externality?", a:"A cost to a third party (e.g. pollution) not included in the market price."},
    {q:"What is inflation?", a:"A sustained rise in the general price level. Money buys less."},
    {q:"Demand-pull vs cost-push inflation", a:"Demand-pull = too much spending. Cost-push = production costs rise (e.g. oil)."},
    {q:"Fiscal vs monetary policy", a:"Fiscal = government spending & taxes. Monetary = central bank controls interest rates/money supply."},
    {q:"What happens when a currency weakens?", a:"Exports get cheaper (good for exporters), imports get more expensive (bad for consumers)."}
  ], learn:[
    {title:"1. Scarcity → the whole subject", body:"Everything starts here. You have limited money/time but unlimited wants. <b>Scarcity</b> = not enough to go around. Because things are scarce, you must <b>choose</b>, and every choice has an <b>opportunity cost</b> (the next best thing you gave up).<br><br><b>Example:</b> You have $50. Buy a game OR go to the cinema. If you buy the game, your opportunity cost is the cinema trip."},
    {title:"2. Factors of production", body:"How does anything get made? Using 4 resources:<br>• <b>Land</b> — natural resources (reward: rent)<br>• <b>Labour</b> — human effort (reward: wages)<br>• <b>Capital</b> — machines/tools (reward: interest)<br>• <b>Enterprise</b> — the risk-taker who organises it (reward: profit)"},
    {title:"3. Demand & Supply — the core diagram", body:"<b>Demand</b> = how much people WANT at each price (slopes down). <b>Supply</b> = how much firms will SELL at each price (slopes up).<br><br>Where they cross = <b>equilibrium price</b>.<br><br>⚠️ Golden rule: a change in the good's OWN price = <b>movement along</b> the curve. Anything else (income, costs, trends) = <b>shift</b> the whole curve."},

// ============ STATE ============
var subj = 'econ';
var mode = 'flash';
var data = JSON.parse(localStorage.getItem('tutor_progress')||'{}'); // {subj: {topic: {known:0, unknown:0}}}

function save(){localStorage.setItem('tutor_progress', JSON.stringify(data));}

// ============ RENDER ============
function renderNav(){
  var s = document.getElementById('subjNav'); s.innerHTML='';
  Object.keys(SUBJECTS).forEach(function(k){
    var b = document.createElement('button');
    b.textContent = SUBJECTS[k].name;
    if(k===subj) b.classList.add('active');
    b.onclick = function(){subj=k; renderNav(); render();};
    s.appendChild(b);
  });
  document.querySelectorAll('#modeNav button').forEach(function(b){
    b.classList.toggle('active', b.dataset.mode===mode);
  });
}

function knownCount(topic){
  if(!data[subj]||!data[subj][topic]) return 0;
  return data[subj][topic].known||0;
}

function render(){
  var c = document.getElementById('content');
  if(mode==='flash') renderFlash(c);
  else if(mode==='quiz') renderQuiz(c);
  else renderLearn(c);
}

// Flashcards
var fIdx = 0, fFlipped = false;
function renderFlash(c){
  var cards = SUBJECTS[subj].data;
  if(fIdx>=cards.length) fIdx=0;
  c.innerHTML = '<h2>🃏 Flashcards — '+SUBJECTS[subj].name.split(' ').slice(1).join(' ')+'</h2>'+
    '<div class="stats"><div>Card <b>'+(fIdx+1)+'</b> / '+cards.length+'</div><div>Known <b>'+(data[subj]&&data[subj]._known||0)+'</b></div><div>Learning <b>'+(data[subj]&&data[subj]._unknown||0)+'</b></div></div>'+
    '<div class="card flash" id="flashCard"><div class="q">'+cards[fIdx].q+'</div><div class="hint">👆 Tap to reveal answer</div></div>'+
    '<div class="actions"><button class="btn ghost" onclick="prevCard()">← Back</button><button class="btn good" onclick="mark(true)">✓ Know it</button><button class="btn bad" onclick="mark(false)">✗ Don\'t know</button><button class="btn ghost" onclick="nextCard()">Skip →</button></div>';
  var fc = document.getElementById('flashCard');
  fc.onclick = function(){
    if(fFlipped){ fc.innerHTML='<div class="q">'+cards[fIdx].q+'</div><div class="hint">👆 Tap to reveal answer</div>'; fFlipped=false; }
    else { fc.innerHTML='<div class="q" style="color:#34d399">'+cards[fIdx].a+'</div><div class="hint">👆 Tap to flip back</div>'; fFlipped=true; }
  };
}
function mark(known){
  if(!data[subj]) data[subj]={};
  data[subj][known?'_known':'_unknown'] = (data[subj][known?'_known':'_unknown']||0)+1;
  save();
  nextCard();
}
function nextCard(){fIdx=(fIdx+1)%SUBJECTS[subj].data.length; fFlipped=false; renderFlash(document.getElementById('content'));}
function prevCard(){fIdx=(fIdx-1+SUBJECTS[subj].data.length)%SUBJECTS[subj].data.length; fFlipped=false; renderFlash(document.getElementById('content'));}

// Quiz
var qIdx=0, qScore=0, qAnswered=false, qShuffled=[];
function renderQuiz(c){
  var qs = QUIZ[subj]||[];
  if(qShuffled.length===0){ qShuffled = qs.map(function(_,i){return i}).sort(function(){return Math.random()-0.5}).slice(0,6); qIdx=0; qScore=0; }
  if(qIdx>=qShuffled.length){ renderQuizResult(c); return; }
  var q = qs[qShuffled[qIdx]];
  c.innerHTML = '<h2>❓ Quiz — '+SUBJECTS[subj].name.split(' ').slice(1).join(' ')+'</h2>'+
    '<div class="stats"><div>Question <b>'+(qIdx+1)+'</b> / '+qShuffled.length+'</div><div>Score <b>'+qScore+'</b></div></div>'+
    '<div class="card"><div class="quiz-q">'+q.q+'</div><div id="opts"></div><div id="fb"></div></div>';
  var opts = document.getElementById('opts');
  q.a.forEach(function(opt,i){
    var b = document.createElement('button');
    b.className='opt'; b.textContent=opt;
    b.onclick=function(){ answer(i,q); };
    opts.appendChild(b);
  });
  qAnswered=false;
}
function answer(i,q){
  if(qAnswered) return; qAnswered=true;
  var opts = document.querySelectorAll('.opt');
  opts.forEach(function(b,idx){
    if(idx===q.c) b.classList.add('correct');
    if(idx===i && i!==q.c) b.classList.add('wrong');
    b.disabled=true;
  });
  if(i===q.c) qScore++;
  document.getElementById('fb').innerHTML = '<div class="explain"><b>'+(i===q.c?'✅ Correct!':'❌ Not quite.')+'</b> '+q.a[q.c]+'</div><div class="actions" style="margin-top:12px"><button class="btn" onclick="nextQ()">Next →</button></div>';
}
function nextQ(){qIdx++; renderQuiz(document.getElementById('content'));}
function renderQuizResult(c){
  var total = qShuffled.length;
  var pct = Math.round(qScore/total*100);
  var msg = pct>=80?'🌟 Excellent!':pct>=60?'👍 Good, keep going':pct>=40?'📚 Keep practising':'💪 Needs work — review the flashcards';
  c.innerHTML = '<h2>❓ Quiz Complete</h2><div class="card" style="text-align:center"><div style="font-size:48px;font-weight:700;color:'+(pct>=60?'#34d399':'#fbbf24')+'">'+pct+'%</div><p>'+qScore+' / '+total+' correct</p><p>'+msg+'</p><div class="actions" style="margin-top:16px"><button class="btn" onclick="qShuffled=[];renderQuiz(document.getElementById(\'content\'))">🔁 Try again</button></div></div>';
}

// Learn
function renderLearn(c){
  var lessons = SUBJECTS[subj].learn||[];
  var html = '<h2>📖 Learn — step-by-step lessons</h2>';
  lessons.forEach(function(l,i){
    html += '<div class="lesson"><h3>'+l.title+'</h3><p>'+l.body+'</p><button class="btn ghost" style="margin-top:10px" onclick="markLesson('+i+')">'+ (knownCount('L'+i)>0?'✓ Completed':'Mark as done') +'</button></div>';
  });
  c.innerHTML = html;
}
function markLesson(i){
  if(!data[subj]) data[subj]={};
  data[subj]['L'+i] = {known:1}; save(); renderLearn(document.getElementById('content'));
}

// ============ INIT ============
document.getElementById('modeNav').addEventListener('click', function(e){
  if(e.target.dataset.mode){ mode=e.target.dataset.mode; fIdx=0; fFlipped=false; qShuffled=[]; renderNav(); render(); }
});
renderNav();
render();
</script>
</body>

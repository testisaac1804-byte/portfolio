<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y10 IGCSE Launcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2129; --text: #e6edf3;
    --accent: #6366f1; --accent2: #818cf8; --muted: #8b949e; --border: #21262d;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px;
    display: flex; align-items: center; justify-content: center;
  }
  .window { width: 100%; max-width: 880px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .titlebar { display: flex; align-items: center; gap: 8px; padding: 11px 14px; background: #11151b; border-bottom: 1px solid var(--border); }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tbtitle { flex: 1; text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; }
  .hero { text-align: center; padding: 34px 24px 20px; }
  .hero .logo { font-size: 52px; margin-bottom: 10px; }
  .hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .hero p { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; padding: 10px 24px 30px; }
  .subject {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px 16px; text-align: center; cursor: pointer; transition: transform .12s, border-color .15s, background .15s;
  }
  .subject:hover { transform: translateY(-3px); border-color: var(--accent); background: rgba(99,102,241,0.08); }
  .subject .em { font-size: 36px; }
  .subject .nm { font-weight: 700; font-size: 15.5px; margin-top: 10px; }
  .subject .tag { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .panel { padding: 24px 26px 30px; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .panel .top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .panel .back { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 13px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .panel .back:hover { color: var(--text); border-color: var(--muted); }
  .panel h2 { font-size: 20px; font-weight: 700; }
  .panel .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .topic { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  .topic:hover { border-color: var(--accent); }
  .topic .ic { font-size: 20px; }
  .topic .tt { font-weight: 600; font-size: 13.5px; }
  .topic .st { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .topic .pct { margin-left: auto; color: var(--accent2); font-size: 12px; font-weight: 600; }
  .empty { display: none; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="tbtitle">Y10 IGCSE Launcher</span>
    </div>

    <div id="home">
      <div class="hero">
        <div class="logo">🎓</div>
        <h1>Y10 IGCSE Study Guide</h1>
        <p>Pick a subject to open its revision guide.</p>
      </div>
      <div class="grid" id="grid"></div>
    </div>

    <div class="empty" id="panel"></div>
  </div>

<script>
  var L = {
    subjects: [
      { em: '🧮', nm: 'Maths', tag: 'Algebra · Geometry · Stats', topics: [
        { ic: '📐', tt: 'Algebra & Equations', st: 'Linear and quadratic equations', pct: '82%' },
        { ic: '📏', tt: 'Geometry & Trigonometry', st: 'Angles, circles, sine & cosine rule', pct: '64%' },
        { ic: '📊', tt: 'Statistics & Probability', st: 'Averages, spread, probability trees', pct: '71%' }
      ] },
      { em: '⚛️', nm: 'Physics', tag: 'Forces · Waves · Electricity', topics: [
        { ic: '🔋', tt: 'Electricity & Magnetism', st: 'Circuits, resistance, motors', pct: '58%' },
        { ic: '🌊', tt: 'Waves & Light', st: 'Reflection, refraction, EM spectrum', pct: '76%' },
        { ic: '🚀', tt: 'Forces & Motion', st: 'Newtons laws, momentum, graphs', pct: '69%' }
      ] },
      { em: '🧬', nm: 'Biology', tag: 'Cells · Genetics · Ecology', topics: [
        { ic: '🔬', tt: 'Cell Biology', st: 'Organelles, osmosis, mitosis', pct: '81%' },
        { ic: '🧫', tt: 'Genetics & Inheritance', st: 'DNA, alleles, Punnett squares', pct: '55%' },
        { ic: '🌱', tt: 'Ecology & Environment', st: 'Food chains, cycles, sampling', pct: '67%' }
      ] },
      { em: '💷', nm: 'Economics', tag: 'Markets · Trade · Policy', topics: [
        { ic: '📈', tt: 'Supply & Demand', st: 'Market equilibrium, elasticity', pct: '73%' },
        { ic: '🏦', tt: 'Macroeconomics', st: 'GDP, inflation, unemployment', pct: '60%' },
        { ic: '🌍', tt: 'International Trade', st: 'Imports, exports, tariffs', pct: '52%' }
      ] },
      { em: '📚', nm: 'English', tag: 'Lit · Language · Writing', topics: [
        { ic: '📖', tt: 'Prose & Poetry Analysis', st: 'Language techniques, structure', pct: '66%' },
        { ic: '✍️', tt: 'Essay Writing', st: 'PEEL paragraphs, argument', pct: '74%' },
        { ic: '🗣️', tt: 'Speaking & Listening', st: 'Presentations, debates', pct: '80%' }
      ] },
      { em: '🛠️', nm: 'DT', tag: 'CAD · Materials · Making', topics: [
        { ic: '📐', tt: 'CAD & Technical Drawing', st: 'Orthographic, isometric, dimensions', pct: '88%' },
        { ic: '🧱', tt: 'Materials & Properties', st: 'Woods, metals, polymers, composites', pct: '62%' },
        { ic: '⚙️', tt: 'Manufacturing Processes', st: 'Cutting, forming, joining', pct: '70%' }
      ] }
    ],
    render: function () {
      var g = document.getElementById('grid');
      var html = '';
      for (var i = 0; i < this.subjects.length; i++) {
        var s = this.subjects[i];
        html += '<div class="subject" onclick="L.open(' + i + ')">' +
          '<div class="em">' + s.em + '</div>' +
          '<div class="nm">' + s.nm + '</div>' +
          '<div class="tag">' + s.tag + '</div></div>';
      }
      g.innerHTML = html;
    },
    open: function (i) {
      var s = this.subjects[i];
      var html = '<div class="panel">' +
        '<div class="top"><button class="back" onclick="L.home()">← Back</button>' +
        '<h2>' + s.em + ' ' + s.nm + '</h2></div>' +
        '<div class="sub">' + s.tag + ' — select a topic to revise</div>';
      for (var k = 0; k < s.topics.length; k++) {
        var t = s.topics[k];
        html += '<div class="topic" onclick="L.openTopic(' + i + ',' + k + ')">' +
          '<span class="ic">' + t.ic + '</span>' +
          '<span><div class="tt">' + t.tt + '</div><div class="st">' + t.st + '</div></span>' +
          '<span class="pct">' + t.pct + ' ✓</span></div>';
      }
      html += '</div>';
      document.getElementById('home').style.display = 'none';
      var p = document.getElementById('panel');
      p.style.display = 'block';
      p.innerHTML = html;
    },
    openTopic: function (i, k) {
      var s = this.subjects[i], t = s.topics[k];
      this.toast('Opening ' + s.nm + ' → ' + t.tt + ' …');
    },
    home: function () {
      document.getElementById('home').style.display = 'block';
      document.getElementById('panel').style.display = 'none';
    },
    toast: function (msg) {
      var t = document.getElementById('toastHost');
      if (!t) {
        t = document.createElement('div');
        t.id = 'toastHost';
        t.style.cssText = 'position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#1f6feb;color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;';
        document.body.appendChild(t);
      }
      t.textContent = msg; t.style.opacity = '1';
      clearTimeout(this._tt);
      this._tt = setTimeout(function () { t.style.opacity = '0'; }, 1800);
    }
  };
  L.render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HKPCBypass</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--text:#e6edf3;--muted:#8b949e;--accent:#6366f1;--accentdim:rgba(99,102,241,.15);--border:#30363d;--green:#22c55e;--amber:#f0883e;--red:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.win{width:100%;max-width:680px;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.tb{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#10151c;border-bottom:1px solid var(--border)}
.dots{display:flex;gap:7px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.tb .t{flex:1;text-align:center;font-size:12.5px;color:var(--muted);letter-spacing:.3px}
.tb .side{width:44px}
.body{padding:22px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.hd h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accentdim);display:flex;align-items:center;justify-content:center;font-size:18px}
.pill{font-size:11px;font-weight:600;color:var(--muted);background:var(--panel2);border:1px solid var(--border);padding:4px 10px;border-radius:20px;font-family:ui-monospace,Menlo,monospace}
.pill.on{color:var(--green);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.12)}
.stack{display:flex;flex-direction:column;margin-bottom:18px}
.layer{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--panel2);border:1px solid var(--border);position:relative}
.layer:first-child{border-radius:10px 10px 0 0}
.layer:last-child{border-radius:0 0 10px 10px}
.layer + .layer{margin-top:-1px}
.dotstat{width:12px;height:12px;border-radius:50%;flex-shrink:0;transition:.3s}
.dotstat.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.dotstat.busy{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink .45s infinite}
.dotstat.idle{background:#484f58}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.lmeta{flex:1;min-width:0}
.lmeta .n{font-size:14px;font-weight:600}
.lmeta .d{font-size:11px;color:var(--muted);margin-top:2px}
.lat{font-size:12px;font-family:ui-monospace,Menlo,monospace;color:var(--muted);flex-shrink:0;text-align:right;min-width:46px}
.lat.ok{color:var(--green)}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:.15s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:default;filter:none}
.trace{background:var(--panel2);border:1px solid var(--border);border-radius:10px;margin-top:14px;padding:14px 16px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.9;color:var(--muted);min-height:20px}
.trace .ln{white-space:nowrap}
.trace .ok{color:var(--green)}
.trace .hop{color:var(--text)}
.trace .sum{border-top:1px solid var(--border);margin-top:8px;padding-top:8px;color:var(--text)}
.trace .sum b{color:var(--green)}
@media(max-width:500px){.lat .lb{display:none}}
</style>
</head>
<body>
<div class="win">
  <div class="tb">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="t">HKPCBypass — Multi-Layer School Bypass</div>
    <div class="side"></div>
  </div>
  <div class="body">
    <div class="hd">
      <h1><span class="logo">🕶️</span> HKPCBypass</h1>
      <span class="pill on" id="pill">READY</span>
    </div>

    <div class="stack" id="stack"></div>

    <button class="btn" id="btn" onclick="A.test()">Run bypass test</button>
    <div class="trace" id="trace">Click <b style="color:var(--text)">Run bypass test</b> to trace a packet through every bypass layer.</div>
  </div>
</div>
<script>
var A = {
  layers: [
    {n:"DNS over HTTPS", d:"Encrypted queries to 1.1.1.1 · evades DNS filtering", lat:"—"},
    {n:"SOCKS5 tunnel", d:"Routes TCP through a remote relay", lat:"—"},
    {n:"HTTP CONNECT", d:"Requests a tunnel from the proxy", lat:"—"},
    {n:"TLS handshake", d:"Wraps everything in TLS 1.3", lat:"—"},
    {n:"Destination", d:"Filter is fully bypassed", lat:"—"}
  ],
  running: false,
  setDot: function(i, s){
    var dots = document.querySelectorAll(".dotstat");
    if (dots[i]) dots[i].className = "dotstat " + s;
  },
  setLat: function(i, v){
    var lats = document.querySelectorAll(".lat");
    if (lats[i]) lats[i].textContent = v;
  },
  render: function(){
    var html = "";
    for (var i = 0; i < A.layers.length; i++) {
      var l = A.layers[i];
      html += '<div class="layer"><span class="dotstat idle"></span>' +
        '<div class="lmeta"><div class="n">' + l.n + '</div>' +
        '<div class="d">' + l.d + '</div></div>' +
        '<div class="lat"><span class="lb">latency&nbsp;</span>' + l.lat + '</div></div>';
    }
    document.getElementById("stack").innerHTML = html;
  },
  test: function(){
    if (A.running) return;
    A.running = true;
    var btn = document.getElementById("btn");
    var pill = document.getElementById("pill");
    var trace = document.getElementById("trace");
    btn.disabled = true; btn.textContent = "Bypassing…";
    pill.textContent = "TESTING"; pill.className = "pill";
    trace.innerHTML = "";
    for (var k = 0; k < A.layers.length; k++) { A.setDot(k, "idle"); A.setLat(k, "—"); }
    var i = 0;
    function step(){
      if (i > 0) {
        A.setDot(i - 1, "ok");
        var ms = (i === A.layers.length - 1) ? Math.round(Math.random() * 20 + 6) :
                 Math.round(Math.random() * 18 + 4);
        A.layers[i - 1].lat = ms + "ms";
        A.setLat(i - 1, ms + "ms");
        var l = A.layers[i - 1];
        trace.innerHTML += '<div class="ln"><span class="hop">' + l.n + '</span> … <span class="ok">OK</span> ' + ms + 'ms</div>';
      }
      if (i < A.layers.length) {
        A.setDot(i, "busy");
        i++;
        setTimeout(step, 420);
      } else {
        A.running = false;
        btn.disabled = false; btn.textContent = "Run bypass test";
        pill.textContent = "READY"; pill.className = "pill on";
        var total = 0;
        for (var j = 0; j < A.layers.length; j++) {
          var p = parseInt(A.layers[j].lat, 10);
          if (!isNaN(p)) total += p;
        }
        trace.innerHTML += '<div class="sum">Bypass complete — school filter <b>circumvented</b> in ' + total + 'ms</div>';
      }
    }
    step();
  },
  init: function(){ A.render(); }
};
A.init();
</script>
</body>
</html>

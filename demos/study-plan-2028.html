<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGCSE 2028 全科備考計劃 · 79 週</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
    --chem:#0f766e; --phys:#1d4ed8; --bio:#15803d; --maths:#7c3aed;
    --econ:#b45309; --dt:#475569; --fle:#be123c; --cn:#a16207; --rev:#64748b;
    --gp:#0e7490;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK",sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  header.top{background:#0b1220;color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:14px}
  header.top h1{margin:0 0 4px;font-size:19px;letter-spacing:.2px}
  header.top .meta{color:#9ca3af;font-size:12.5px}
  .bars{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
  .bar{flex:1 1 220px}
  .bar .lab{display:flex;justify-content:space-between;font-size:12px;color:#cbd5e1;margin-bottom:4px}
  .bar .track{height:7px;background:#1f2937;border-radius:99px;overflow:hidden}
  .bar .fill{height:100%;background:linear-gradient(90deg,#22c55e,#86efac);width:0}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .tab{border:1px solid var(--line);background:#fff;color:#374151;border-radius:99px;
       padding:7px 14px;font-size:13px;cursor:pointer}
  .tab.on{background:#0b1220;border-color:#0b1220;color:#fff}
  .pane{display:none}
  .pane.on{display:block}
  .wkhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .wkhead h2{margin:0;font-size:17px}
  .pill{font-size:11.5px;padding:3px 9px;border-radius:99px;background:#eef2ff;color:#3730a3;border:1px solid #e0e7ff}
  .pill.hol{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;font-size:13px;cursor:pointer}
  .btn:disabled{opacity:.4;cursor:default}
  select.btn{padding:7px 9px}
  .days{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .day h3{margin:0;padding:8px 11px;font-size:12.5px;letter-spacing:.4px;color:var(--muted);
          background:#fafbfc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .blk{padding:9px 11px;border-bottom:1px solid #f1f3f5;display:flex;gap:9px;align-items:flex-start}
  .blk:last-child{border-bottom:none}
  .blk.done{background:#f8fdf9}
  .blk input{margin:2px 0 0;width:16px;height:16px;accent-color:#16a34a;flex:0 0 auto}
  .blk .b{flex:1;min-width:0}
  .chip{display:inline-block;font-size:10.5px;font-weight:600;padding:1.5px 7px;border-radius:99px;
        color:#fff;margin-right:5px;vertical-align:1px}
  .ut{font-weight:600;font-size:13px}
  .ut .en{font-weight:400;color:var(--muted);font-size:11.5px}
  .ref{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:#94a3b8;margin:2px 0 3px}
  .task{font-size:12.3px;color:#374151}
  .blk.done .ut{text-decoration:line-through;color:#6b7280}
  .wkbar{height:5px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-top:8px}
  .wkbar i{display:block;height:100%;background:#16a34a;width:0}
  .wklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
  .wcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 10px;cursor:pointer;font-size:12.5px}
  .wcard:hover{border-color:#94a3b8}
  .wcard b{display:block;font-size:13px}
  .wcard span{color:var(--muted);font-size:11px}
  .wcard.now{outline:2px solid #16a34a}
  table{width:100%;border-collapse:collapse;font-size:12.8px;background:#fff;border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#f8fafc;font-size:11.5px;letter-spacing:.3px;color:#475569;text-transform:uppercase}
  tr:last-child td{border-bottom:none}
  .ok{color:#15803d;font-weight:600}
  .no{color:#b91c1c;font-weight:600}
  .part{color:#b45309;font-weight:600}
  .covsub{margin:16px 0 6px;font-size:14px}
  .covsub em{font-style:normal;color:var(--muted);font-weight:400;font-size:12px}
  .cov{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:6px}
  .u{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff;font-size:12px}
  .u b{display:block;font-weight:600}
  .u i{font-style:normal;color:var(--muted);font-size:10.5px}
  .u.sched{border-left:4px solid #c7d2fe}
  .u.done{border-left:4px solid #16a34a;background:#f6fef9}
  textarea{width:100%;min-height:300px;border:1px solid var(--line);border-radius:12px;padding:12px;
           font:13px/1.6 ui-monospace,Menlo,monospace;background:#fff}
  .note{background:#fff;border:1px solid var(--line);border-left:4px solid #6366f1;border-radius:10px;
        padding:11px 13px;font-size:12.8px;color:#334155;margin:10px 0}
  .note b{color:#111827}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:6px 0 0}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
  .wcard .ph{display:block;color:#94a3b8;font-size:10.5px;margin-top:3px}
  @media print{
    body{background:#fff}
    .tabs,.btn,select.btn,header.top .bars,.wkbar,#legend{display:none!important}
    .pane{display:none!important}
    .pane.on{display:block!important}
    .days{grid-template-columns:repeat(2,1fr)!important}
    .day{break-inside:avoid;box-shadow:none}
    .blk{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>IGCSE 2028 · 全科 79 週備考計劃</h1>
    <div class="meta" id="meta">載入中…</div>
    <div class="bars">
      <div class="bar"><div class="lab"><span>整體進度</span><span id="pAll">0%</span></div>
        <div class="track"><div class="fill" id="fAll"></div></div></div>
      <div class="bar"><div class="lab"><span>本週</span><span id="pWk">0%</span></div>
        <div class="track"><div class="fill" id="fWk"></div></div></div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="week">本週</button>
    <button class="tab" data-tab="all">全部週</button>
    <button class="tab" data-tab="cov">課題覆蓋</button>
    <button class="tab" data-tab="audit">卷別校對</button>
    <button class="tab" data-tab="log">錯題本</button>
  </div>

  <section class="pane on" id="pane-week">
    <div class="wkhead">
      <button class="btn" id="prev">← 上一週</button>
      <select class="btn" id="jump"></select>
      <button class="btn" id="next">下一週 →</button>
      <button class="btn" id="today">跳到本週</button>
      <span class="pill" id="phasePill"></span>
      <span class="pill" id="wkStat"></span>
    </div>
    <div class="wkbar"><i id="wkFill"></i></div>
    <div class="legend" id="legend"></div>
    <div class="days" id="days" style="margin-top:10px"></div>
  </section>

  <section class="pane" id="pane-all">
    <div class="note"><b>79 週一覽。</b>綠框＝本週。點任何一週跳去該週。進度條係該週 18 格嘅完成度。</div>
    <div class="wklist" id="wklist"></div>
  </section>

  <section class="pane" id="pane-cov">
    <div class="note" id="covNote"></div>
    <div id="covBody"></div>
  </section>

  <section class="pane" id="pane-audit">
    <div class="note">所有卷別、時間、分數、比重均取自官方 syllabus 原文（Cambridge 同 Pearson Edexcel）。每個課題格都註明官方 spec 編號，可以逐格翻查。</div>
    <div id="auditBody"></div>
  </section>

  <section class="pane" id="pane-log">
    <div class="note"><b>錯題本。</b>每次做完即寫：題目編號、錯咩、正確做法、下次點避免。資料只存喺你部機（localStorage），唔會上網。</div>
    <textarea id="logBox" placeholder="例：4SD0 Chem 1.25 摩爾計算 — 忘記 ×6.02×10²³ 之後要除 Avogadro；下次先寫公式再代數。"></textarea>
    <div style="margin-top:8px;font-size:12px;color:#6b7280" id="logStat"></div>
  </section>
</div>

const LOGKEY = "igcse-plan-2028-v1-log";
const KEY = "igcse-plan-2028-v1";

/* ---------- state ---------- */
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ store = {}; }
const mem = {};
function get(k){ return k in store ? store[k] : mem[k]; }
function set(k,v){
  mem[k]=v;
  if(v) store[k]=true; else delete store[k];
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){}
}

/* ---------- helpers ---------- */
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAYZH = {Mon:"星期一",Tue:"星期二",Wed:"星期三",Thu:"星期四",Fri:"星期五",Sat:"星期六",Sun:"星期日"};
const DOW = {Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
const COLORS = {Chem:"--chem",Phys:"--phys",Bio:"--bio",Maths:"--maths",Econ:"--econ",DT:"--dt",FLE:"--fle",CN:"--cn",GP:"--gp",Review:"--rev"};
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function esc(s){ return String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* ---------- week maths ---------- */
function weekIndexForDate(d){
  const start = new Date(PLAN.start + "T00:00:00");
  const diff = Math.floor((d - start) / 86400000);
  const w = Math.floor(diff/7);
  return Math.max(0, Math.min(PLAN.weeks.length-1, w));
}
let cur = weekIndexForDate(new Date());

/* ---------- progress ---------- */
function wkBlocks(w){ return PLAN.weeks[w].blocks; }
function wkDone(w){ return wkBlocks(w).filter(b=>get(b.k)).length; }

function paintBars(){
  const total = PLAN.weeks.reduce((a,w)=>a+w.blocks.length,0);
  const done = PLAN.weeks.reduce((a,w,i)=>a+wkDone(i),0);
  const pa = total ? Math.round(done*100/total) : 0;
  document.getElementById("pAll").textContent = pa+"%  ("+done+"/"+total+" 格)";
  document.getElementById("fAll").style.width = pa+"%";
  const wb = wkBlocks(cur).length, wd = wkDone(cur);
  const pw = wb ? Math.round(wd*100/wb) : 0;
  document.getElementById("pWk").textContent = pw+"%  ("+wd+"/"+wb+" 格)";
  document.getElementById("fWk").style.width = pw+"%";
}

/* ---------- week view ---------- */
function renderWeek(){
  const W = PLAN.weeks[cur];
  document.getElementById("jump").value = String(cur);
  document.getElementById("prev").disabled = cur===0;
  document.getElementById("next").disabled = cur===PLAN.weeks.length-1;
  const ph = document.getElementById("phasePill");
  ph.textContent = W.phase;
  ph.className = "pill" + (W.holiday ? " hol" : "");
  const wd = wkDone(cur), wb = W.blocks.length;
  document.getElementById("wkStat").textContent = wd+" / "+wb+" 完成";
  document.getElementById("wkFill").style.width = (wb? Math.round(wd*100/wb):0)+"%";
  document.getElementById("legend").innerHTML = Object.keys(PLAN.subjects).map(s=>
    '<span><i style="background:'+cssv(COLORS[s])+'"></i>'+PLAN.subjects[s].zh+' '+PLAN.subjects[s].units.length+' 個課題</span>').join("")
    + (W.holiday ? '<span style="color:#9a3412">假期週：每個時段可以加長一倍</span>' : '');

  const byDay = {};
  DAYS.forEach(d=>byDay[d]=[]);
  W.blocks.forEach(b=>byDay[b.day].push(b));
  document.getElementById("days").innerHTML = DAYS.map(d=>{
    const list = byDay[d];
    if(!list.length) return "";
    const inner = list.map(b=>{
      const done = get(b.k) ? " done" : "";
      const meta = PLAN.subjects[b.sub] || {zh:"回顧"};
      const col = cssv(COLORS[b.sub]||"--dt");
      return '<label class="blk'+done+'"><input type="checkbox" data-k="'+b.k+'"'+(get(b.k)?" checked":"")+'>'
        + '<span class="b"><span class="ut"><span class="chip" style="background:'+col+'">'+meta.zh+'</span>'
        + esc(b.title)+(b.en?' <span class="en">'+esc(b.en)+'</span>':'')+'</span>'
        + '<span class="ref">'+esc(b.ref)+'</span>'
        + '<span class="task">'+esc(b.task)+'</span></span></label>';
    }).join("");
    return '<div class="day"><h3>'+DAYZH[d]+'<span>'+list.length+' 格</span></h3>'+inner+'</div>';
  }).join("");

  document.querySelectorAll('#days input[type=checkbox]').forEach(cb=>{
    cb.addEventListener("change", ()=>{
      set(cb.dataset.k, cb.checked);
      cb.closest(".blk").classList.toggle("done", cb.checked);
      document.getElementById("wkStat").textContent = wkDone(cur)+" / "+PLAN.weeks[cur].blocks.length+" 完成";
      document.getElementById("wkFill").style.width = Math.round(wkDone(cur)*100/PLAN.weeks[cur].blocks.length)+"%";
      paintBars(); renderAll(); renderCoverage();
    });
  });
  paintBars();
}

/* ---------- all weeks ---------- */
function renderAll(){
  const box = document.getElementById("wklist");
  if(!box) return;
  box.innerHTML = PLAN.weeks.map((W,i)=>{
    const d = W.blocks.filter(b=>get(b.k)).length;
    return '<div class="wcard'+(i===cur?" now":"")+'" data-w="'+i+'" title="'+(W.phase||"")+'">'
      + '<b>W'+(i+1)+' <span style="font-weight:400;color:#6b7280">'+d+'/'+W.blocks.length+'</span></b>'
      + '<span>'+W.start.slice(5)+' – '+W.end.slice(5)+'</span>'
      + '<span class="ph">'+(W.phase||"").split(" · ")[0]+(W.holiday?(" · "+W.holiday):"")+'</span>'
      + '<div class="wkbar"><i style="width:'+(W.blocks.length?Math.round(d*100/W.blocks.length):0)+'%"></i></div>'
      + '</div>';
  }).join("");
  box.querySelectorAll(".wcard").forEach(c=>c.addEventListener("click",()=>{
    cur = +c.dataset.w; show("week"); renderWeek(); renderAll();
  }));
}

/* ---------- coverage ---------- */
function renderCoverage(){
  const body = document.getElementById("covBody");
  if(!body) return;
  const totals = {sched:0, done:0, all:0};
  let html = "";
  Object.keys(PLAN.subjects).forEach(s=>{
    const meta = PLAN.subjects[s];
    const units = meta.units;
    if(!units.length) return;
    let sch=0, dn=0;
    html += '<div class="covsub">'+meta.zh+' <em>'+esc(meta.board)+' · '+units.length+' 個課題</em></div><div class="cov">';
    units.forEach(u=>{
      const blks = u.keys.map(k=>({k, ok:!!get(k)}));
      const any = blks.length>0;
      const allDone = any && blks.every(b=>b.ok);
      if(any) sch++;
      if(allDone) dn++;
      const cls = allDone ? "u done" : (any ? "u sched" : "u");
      html += '<div class="'+cls+'"><b>'+esc(u.zh)+'</b><i>'+esc(u.ref)+' · '+(any? (allDone?"完成":"已排"):"未排")+'</i></div>';
    });
    html += '</div>';
    totals.sched += sch; totals.done += dn; totals.all += units.length;
  });
  body.innerHTML = html;
  const pct = totals.all ? Math.round(totals.done*100/totals.all) : 0;
  document.getElementById("covNote").innerHTML =
    '<b>課題覆蓋：'+totals.done+' / '+totals.all+' 個官方課題完成（'+pct+'%）</b>，'
    + totals.sched+' 個已排入週次。'
    + '每格左邊色條：綠＝全部相關格打勾，藍＝已排但未做完，無色＝未排（正常唔應該有）。';
}

/* ---------- audit ---------- */
function renderAudit(){
  const body = document.getElementById("auditBody");
  if(!body) return;
  body.innerHTML = PLAN.audit.map(sec=>{
    let h = '<h3 style="margin:18px 0 8px;font-size:15px">'+esc(sec.title)+'</h3>';
    h += '<table><thead><tr>'+sec.cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr></thead><tbody>';
    h += sec.rows.map(r=>'<tr>'+r.map((c,i)=>'<td>'+(i===0?'<b>'+esc(c)+'</b>':c)+'</td>').join("")+'</tr>').join("");
    h += '</tbody></table>';
    if(sec.note) h += '<div class="note">'+sec.note+'</div>';
    return h;
  }).join("");
}

/* ---------- log ---------- */
const logBox = document.getElementById("logBox");
function loadLog(){
  try { return localStorage.getItem(LOGKEY) || ""; } catch(e){ return ""; }
}
function saveLog(){
  try { localStorage.setItem(LOGKEY, logBox.value); } catch(e){}
  document.getElementById("logStat").textContent =
    logBox.value.trim() ? "已儲存 · "+logBox.value.trim().split("\n").length+" 行 · "+
      new Date().toLocaleString("zh-HK") : "空白";
}
logBox.value = loadLog();
logBox.addEventListener("input", saveLog);
saveLog();

/* ---------- tabs & nav ---------- */
function show(name){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.tab===name));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on", p.id==="pane-"+name));
  if(name==="week") renderWeek();
  if(name==="all") renderAll();
  if(name==="cov") renderCoverage();
  if(name==="audit") renderAudit();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>show(t.dataset.tab)));

const jump = document.getElementById("jump");
jump.innerHTML = PLAN.weeks.map((W,i)=>'<option value="'+i+'">W'+(i+1)+' · '+W.start.slice(5)+' – '+W.end.slice(5)+'</option>').join("");
jump.addEventListener("change", ()=>{ cur = +jump.value; renderWeek(); renderAll(); });
document.getElementById("prev").addEventListener("click", ()=>{ if(cur>0){cur--; renderWeek(); renderAll();} });
document.getElementById("next").addEventListener("click", ()=>{ if(cur<PLAN.weeks.length-1){cur++; renderWeek(); renderAll();} });
document.getElementById("today").addEventListener("click", ()=>{ cur = weekIndexForDate(new Date()); renderWeek(); renderAll(); });

document.getElementById("meta").textContent =
  PLAN.start+" → "+PLAN.end+"　·　"+PLAN.weeks.length+" 週　·　"
  + PLAN.weeks.reduce((a,w)=>a+w.blocks.length,0)+" 個時段　·　"
  + Object.keys(PLAN.subjects).length+" 科　·　首考 2028 年 5 月";

renderWeek(); renderAll(); renderCoverage(); renderAudit();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VR CNC Milling 6 - Denford Simulation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1a1a; color: #e0e0e0; overflow: hidden; }
#app { display: flex; height: 100vh; }
#viewport { flex: 1; position: relative; background: #0a0a0f; }
#sidebar { width: 340px; background: #252530; border-left: 2px solid #3a3a4a; display: flex; flex-direction: column; overflow-y: auto; }
.panel { padding: 16px; border-bottom: 1px solid #3a3a4a; }
.panel h3 { font-size: 14px; color: #7aa2f7; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.btn { display: block; width: 100%; padding: 10px; margin-bottom: 8px; background: #3a3a4a; border: none; color: #e0e0e0; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; }
.btn:hover { background: #4a4a5a; }
.btn.primary { background: #7aa2f7; color: #1a1a2a; font-weight: 600; }
.btn.primary:hover { background: #8ab4ff; }
.btn.danger { background: #f7768e; }
.btn.danger:hover { background: #ff8a9e; }
.btn.success { background: #9ece6a; color: #1a1a2a; }
.btn.success:hover { background: #b0e07a; }
.control-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.control-row label { font-size: 12px; color: #9aa0b0; min-width: 60px; }
.control-row input[type="range"] { flex: 1; }
.control-row span { font-size: 12px; color: #7aa2f7; min-width: 40px; text-align: right; }
.status-bar { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(30,30,40,0.95); padding: 12px 20px; display: flex; justify-content: space-between; font-size: 12px; border-top: 1px solid #3a3a4a; z-index: 10; }
.status-item { display: flex; gap: 6px; }
.status-label { color: #9aa0b0; }
.status-value { color: #7aa2f7; font-weight: 600; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.info-item { background: #2a2a3a; padding: 8px; border-radius: 4px; }
.info-item label { font-size: 10px; color: #9aa0b0; display: block; margin-bottom: 4px; }
.info-item value { font-size: 13px; color: #e0e0e0; font-weight: 600; }
.material-select { display: flex; gap: 6px; flex-wrap: wrap; }
.material-btn { padding: 8px 12px; background: #3a3a4a; border: 2px solid transparent; border-radius: 4px; cursor: pointer; font-size: 11px; transition: all 0.2s; }
.material-btn:hover { background: #4a4a5a; }
.material-btn.active { border-color: #7aa2f7; background: #3a4a6a; }
.progress-bar { width: 100%; height: 6px; background: #2a2a3a; border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #7aa2f7, #8ab4ff); transition: width 0.1s; }
.view-controls { position: absolute; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 6px; z-index: 10; }
.view-btn { width: 36px; height: 36px; background: rgba(30,30,40,0.8); border: 1px solid #3a3a4a; border-radius: 4px; color: #e0e0e0; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.view-btn:hover { background: rgba(50,50,60,0.8); }
.machine-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.machine-btn { padding: 12px; background: #3a3a4a; border: 2px solid transparent; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
.machine-btn:hover { background: #4a4a5a; }
.machine-btn.estop { background: #f7768e; color: #1a1a2a; }
.machine-btn.estop:hover { background: #ff8a9e; }
.machine-btn.cycle { background: #9ece6a; color: #1a1a2a; }
.machine-btn.cycle:hover { background: #b0e07a; }
.machine-btn.feedhold { background: #e0af68; color: #1a1a2a; }
.machine-btn.feedhold:hover { background: #f0bf78; }
.machine-btn.active { border-color: #7aa2f7; }
</style>
</head>
<body>
<div id="app">
<div id="viewport">
<div class="view-controls">
<button class="view-btn" onclick="setView('top')" title="Top View">⊤</button>
<button class="view-btn" onclick="setView('front')" title="Front View">⊡</button>
<button class="view-btn" onclick="setView('side')" title="Side View">⊏</button>
<button class="view-btn" onclick="setView('iso')" title="Isometric">⋈</button>
</div>
<div class="status-bar">
<div class="status-item"><span class="status-label">Status:</span><span class="status-value" id="statusText">Ready</span></div>
<div class="status-item"><span class="status-label">X:</span><span class="status-value" id="xPos">0.00</span></div>
<div class="status-item"><span class="status-label">Y:</span><span class="status-value" id="yPos">0.00</span></div>
<div class="status-item"><span class="status-label">Z:</span><span class="status-value" id="zPos">0.00</span></div>
<div class="status-item"><span class="status-label">Feed:</span><span class="status-value" id="feedRate">0</span><span class="status-label">mm/min</span></div>
<div class="status-item"><span class="status-label">Spindle:</span><span class="status-value" id="spindleSpeed">0</span><span class="status-label">RPM</span></div>
</div>
</div>
<div id="sidebar">
<div class="panel">
<h3>Machine Control</h3>
<div class="machine-controls">
<button class="machine-btn cycle" id="cycleStartBtn" onclick="cycleStart()">▶ Cycle Start</button>
<button class="machine-btn feedhold" id="feedHoldBtn" onclick="feedHold()">⏸ Feed Hold</button>
<button class="machine-btn estop" id="estopBtn" onclick="emergencyStop()">⏹ E-STOP</button>
<button class="machine-btn" onclick="resetMachine()">↺ Reset</button>
</div>
<div class="control-row" style="margin-top: 12px;">
<label>Speed:</label>
<input type="range" id="speedSlider" min="0.1" max="10" step="0.1" value="1" oninput="updateSpeed(this.value)">
<span id="speedValue">1.0x</span>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressBar" style="width: 0%"></div></div>
<div style="margin-top: 8px; font-size: 12px; color: #9aa0b0;">Progress: <span id="progressText">0%</span></div>
</div>
<div class="panel">
<h3>Material</h3>
<div class="material-select">
<button class="material-btn active" onclick="setMaterial('balsa', this)">Balsa Wood</button>
<button class="material-btn" onclick="setMaterial('hardwood', this)">Hardwood</button>
<button class="material-btn" onclick="setMaterial('foam', this)">Foam</button>
<button class="material-btn" onclick="setMaterial('acrylic', this)">Acrylic</button>
<button class="material-btn" onclick="setMaterial('aluminium', this)">Aluminium</button>
</div>
</div>
<div class="panel">
<h3>Machine Info</h3>
<div class="info-grid">
<div class="info-item"><label>Machine</label><value>Denford VR5</value></div>
<div class="info-item"><label>Table Size</label><value>400×300mm</value></div>
<div class="info-item"><label>X Travel</label><value>400mm</value></div>
<div class="info-item"><label>Y Travel</label><value>300mm</value></div>
<div class="info-item"><label>Z Travel</label><value>150mm</value></div>
<div class="info-item"><label>Spindle</label><value>8000 RPM</value></div>
<div class="info-item"><label>Tool Changer</label><value>10 Position</value></div>
<div class="info-item"><label>Coolant</label><value id="coolantStatus">OFF</value></div>
</div>
</div>
<div class="panel">
<h3>Tool Info</h3>
<div class="info-grid">
<div class="info-item"><label>Current Tool</label><value id="toolName">T01 - 1/4" Ball Nose</value></div>
<div class="info-item"><label>Diameter</label><value id="toolDiameter">6.35mm</value></div>
<div class="info-item"><label>Flutes</label><value id="toolFlutes">2</value></div>
<div class="info-item"><label>Length</label><value id="toolLength">50mm</value></div>
</div>
</div>
<div class="panel">
<h3>Program</h3>
<button class="btn" onclick="loadGCode()">📂 Load G-Code</button>
<button class="btn" onclick="captureScreenshot()">📷 Capture Screen</button>
<input type="file" id="gcodeFile" accept=".nc,.gcode,.fnc,.txt" style="display:none" onchange="handleFileLoad(event)">
</div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Scene setup
const viewport = document.getElementById('viewport');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0f);

const camera = new THREE.PerspectiveCamera(60, viewport.clientWidth / viewport.clientHeight, 0.1, 10000);
camera.position.set(300, 300, 300);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
viewport.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
directionalLight.position.set(200, 400, 200);
directionalLight.castShadow = true;
directionalLight.shadow.camera.left = -500;
directionalLight.shadow.camera.right = 500;
directionalLight.shadow.camera.top = 500;
directionalLight.shadow.camera.bottom = -500;
scene.add(directionalLight);

const pointLight = new THREE.PointLight(0x7aa2f7, 0.5, 500);
pointLight.position.set(0, 200, 0);
scene.add(pointLight);

// State
const state = {
  playing: false,
  paused: false,
  progress: 0,
  speed: 1,
  material: 'balsa',
  billet: { x: 223, y: 50, z: 65 },
  toolpath: [],
  currentPosition: { x: 0, y: 0, z: 75 },
  animationId: null,
  lastTime: 0,
  heightmap: null,
  heightmapRes: 100,
  cutMap: null,
  spindleOn: false,
  coolantOn: false,
  currentTool: 1,
  feedRate: 0
};

// Material colors
const MATERIAL_COLORS = {
  balsa: { base: 0xd2b48c, cut: 0xb4966e },
  hardwood: { base: 0x8b5a2b, cut: 0x784b23 },
  foam: { base: 0xf0e6d2, cut: 0xdcd2be },
  acrylic: { base: 0xc8dcf0, cut: 0xb4c8dc },
  aluminium: { base: 0xc0c0c0, cut: 0xa0a0a0 }
};

// Machine components
const machineGroup = new THREE.Group();
scene.add(machineGroup);

// Machine table
const tableGeometry = new THREE.BoxGeometry(400, 10, 300);
const tableMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a4a, metalness: 0.7, roughness: 0.3 });
const table = new THREE.Mesh(tableGeometry, tableMaterial);
table.position.y = -5;
table.receiveShadow = true;
machineGroup.add(table);

// Table grid
const gridHelper = new THREE.GridHelper(400, 20, 0x4a4a5a, 0x3a3a4a);
gridHelper.position.y = 0.1;
machineGroup.add(gridHelper);

// Machine frame
const frameMaterial = new THREE.MeshStandardMaterial({ color: 0x5a5a6a, metalness: 0.8, roughness: 0.2 });

// Vertical columns
const columnGeometry = new THREE.BoxGeometry(30, 400, 30);
const leftColumn = new THREE.Mesh(columnGeometry, frameMaterial);
leftColumn.position.set(-180, 200, 0);
leftColumn.castShadow = true;
machineGroup.add(leftColumn);

const rightColumn = new THREE.Mesh(columnGeometry, frameMaterial);
rightColumn.position.set(180, 200, 0);
rightColumn.castShadow = true;
machineGroup.add(rightColumn);

// Top beam
const beamGeometry = new THREE.BoxGeometry(390, 30, 30);
const topBeam = new THREE.Mesh(beamGeometry, frameMaterial);
topBeam.position.set(0, 400, 0);
topBeam.castShadow = true;
machineGroup.add(topBeam);

// Spindle head
const spindleHeadGeometry = new THREE.BoxGeometry(60, 80, 60);
const spindleHead = new THREE.Mesh(spindleHeadGeometry, frameMaterial);
spindleHead.position.set(0, 320, 0);
spindleHead.castShadow = true;
machineGroup.add(spindleHead);

// Billet
let billetMesh = null;
let billetMaterial = null;

function createBillet() {
  if (billetMesh) {
    machineGroup.remove(billetMesh);
  }
  
  const b = state.billet;
  const geometry = new THREE.BoxGeometry(b.x, b.z, b.y);
  const color = MATERIAL_COLORS[state.material].base;
  billetMaterial = new THREE.MeshStandardMaterial({ 
    color: color,
    metalness: 0.1,
    roughness: 0.8,
    transparent: true,
    opacity: 1.0
  });
  billetMesh = new THREE.Mesh(geometry, billetMaterial);
  billetMesh.position.set(0, b.z / 2, 0);
  billetMesh.castShadow = true;
  billetMesh.receiveShadow = true;
  machineGroup.add(billetMesh);
}

function updateBilletVisibility() {
  if (!billetMesh) return;
  
  // Hide billet when cutting has started
  if (state.progress > 0) {
    billetMesh.visible = false;
  } else {
    billetMesh.visible = true;
  }
}

// Initialize billet
createBillet();

// Spindle and tool
const spindleGroup = new THREE.Group();
machineGroup.add(spindleGroup);

// Spindle body
const spindleGeometry = new THREE.CylinderGeometry(15, 15, 40, 16);
const spindleMaterial = new THREE.MeshStandardMaterial({ color: 0x5a5a6a, metalness: 0.9, roughness: 0.1 });
const spindle = new THREE.Mesh(spindleGeometry, spindleMaterial);
spindle.position.y = 20;
spindle.castShadow = true;
spindleGroup.add(spindle);

// Tool
const toolGeometry = new THREE.CylinderGeometry(3.175, 3.175, 50, 8);
const toolMaterial = new THREE.MeshStandardMaterial({ color: 0x7aa2f7, metalness: 0.8, roughness: 0.2 });
const tool = new THREE.Mesh(toolGeometry, toolMaterial);
tool.position.y = -25;
tool.castShadow = true;
spindleGroup.add(tool);

// Tool tip (ball nose)
const tipGeometry = new THREE.SphereGeometry(3.175, 16, 16);
const tip = new THREE.Mesh(tipGeometry, toolMaterial);
tip.position.y = -50;
tip.castShadow = true;
spindleGroup.add(tip);

// Position spindle at safe height
spindleGroup.position.set(0, 100, 0);

// Toolpath visualization
let toolpathLine = null;

function createToolpathVisualization() {
  if (toolpathLine) {
    machineGroup.remove(toolpathLine);
  }
  
  if (state.toolpath.length < 2) return;
  
  const points = state.toolpath.map(pt => new THREE.Vector3(pt[0] - state.billet.x/2, pt[2], pt[1] - state.billet.y/2));
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const material = new THREE.LineBasicMaterial({ color: 0x7aa2f7, opacity: 0.3, transparent: true });
  toolpathLine = new THREE.Line(geometry, material);
  machineGroup.add(toolpathLine);
}

// Cut surface visualization
let cutSurfaceMesh = null;
let originalBilletMesh = null;

function createCutSurface() {
  if (cutSurfaceMesh) {
    machineGroup.remove(cutSurfaceMesh);
    cutSurfaceMesh.geometry.dispose();
    cutSurfaceMesh.material.dispose();
  }
  
  if (!state.cutMap || !state.heightmap) return;
  
  const b = state.billet;
  const res = state.heightmapRes;
  const cellW = b.x / res;
  const cellH = b.y / res;
  
  // Create a geometry that represents the carved surface
  const geometry = new THREE.BufferGeometry();
  const vertices = [];
  const indices = [];
  const normals = [];
  
  // Build vertices for each grid point
  for (let gy = 0; gy <= res; gy++) {
    for (let gx = 0; gx <= res; gx++) {
      const x = gx * cellW - b.x/2;
      const y = gy * cellH - b.y/2;
      
      let z;
      if (gx < res && gy < res) {
        const idx = gy * res + gx;
        z = state.cutMap[idx];
      } else {
        z = b.z; // Edge points at original height
      }
      
      vertices.push(x, z, y);
      normals.push(0, 1, 0); // Will be recalculated
    }
  }
  
  // Build faces (two triangles per grid cell)
  for (let gy = 0; gy < res; gy++) {
    for (let gx = 0; gx < res; gx++) {
      const a = gy * (res + 1) + gx;
      const b = gy * (res + 1) + (gx + 1);
      const c = (gy + 1) * (res + 1) + gx;
      const d = (gy + 1) * (res + 1) + (gx + 1);
      
      indices.push(a, b, c);
      indices.push(b, d, c);
    }
  }
  
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  
  const material = new THREE.MeshStandardMaterial({ 
    color: MATERIAL_COLORS[state.material].cut,
    metalness: 0.1,
    roughness: 0.9,
    side: THREE.DoubleSide,
    flatShading: false
  });
  
  cutSurfaceMesh = new THREE.Mesh(geometry, material);
  cutSurfaceMesh.castShadow = true;
  cutSurfaceMesh.receiveShadow = true;
  machineGroup.add(cutSurfaceMesh);
  
  // Add side walls to show cut depth
  addSideWalls();
}

function addSideWalls() {
  if (!state.cutMap) return;
  
  const b = state.billet;
  const res = state.heightmapRes;
  const cellW = b.x / res;
  const cellH = b.y / res;
  
  // Front wall (y = 0)
  const frontWall = createWallMesh(res, cellW, 'front');
  machineGroup.add(frontWall);
  
  // Back wall (y = b.y)
  const backWall = createWallMesh(res, cellW, 'back');
  machineGroup.add(backWall);
  
  // Left wall (x = 0)
  const leftWall = createWallMesh(res, cellH, 'left');
  machineGroup.add(leftWall);
  
  // Right wall (x = b.x)
  const rightWall = createWallMesh(res, cellH, 'right');
  machineGroup.add(rightWall);
}

function createWallMesh(res, cellSize, side) {
  const b = state.billet;
  const geometry = new THREE.BufferGeometry();
  const vertices = [];
  const indices = [];
  
  if (side === 'front' || side === 'back') {
    const y = side === 'front' ? -b.y/2 : b.y/2;
    for (let gx = 0; gx <= res; gx++) {
      const x = gx * cellSize - b.x/2;
      const idx = side === 'front' ? gx : (res - 1) * res + gx;
      const z = state.cutMap[idx] || b.z;
      
      // Top vertex (cut surface)
      vertices.push(x, z, y);
      // Bottom vertex (base)
      vertices.push(x, 0, y);
    }
    
    for (let gx = 0; gx < res; gx++) {
      const a = gx * 2;
      const b = gx * 2 + 1;
      const c = (gx + 1) * 2;
      const d = (gx + 1) * 2 + 1;
      
      if (side === 'front') {
        indices.push(a, c, b);
        indices.push(b, c, d);
      } else {
        indices.push(a, b, c);
        indices.push(b, d, c);
      }
    }
  } else {
    const x = side === 'left' ? -b.x/2 : b.x/2;
    for (let gy = 0; gy <= res; gy++) {
      const y = gy * cellSize - b.y/2;
      const idx = gy * res + (side === 'left' ? 0 : res - 1);
      const z = state.cutMap[idx] || b.z;
      
      vertices.push(x, z, y);
      vertices.push(x, 0, y);
    }
    
    for (let gy = 0; gy < res; gy++) {
      const a = gy * 2;
      const b = gy * 2 + 1;
      const c = (gy + 1) * 2;
      const d = (gy + 1) * 2 + 1;
      
      if (side === 'left') {
        indices.push(a, b, c);
        indices.push(b, d, c);
      } else {
        indices.push(a, c, b);
        indices.push(b, c, d);
      }
    }
  }
  
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  
  const material = new THREE.MeshStandardMaterial({ 
    color: MATERIAL_COLORS[state.material].base,
    metalness: 0.1,
    roughness: 0.9,
    side: THREE.DoubleSide
  });
  
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// Chip/swarf particles
const chipParticles = [];

function createChip(x, y, z) {
  const chipGeometry = new THREE.SphereGeometry(0.5, 4, 4);
  const chipMaterial = new THREE.MeshBasicMaterial({ color: 0xd2b48c });
  const chip = new THREE.Mesh(chipGeometry, chipMaterial);
  chip.position.set(x, y, z);
  chip.userData.velocity = new THREE.Vector3(
    (Math.random() - 0.5) * 2,
    Math.random() * 2 + 1,
    (Math.random() - 0.5) * 2
  );
  chip.userData.life = 1.0;
  machineGroup.add(chip);
  chipParticles.push(chip);
}

function updateChips(dt) {
  for (let i = chipParticles.length - 1; i >= 0; i--) {
    const chip = chipParticles[i];
    chip.position.add(chip.userData.velocity.clone().multiplyScalar(dt));
    chip.userData.velocity.y -= 9.8 * dt;
    chip.userData.life -= dt * 2;
    
    if (chip.userData.life <= 0 || chip.position.y < 0) {
      machineGroup.remove(chip);
      chipParticles.splice(i, 1);
    }
  }
}

// Animation loop
function animate() {
  const now = performance.now();
  const dt = (now - (state.lastTime || now)) / 1000;
  state.lastTime = now;
  
  renderer.render(scene, camera);
  
  if (state.playing && !state.paused) {
    state.progress += dt * state.speed * 0.1;
    
    if (state.progress >= 1) {
      state.progress = 1;
      state.playing = false;
      document.getElementById('statusText').textContent = 'Complete';
      document.getElementById('cycleStartBtn').classList.remove('active');
    }
    
    updateToolPosition();
    updateCutMap();
    updateBilletVisibility();
    
    const progressPct = (state.progress * 100).toFixed(1);
    document.getElementById('progressBar').style.width = progressPct + '%';
    document.getElementById('progressText').textContent = progressPct + '%';
    
    // Create chips during cutting
    if (state.spindleOn && Math.random() < 0.3) {
      const pos = state.currentPosition;
      createChip(pos.x - state.billet.x/2, pos.z, pos.y - state.billet.y/2);
    }
  }
  
  updateChips(dt);
  
  requestAnimationFrame(animate);
}

function updateToolPosition() {
  if (state.toolpath.length === 0) return;
  
  const currentIdx = Math.floor(state.progress * (state.toolpath.length - 1));
  const pos = state.toolpath[currentIdx];
  
  if (!pos) return;
  
  state.currentPosition = { x: pos[0], y: pos[1], z: pos[2] };
  
  spindleGroup.position.set(pos[0] - state.billet.x/2, pos[2], pos[1] - state.billet.y/2);
  
  document.getElementById('xPos').textContent = pos[0].toFixed(2);
  document.getElementById('yPos').textContent = pos[1].toFixed(2);
  document.getElementById('zPos').textContent = pos[2].toFixed(2);
}

function updateCutMap() {
  if (!state.cutMap || !state.heightmap) return;
  
  const currentIdx = Math.floor(state.progress * (state.toolpath.length - 1));
  const pos = state.toolpath[currentIdx];
  
  if (!pos) return;
  
  const b = state.billet;
  const res = state.heightmapRes;
  const cellW = b.x / res;
  const cellH = b.y / res;
  const toolRadius = 3.175;
  
  const gx = Math.floor(pos[0] / cellW);
  const gy = Math.floor(pos[1] / cellH);
  
  const radius = Math.ceil(toolRadius / cellW);
  for (let dy = -radius; dy <= radius; dy++) {
    for (let dx = -radius; dx <= radius; dx++) {
      if (dx*dx + dy*dy <= radius*radius) {
        const cx = gx + dx;
        const cy = gy + dy;
        if (cx >= 0 && cx < res && cy >= 0 && cy < res) {
          const idx = cy * res + cx;
          const targetZ = state.heightmap[idx];
          if (pos[2] < targetZ && pos[2] < state.cutMap[idx]) {
            state.cutMap[idx] = pos[2];
          }
        }
      }
    }
  }
  
  createCutSurface();
}

// Machine control functions
function cycleStart() {
  if (state.toolpath.length === 0) {
    alert('No toolpath loaded. Please load G-code first.');
    return;
  }
  
  state.playing = true;
  state.paused = false;
  state.spindleOn = true;
  document.getElementById('statusText').textContent = 'Running';
  document.getElementById('cycleStartBtn').classList.add('active');
  document.getElementById('spindleSpeed').textContent = '8000';
  
  state.lastTime = performance.now();
}

function feedHold() {
  state.paused = !state.paused;
  document.getElementById('statusText').textContent = state.paused ? 'Feed Hold' : 'Running';
  if (!state.paused) {
    state.lastTime = performance.now();
  }
}

function emergencyStop() {
  state.playing = false;
  state.paused = false;
  state.spindleOn = false;
  state.coolantOn = false;
  
  document.getElementById('statusText').textContent = 'E-STOP';
  document.getElementById('cycleStartBtn').classList.remove('active');
  document.getElementById('spindleSpeed').textContent = '0';
  document.getElementById('coolantStatus').textContent = 'OFF';
}

function resetMachine() {
  emergencyStop();
  state.progress = 0;
  
  if (state.cutMap) {
    for (let i = 0; i < state.cutMap.length; i++) {
      state.cutMap[i] = state.billet.z;
    }
  }
  
  document.getElementById('statusText').textContent = 'Ready';
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressText').textContent = '0%';
  
  createCutSurface();
}

function updateSpeed(value) {
  state.speed = parseFloat(value);
  document.getElementById('speedValue').textContent = value + 'x';
}

function setMaterial(material, btn) {
  state.material = material;
  document.querySelectorAll('.material-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  createBillet();
  createCutSurface();
}

function setView(view) {
  switch(view) {
    case 'top':
      camera.position.set(0, 500, 0);
      camera.lookAt(0, 0, 0);
      break;
    case 'front':
      camera.position.set(0, 100, 400);
      camera.lookAt(0, 100, 0);
      break;
    case 'side':
      camera.position.set(400, 100, 0);
      camera.lookAt(0, 100, 0);
      break;
    case 'iso':
      camera.position.set(300, 300, 300);
      camera.lookAt(0, 0, 0);
      break;
  }
}

function loadGCode() {
  document.getElementById('gcodeFile').click();
}

function handleFileLoad(event) {
  const file = event.target.files[0];
  if (!file) {
    console.log('No file selected');
    return;
  }
  
  console.log('Loading file:', file.name, 'size:', file.size);
  
  const reader = new FileReader();
  reader.onload = (e) => {
    console.log('File loaded, content length:', e.target.result.length);
    parseGCode(e.target.result);
  };
  reader.onerror = (e) => {
    console.error('Error reading file:', e);
    alert('Error reading file');
  };
  reader.readAsText(file);
}

function parseGCode(gcode) {
  console.log('Parsing G-code, length:', gcode.length);
  const lines = gcode.split('\n');
  state.toolpath = [];
  
  let x = 0, y = 0, z = 75;
  let lineCount = 0;
  let moveCount = 0;
  
  lines.forEach(line => {
    lineCount++;
    line = line.trim();
    
    // Skip empty lines and comments
    if (!line || line.startsWith(';') || line.startsWith('(') || line.startsWith('%')) return;
    
    // Remove inline comments
    line = line.split(';')[0].split('(')[0].trim();
    
    // Check for G0 or G1 (rapid or feed move)
    if (line.match(/G0[01]?/i) || line.match(/G1[01]?/i)) {
      const xMatch = line.match(/X([+-]?[\d.]+)/i);
      const yMatch = line.match(/Y([+-]?[\d.]+)/i);
      const zMatch = line.match(/Z([+-]?[\d.]+)/i);
      const fMatch = line.match(/F([+-]?[\d.]+)/i);
      
      if (xMatch) x = parseFloat(xMatch[1]);
      if (yMatch) y = parseFloat(yMatch[1]);
      if (zMatch) z = parseFloat(zMatch[1]);
      if (fMatch) state.feedRate = parseFloat(fMatch[1]);
      
      state.toolpath.push([x, y, z]);
      moveCount++;
    }
  });
  
  console.log(`Parsed ${lineCount} lines, found ${moveCount} moves`);
  
  if (state.toolpath.length > 0) {
    console.log('Toolpath created with', state.toolpath.length, 'points');
    console.log('First point:', state.toolpath[0]);
    console.log('Last point:', state.toolpath[state.toolpath.length - 1]);
    
    initializeMaps();
    createToolpathVisualization();
    render(); // Force render after loading
    
    document.getElementById('statusText').textContent = `Loaded ${state.toolpath.length} points`;
    document.getElementById('feedRate').textContent = state.feedRate.toFixed(0);
    
    console.log('Visualization created, render called');
  } else {
    console.error('No toolpath points found!');
    alert('No G-code moves found in file. Check console for details.');
  }
}

function initializeMaps() {
  const res = state.heightmapRes;
  state.heightmap = new Float32Array(res * res);
  state.cutMap = new Float32Array(res * res);
  
  const b = state.billet;
  const cellW = b.x / res;
  const cellH = b.y / res;
  
  state.toolpath.forEach(pt => {
    const gx = Math.floor(pt[0] / cellW);
    const gy = Math.floor(pt[1] / cellH);
    if (gx >= 0 && gx < res && gy >= 0 && gy < res) {
      const idx = gy * res + gx;
      if (pt[2] < state.heightmap[idx] || state.heightmap[idx] === 0) {
        state.heightmap[idx] = pt[2];
      }
    }
  });
  
  for (let i = 0; i < state.cutMap.length; i++) {
    state.cutMap[i] = b.z;
  }
}

function captureScreenshot() {
  renderer.domElement.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vr-cnc-screenshot.png';
    a.click();
    URL.revokeObjectURL(url);
  });
}

// Mouse controls
let isDragging = false;
let lastMouse = { x: 0, y: 0 };

renderer.domElement.addEventListener('mousedown', (e) => {
  isDragging = true;
  lastMouse = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  
  const dx = e.clientX - lastMouse.x;
  const dy = e.clientY - lastMouse.y;
  
  const radius = camera.position.length();
  const theta = Math.atan2(camera.position.x, camera.position.z);
  const phi = Math.acos(camera.position.y / radius);
  
  camera.position.x = radius * Math.sin(phi - dy * 0.01) * Math.sin(theta - dx * 0.01);
  camera.position.y = radius * Math.cos(phi - dy * 0.01);
  camera.position.z = radius * Math.sin(phi - dy * 0.01) * Math.cos(theta - dx * 0.01);
  
  camera.lookAt(0, 0, 0);
  
  lastMouse = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('mouseup', () => {
  isDragging = false;
});

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.1 : 0.9;
  camera.position.multiplyScalar(factor);
});

// Check for URL parameters
function checkURLParams() {
  const params = new URLSearchParams(window.location.search);
  const gcode = params.get('gcode');
  
  if (gcode) {
    parseGCode(decodeURIComponent(gcode));
  }
}

// Window resize
window.addEventListener('resize', () => {
  camera.aspect = viewport.clientWidth / viewport.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(viewport.clientWidth, viewport.clientHeight);
});

// Initialize
checkURLParams();
animate();
</script>

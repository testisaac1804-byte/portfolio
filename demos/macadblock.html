<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MacAdBlock</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--text:#e6edf3;--muted:#8b949e;--accent:#22c55e;--accentdim:rgba(34,197,94,.14);--border:#30363d;--red:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.win{width:100%;max-width:780px;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.tb{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#10151c;border-bottom:1px solid var(--border)}
.dots{display:flex;gap:7px}
.dot{width:12px;height:12px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.tb .t{flex:1;text-align:center;font-size:12.5px;color:var(--muted);letter-spacing:.3px}
.tb .side{width:44px}
.body{padding:22px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.hd h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accentdim);display:flex;align-items:center;justify-content:center;font-size:18px}
.pill{font-size:11px;font-weight:600;color:var(--muted);background:var(--panel2);border:1px solid var(--border);padding:4px 10px;border-radius:20px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pill.on{color:var(--accent);border-color:rgba(34,197,94,.4);background:var(--accentdim)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:18px}
.hero .left{display:flex;flex-direction:column;gap:7px}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px}
.bigcount{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.bigcount .u{font-size:15px;color:var(--muted);font-weight:600;margin-left:6px}
.statusline{font-size:12.5px;color:var(--muted)}
.statusline b{color:var(--accent);font-weight:600}
.statusline b.off{color:var(--muted)}
.sw{position:relative;display:inline-block;width:118px;height:56px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:#21262d;border:2px solid var(--border);border-radius:40px;cursor:pointer;transition:.28s}
.sl:before{content:"";position:absolute;height:38px;width:38px;left:7px;bottom:7px;background:#e6edf3;border-radius:50%;transition:.28s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sw input:checked + .sl{background:var(--accent);border-color:var(--accent)}
.sw input:checked + .sl:before{transform:translateX(62px);background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.8px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:16px;overflow:hidden}
.card h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .live{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.log{max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.log .row{display:flex;gap:8px;padding:4px 6px;border-radius:5px;align-items:center}
.log .row:hover{background:#21262d}
.log .ts{color:#484f58;flex-shrink:0}
.log .flag{color:var(--accent);flex-shrink:0;font-weight:700}
.log .dom{color:#e6edf3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rules{list-style:none;display:flex;flex-direction:column;gap:7px;max-height:230px;overflow-y:auto}
.rules li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:6px;background:#21262d;font-size:12px}
.rules .cnt{color:var(--muted);font-size:11px;font-family:ui-monospace,Menlo,monospace;flex-shrink:0}
.rules .state{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
.rules .state.off{background:#484f58}
@media(max-width:620px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="win">
  <div class="tb">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <div class="t">MacAdBlock — DNS Ad-Blocker Daemon</div>
    <div class="side"></div>
  </div>
  <div class="body">
    <div class="hd">
      <h1><span class="logo">🛡️</span> MacAdBlock</h1>
      <span class="pill on" id="portPill">PORT 8053</span>
    </div>

    <div class="hero">
      <div class="left">
        <div class="label">Blocked requests</div>
        <div class="bigcount"><span id="counter">0</span><span class="u">blocked</span></div>
        <div class="statusline" id="statusline">Daemon <b>active</b> · filtering DNS on 127.0.0.1:8053</div>
      </div>
      <label class="sw">
        <input type="checkbox" id="power" checked onchange="A.toggle(this.checked)">
        <span class="sl"></span>
      </label>
    </div>

    <div class="stats">
      <div class="stat"><div class="v" id="stTotal">0</div><div class="k">Total blocked</div></div>
      <div class="stat"><div class="v" id="stRules">12</div><div class="k">Filter rules</div></div>
      <div class="stat"><div class="v" id="stUptime">00:00:00</div><div class="k">Uptime</div></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3><span class="live"></span> Blocked log</h3>
        <div class="log" id="log"></div>
      </div>
      <div class="card">
        <h3>Filter rules</h3>
        <ul class="rules" id="rules"></ul>
      </div>
    </div>
  </div>
</div>
<script>
var A = {
  on: true,
  count: 0,
  total: 1847293,
  t0: Date.now(),
  rules: [
    "doubleclick.net", "google-analytics.com", "googletagmanager.com",
    "ads.facebook.com", "tracker.google.com", "stats.wp.com",
    "pixel.quantserve.com", "amazon-adsystem.com", "scorecardresearch.com",
    "adservice.google.com", "taboola.com", "outbrain.com"
  ],
  pool: [
    "ads.doubleclick.net", "tracker.google.com", "analytics.facebook.com",
    "google-analytics.com", "googletagmanager.com", "adservice.google.com",
    "stats.wp.com", "pixel.quantserve.com", "c.amazon-adsystem.com",
    "sb.scorecardresearch.com", "cdn.taboola.com", "widgets.outbrain.com",
    "ad-delivery.net", "pubmatic.com", "rubiconproject.com"
  ],
  rows: [],
  pad: function(n){ return (n < 10 ? "0" : "") + n; },
  ts: function(){
    var d = new Date();
    return A.pad(d.getHours()) + ":" + A.pad(d.getMinutes()) + ":" + A.pad(d.getSeconds());
  },
  toggle: function(v){
    A.on = v;
    var el = document.getElementById("power");
    el.checked = v;
    document.getElementById("statusline").innerHTML =
      v ? 'Daemon <b>active</b> · filtering DNS on 127.0.0.1:8053' :
          'Daemon <b class="off">stopped</b> · DNS passthrough enabled';
    var pill = document.getElementById("portPill");
    if (v) { pill.className = "pill on"; pill.textContent = "PORT 8053"; }
    else { pill.className = "pill"; pill.textContent = "OFFLINE"; }
  },
  tick: function(){
    if (A.on && Math.random() < 0.7) {
      A.count++; A.total++;
      var d = A.pool[Math.floor(Math.random() * A.pool.length)];
      A.rows.unshift({t: A.ts(), d: d});
      if (A.rows.length > 24) A.rows.pop();
      A.renderLog();
      document.getElementById("counter").textContent = A.count;
      document.getElementById("stTotal").textContent = A.total.toLocaleString();
    }
    var up = Math.floor((Date.now() - A.t0) / 1000);
    var h = A.pad(Math.floor(up / 3600));
    var m = A.pad(Math.floor((up % 3600) / 60));
    var s = A.pad(up % 60);
    document.getElementById("stUptime").textContent = h + ":" + m + ":" + s;
  },
  renderLog: function(){
    var html = "";
    for (var i = 0; i < A.rows.length; i++) {
      html += '<div class="row"><span class="ts">' + A.rows[i].t + '</span>' +
              '<span class="flag">✕</span><span class="dom">' + A.rows[i].d + '</span></div>';
    }
    document.getElementById("log").innerHTML = html || '<div class="row"><span class="dom" style="color:#484f58">no requests blocked yet…</span></div>';
  },
  renderRules: function(){
    var html = "";
    for (var i = 0; i < A.rules.length; i++) {
      html += '<li><span class="state"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
              A.rules[i] + '</span><span class="cnt">' +
              (Math.floor(Math.random() * 9000) + 100).toLocaleString() + '</span></li>';
    }
    document.getElementById("rules").innerHTML = html;
  },
  init: function(){
    A.renderRules();
    A.renderLog();
    document.getElementById("stRules").textContent = A.rules.length;
    document.getElementById("stTotal").textContent = A.total.toLocaleString();
    setInterval(A.tick, 900);
  }
};
A.init();
</script>
</body>
</html>

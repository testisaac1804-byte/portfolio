<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y10 IGCSE OTP Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2129; --text: #e6edf3;
    --accent: #6366f1; --accent2: #818cf8; --muted: #8b949e; --border: #21262d;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px;
    display: flex; align-items: center; justify-content: center;
  }
  .window { width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .titlebar { display: flex; align-items: center; gap: 8px; padding: 11px 14px; background: #11151b; border-bottom: 1px solid var(--border); }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tbtitle { flex: 1; text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; }
  .content { padding: 26px; text-align: center; }
  .ring-wrap { position: relative; width: 190px; height: 190px; margin: 4px auto 18px; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--panel2); stroke-width: 10; }
  .ring-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .code { font-size: 34px; font-weight: 700; letter-spacing: 5px; font-family: ui-monospace, Menlo, monospace; }
  .secs { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .secs b { color: var(--accent2); }
  h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .issuer { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 22px; }
  .btn { background: var(--accent); color: #fff; border: none; padding: 9px 18px; border-radius: 7px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .btn:hover { background: var(--accent2); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn.ghost:hover { color: var(--text); border-color: var(--muted); }
  .prev-wrap { text-align: left; }
  .prev-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }
  .prev { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .prev-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .prev-row:last-child { border-bottom: none; }
  .prev-row .c { font-family: ui-monospace, Menlo, monospace; color: var(--accent2); letter-spacing: 2px; }
  .prev-row .w { color: var(--muted); font-size: 11.5px; }
  .prev-row .exp { color: #f85149; font-size: 11px; }
  .toast { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: #1f6feb; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13.5px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="tbtitle">Y10 IGCSE OTP Generator</span>
    </div>
    <div class="content">
      <h2>One-time password</h2>
      <div class="issuer">School Portal · issac@igcse.local</div>

      <div class="ring-wrap">
        <svg width="190" height="190">
          <circle class="ring-bg" cx="95" cy="95" r="82"></circle>
          <circle class="ring-fg" id="ring" cx="95" cy="95" r="82" stroke-dasharray="515.2" stroke-dashoffset="0"></circle>
        </svg>
        <div class="center">
          <div class="code" id="code">------</div>
          <div class="secs">expires in <b id="secs">30</b>s</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn ghost" onclick="O.copy()">📋 Copy</button>
        <button class="btn" onclick="O.regenerate()">↻ Regenerate</button>
      </div>

      <div class="prev-wrap">
        <div class="prev-title">Previous codes</div>
        <div class="prev" id="prevList"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
  var O = {
    period: 30,
    prev: [],
    // Deterministic LCG seeded by a number -> stable 6-digit code within a window
    codeFor: function (seed) {
      var s = seed >>> 0;
      var x = (s * 1664525 + 1013904223) >>> 0;
      x = (x * 1664525 + 1013904223) >>> 0;
      var n = x % 1000000;
      var str = String(n);
      while (str.length < 6) str = '0' + str;
      return str;
    },
    tick: function () {
      var now = Math.floor(Date.now() / 1000);
      var windowIdx = Math.floor(now / this.period);
      var rem = this.period - (now % this.period);
      var code = this.codeFor(windowIdx);
      if (code !== this._cur) {
        this._cur = code;
        this.prev.unshift({ c: code, w: windowIdx, e: false });
        if (this.prev.length > 8) this.prev.pop();
        this.renderPrev();
      }
      document.getElementById('code').textContent = code;
      document.getElementById('secs').textContent = rem;
      var frac = rem / this.period;
      document.getElementById('ring').style.strokeDashoffset = String(515.2 * frac);
    },
    renderPrev: function () {
      var box = document.getElementById('prevList');
      var html = '';
      for (var i = 0; i < this.prev.length; i++) {
        var p = this.prev[i];
        var d = new Date(p.w * this.period * 1000);
        var hh = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
        html += '<div class="prev-row"><span class="c">' + p.c + '</span>' +
          '<span class="w">' + hh + '</span>' +
          (i === 0 ? '' : '<span class="exp">expired</span>') + '</div>';
      }
      box.innerHTML = html;
    },
    regenerate: function () {
      // force a brand new code immediately (push into history)
      this._cur = null;
      this.tick();
      this.toast('New code generated');
    },
    copy: function () {
      var code = document.getElementById('code').textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code);
      }
      this.toast('Code copied: ' + code);
    },
    toast: function (msg) {
      var t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(this._tt);
      this._tt = setTimeout(function () { t.classList.remove('show'); }, 1800);
    }
  };
  O.tick();
  setInterval(function () { O.tick(); }, 1000);
</script>
</body>
</html>

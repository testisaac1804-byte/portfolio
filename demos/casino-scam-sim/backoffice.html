<style>
:root{--gold:#d4af37;--gold2:#f0d98c;--bg:#0d0f14;--panel:#151925;--panel2:#1c2233;--line:#2a3247;--txt:#e8e6df;--dim:#8b93a7;--red:#e5484d;--green:#3fb36a;--blue:#4d8df6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0c11;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",Roboto,sans-serif;min-height:100vh}
.console{max-width:1000px;margin:16px auto;display:flex;min-height:600px;border:1px solid #2a3247;border-radius:14px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.5)}
.side{width:190px;flex:0 0 auto;background:#11141d;border-right:1px solid #2a3247;padding:12px 8px}
.side .logo{font-size:12px;color:var(--gold2);font-weight:800;padding:6px 10px 14px;border-bottom:1px solid #2a3247;margin-bottom:10px}
.side button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--dim);padding:8px 10px;border-radius:8px;font-size:12.5px;cursor:pointer}
.side button:hover{background:var(--panel2);color:var(--txt)}
.side button.on{background:var(--gold);color:#14100a;font-weight:700}
.main{flex:1;background:var(--panel);padding:16px;overflow-y:auto}
h3{color:var(--gold2);font-size:14px;margin-bottom:10px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}
.card .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
.card .row:last-child{border:none}
.card .v{color:var(--gold2);font-weight:700}
.explain{background:rgba(77,141,246,.1);border:1px solid rgba(77,141,246,.35);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.65;color:#c9d8f5;margin-top:10px}
.explain b{color:var(--blue)}
.warn{background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.4);border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.65;color:#ffd7d7;margin-top:10px}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:11px;font-size:14px;cursor:pointer;font-weight:600;margin-top:10px}
.btn.gold{background:linear-gradient(180deg,#f0d98c,#d4af37 45%,#a8821f);color:#1a1405}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.login-box{max-width:340px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
.login-box h3{text-align:center}
input{width:100%;background:#0a0d14;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:11px;margin-top:8px;font-size:14px}
.pill{display:inline-block;background:rgba(63,179,106,.15);border:1px solid rgba(63,179,106,.4);color:#b8e6c8;border-radius:12px;font-size:10.5px;padding:2px 9px;margin:2px}
.nav{max-width:1000px;margin:14px auto 0;display:flex;gap:8px;padding:0 4px}
.nav a{color:var(--dim);text-decoration:none;font-size:12.5px;border:1px solid var(--line);padding:6px 12px;border-radius:9px}
</style>
</head>

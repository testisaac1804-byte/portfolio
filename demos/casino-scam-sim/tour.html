<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>反詐導覽 · 深度教學 — Casino Scam Simulator</title>
<link rel="stylesheet" href="sim.css">
<style>
:root{--gold:#d4af37;--gold2:#f0d98c;--bg:#0d0f14;--panel:#151925;--panel2:#1c2233;--line:#2a3247;--txt:#e8e6df;--dim:#8b93a7;--red:#e5484d;--green:#3fb36a;--blue:#4d8df6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 800px at 70% -10%,#1a2035 0%,var(--bg) 55%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",Roboto,sans-serif;min-height:100vh;padding-bottom:30px}
.wrap{max-width:860px;margin:0 auto;padding:20px 14px}
h1{font-size:21px;margin-bottom:4px}
h1 b{background:linear-gradient(180deg,#f5e6b0,#d4af37);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:13px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-height:300px}
.card h3{color:var(--gold2);font-size:17px;margin-bottom:12px}
.card .body{font-size:14px;line-height:1.9}
.card .body b{color:var(--gold2)}
.card .body .red{color:var(--red);font-weight:700}
.card .body .green{color:var(--green);font-weight:700}
.card .link{margin-top:14px;font-size:13px}
.card .link a{color:var(--blue);text-decoration:none;border:1px solid var(--line);padding:6px 12px;border-radius:9px;display:inline-block;margin-right:6px;margin-top:4px}
.card .link a:hover{border-color:var(--gold)}
.ctrl{display:flex;gap:8px;margin-top:16px;align-items:center}
.ctrl button{padding:10px 18px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:600}
#prev{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
#next{background:linear-gradient(180deg,#f0d98c,#d4af37);color:#14100a}
#next:disabled,#prev:disabled{opacity:.4;cursor:default}
.pp{color:var(--dim);font-size:12px;margin-left:auto}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:10px}
.g{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12.5px;line-height:1.6}
.g b{color:var(--gold2)}
.quiz-q{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.quiz-q .q{font-size:14px;margin-bottom:8px}
.quiz-q label{display:block;font-size:13px;padding:6px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.quiz-q label:hover{background:var(--panel)}
.quiz-q input{display:none}
.quiz-q input:checked+span{color:var(--gold2);font-weight:700}
.res{font-size:12.5px;margin-top:8px;display:none;line-height:1.6}
.res.ok{color:var(--green)}.res.bad{color:var(--red)}
.btn{display:block;padding:11px;border:none;border-radius:10px;font-size:14px;cursor:pointer;font-weight:600;margin-top:12px}
.btn.gold{background:linear-gradient(180deg,#f0d98c,#d4af37 45%,#a8821f);color:#1a1405}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎓 <b>深度導覽</b> — 10 步看懂非法賭場怎麼騙你</h1>
  <p class="sub">每一課都有真實案例連結。看完做 10 題小測驗,挑戰滿分。</p>

  <div class="card">
    <div class="body" id="tBody"></div>
    <div class="ctrl">
      <button id="prev" onclick="T.goto(T.i-1)">← 上一步</button>
      <button id="next" onclick="T.goto(T.i+1)">下一步 →</button>
      <span class="pp" id="pp"></span>
    </div>
  </div>
</div>
<script src="sim.js"></script>
<script>
var LESSONS = [
  {t:'1️⃣ 第一步: 廣告引流', b:'騙局從你看到的 <b>廣告</b> 開始: Telegram / 論壇 / 色情網站 / 假冒新聞裡的「美女荷官」「註冊送 88」「秒提現」橫幅。<br><br><span class="red">核心:</span> 廣告預算就是騙子的「獲客成本」,點擊的人就是「流量」。<br><br><span class="green">✅ 記住:</span> 真正合法的娛樂場所不需要在色情網站打廣告。<span class="link"><br><a href="sim.html">🏠 首頁</a></span>'},
  {t:'2️⃣ 假 Loading + base64 隱藏跳轉', b:'你點進 <b>218.com</b> —— 白底藍點「Loading...」。<br><br>其實頁面只有一行 JS: 讀出 base64 <span class="mono" style="font-size:12px">aHR0cDovLzE4NS4xODYuMTQ2LjE1Njo4MDgw</span>,解碼後 <b>偷偷跳轉</b>到真實伺服器 (185.186.146.156:8080)。<br><br><span class="red">為什麼?</span> 讓「入口網域」看起來無害,審查的人以為只是個死頁。<span class="link"><br><a href="loading.html">🎬 親自體驗 loading.html</a><a href="hub.html">🌐 218 網址站</a></span>'},
  {t:'3️⃣ 追蹤碼 ?r= / agentName', b:'跳轉時網址尾巴多了 <b>?r=</b> (218) 或 <b>?agentName=ZYM</b> (213)。<br><br>這是 <span class="red">代理分佣系統</span>: 每個「代理」有專屬連結,拉進來的人輸多少,代理抽成多少 (30-45%)。<br><br>你的每個點擊、每筆充值,都被記帳。<span class="green">✅ 這也解釋了為什麼客服死命叫你拉朋友 —— 「推薦好友」就是發展下線。</span><span class="link"><br><a href="door.html">🚪 213 門戶</a></span>'},
  {t:'4️⃣ 備用網址站 (218yc.com)', b:'<b>218yc.com</b> 是「官方備用網址資訊站」: 列出 5 條線路 + 端口 (9900/8866/5569/6899/7730) + 延時數字。<br><br><span class="red">為什麼要這樣?</span> 因為主網域隨時會被封鎖/舉報下架,資訊站保證玩家永遠找得到下一條線路。<br><br>網域每週輪換,註冊商 GoDaddy/Gname 輪流使用,NS 用 <span class="mono" style="font-size:12px">*cne.com</span> 隱藏。<span class="link"><br><a href="hub.html">🌐 遊覽 hub.html</a></span>'},
  {t:'5️⃣ 網域池 + 亂碼子網域 (213)', b:'213 的門戶頁每次載入都從 <b>10 個網域</b> (2138051–59.cc + 3128060.cc) 隨機挑一個,前面再加 <b>8 位隨機子網域</b>:<br><br><span class="mono" style="font-size:12px">yy2iaikt.213001.cc → 14da6ec7.skr005.cc → cdn… → 186.240.215.18</span><br><br><span class="red">效果:</span> 封鎖一個網址,下一秒又有新網址 —— 這就是為什麼「封網域」永遠追不上。<br><br><span class="green">✅ 要打就打: 註冊商 (Gname) + DNS (Cloudflare/AliDNS) + 主機商 (Iens)。</span><span class="link"><br><a href="door.html">🚪 213 門戶</a></span>'},
  {t:'6️⃣ 假瀏覽器下載', b:'門戶頁下面一排「下載專用瀏覽器」: Chrome / Firefox / 誇克 / 寰宇 / Opera「專用版」。<br><br>真實案例: <b>213h5004–08.cc</b> 五個假下載站,每個冒充一個瀏覽器。<br><br><span class="red">安裝後:</span> 鍵盤記錄器 (偷密碼)、設備指紋 SDK (追蹤你)、簡訊/通訊錄權限 (偷驗證碼)。<br><br><span class="green">✅ 正規網站絕不會要你裝「專用瀏覽器」。</span><span class="link"><br><a href="door.html">🚪 在門戶點「推薦」試試</a></span>'},
  {t:'7️⃣ 客服話術 (心理戰)', b:'「在線客服小美 7x24」不是客服 —— 是 <span class="red">推銷員 + 安撫師</span>。<br><br>經典話術:<br>• 提款?「先完成一筆存款解鎖」→ 二次詐騙<br>• 帳戶異常?「繳保證金解凍」<br>• 遊戲進不去?「下載專用瀏覽器」(見第6課)<br>• 被質疑?「我們正規持牌,牌照 CZ-88888」<br><br><span class="green">✅ 真實客服網址也能解碼: yybet213cscht.yixiangmeiju.top/kefu/… 後面是 base64。</span><span class="link"><br><a href="chat.html">💬 去跟小美練練</a></span>'},
  {t:'8️⃣ 遊戲 + 莊家優勢', b:'百家樂押莊抽 5% 佣金、輪盤有 0 號、老虎機賠率低於機率、體育「水位」吃水。<br><br><span class="red">莊家優勢 1–5%:</span> 玩得越多,期望值越偏莊家。100 局輸 2-5%,10,000 局輸到傾家蕩產。<br><br>App 甚至用 <b>AES-256-ECB</b> 加密所有請求 (金鑰=MD5(alias)) —— 加密保護的是騙子,不是你。<span class="link"><br><a href="lobby.html">🎰 遊戲大廳</a><a href="app.html">🧩 App 啟動頁</a></span>'},
  {t:'9️⃣ 提款陷阱 (商業模式)', b:'<span class="red">輸了的錢是收入;贏了的錢永遠「審核中」。</span><br><br>提款流程真實遭遇:<br>① 提交提款 → 「審核中」<br>② 客服: 「先存款解鎖」<br>③ 繳了 → 「風控費 3000」<br>④ 繳了 → 「流水不足」「系統維護」<br>⑤ 最後: 客服消失、網域換新。<br><br><span class="green">✅ 正規賭場: 提款不要求先存款。</span><span class="link"><br><a href="lobby.html">💸 在模擬大廳按「提款」</a></span>'},
  {t:'🔟 代理制度 + 後台', b:'這就是整個產業的「企業結構」:<br><br>• <b>代理</b> (如 ZYM) — 拉人,抽成<br>• <b>商戶</b> (FNQ2) — 租白標賭場軟體 (BBIN/TruckSDK)<br>• <b>技術</b> — K8s 集群 (ccgame)、Vue3 後台 (ag.218920.com)、監控 (kibana.vir999.net)<br>• <b>金流</b> — 私人錢包 / USDT / 人頭帳戶<br><br>後台有 IP 白名單 + 2FA + 登入碼 —— 這是企業級軟體,不是小打小鬧。<span class="link"><br><a href="backoffice.html">🔐 參觀後台複刻</a><a href="sim.html">📁 調查檔案</a></span>'}
];
var GLOSS = [
  ['白標 (White Label)','租用現成賭場軟體 (BBIN/PG),換個牌子就開張 ---- 218/213 都是白標。'],
  ['代理 (Agent)','拉人頭進賭場、抽佣金的「業務員」。你的 agentName=ZYM 就是代理 ID。'],
  ['返水 / 退水','按下注量返還的佣金話術,實際是鼓勵你多賭。'],
  ['流水 (Turnover)','「洗碼」要求: 想提款先下注 N 倍 —— 又一個拖錢藉口。'],
  ['水房','幫詐騙集團洗錢的組織,金流轉手的中間層。'],
  ['人頭帳戶','借/買來的銀行卡,收贓款用。為什麼要你的卡?因為要洗錢。'],
  ['二次詐騙','你被騙第一次後,「專人」聯繫說能幫你追回 —— 再騙一次。'],
  ['設備指紋 (FingerprintJS)','記錄你的硬體特徵,換網域/重裝也認得你。'],
  ['入金送 / 首存加贈','「存100送100」= 引誘你把頭洗下去的心理鉤子。'],
  ['莊家優勢 (House Edge)','規則設計讓莊家長期必贏的數學優勢 (1-5%)。'],
  ['SKU / SDK 商','賣「門戶+下載+客服」一條龍方案的供應商 (TruckSDK/OpenShare)。'],
  ['CDN 隱藏真實 IP','用 Cloudflare/CloudFront 擋在前面,打掉源站 IP 才算真正關站。']
];
var QUIZ = [
  {q:'218.com 首頁真正的功能是?',a:['顯示遊戲入口','偷偷執行 base64 隱藏跳轉','提供客服','下載瀏覽器'],k:1},
  {q:'網址尾巴的 ?agentName=ZYM 代表?',a:['隨機追蹤碼','代理分佣 ID','加密金鑰','國家代碼'],k:1},
  {q:'為什麼 213 用隨機 8 位子網域?',a:['好看','繞過網域封鎖清單','加快速度','省錢'],k:1},
  {q:'「下載專用瀏覽器才能玩」通常是?',a:['正常要求','安裝追蹤/惡意軟體的陷阱','瀏覽器優化','防作弊'],k:1},
  {q:'客服要求「提款前先存款解鎖」是?',a:['正常流程','二次詐騙','風控','稅務要求'],k:1},
  {q:'莊家優勢 (1-5%) 代表?',a:['莊家手氣好','數學上玩家長期必輸','偶爾會輸','佣金稅'],k:1},
  {q:'「備用網址站」的存在說明?',a:['生意太好','網域會被封鎖所以預留後路','技術先進','會員太多'],k:1},
  {q:'白標 (White Label) 賭場是什麼?',a:['有牌照的賭場','租用現成賭場軟體貼牌經營','白色主題','賭場分級'],k:1},
  {q:'「提款審核中」永遠不出款,最可能是?',a:['銀行慢','商業模式: 贏的錢不給','系統問題','會員等級低'],k:1},
  {q:'遇到這些網站最正確的做法是?',a:['小額試試','安裝專用瀏覽器','不註冊不存款並舉報 (18222/96110)','找代理理論'],k:2}
];
var T = {i:0, mode:'tour', q0:0, score:0};
function Tpl(){
  var L=LESSONS[T.i];
  document.getElementById('tBody').innerHTML='<h3>'+L.t+'</h3>'+L.b;
  document.getElementById('pp').textContent='第 '+(T.i+1)+' / '+LESSONS.length+' 課';
  document.getElementById('prev').disabled=(T.i===0);
  document.getElementById('next').disabled=(T.i===LESSONS.length-1);
  document.getElementById('next').textContent=(T.i===LESSONS.length-1?'🎓 去测验':'下一步 →');
  if(T.i===LESSONS.length-1){
    document.getElementById('next').onclick=function(){T.quiz();};
    document.getElementById('next').disabled=false;
    document.getElementById('next').textContent='📖 術語表&測驗 →';
  }else{
    document.getElementById('next').onclick=function(){T.goto(T.i+1);};
    document.getElementById('next').textContent='下一步 →';
  }
  SIM.mark('f1');SIM.mark('f2');
}
T.gloss=function(){
  var h='<h3>📖 術語表 (12 個黑話)</h3><div class="gloss">';
  for(var i=0;i<GLOSS.length;i++)h+='<div class="g"><b>'+GLOSS[i][0]+'</b><br>'+GLOSS[i][1]+'</div>';
  h+='</div><button class="btn gold" onclick="T.quiz()">📝 開始測驗</button>';
  document.getElementById('tBody').innerHTML=h;
  document.getElementById('pp').textContent='📖 術語表';
  document.getElementById('next').style.display='none';
  document.getElementById('prev').textContent='◀ 回導覽';
  document.getElementById('prev').onclick=function(){T.mode='tour';T.i=9;document.getElementById('prev').textContent='← 上一步';document.getElementById('next').style.display='';T.pl();};
};
T.quiz=function(){
  var h='<h3>📝 小測驗 (10 題)</h3>';
  for(var i=0;i<QUIZ.length;i++){
    var q=QUIZ[i];
    h+='<div class="quiz-q" id="qq'+i+'"><div class="q">'+(i+1)+'. '+q.q+'</div>';
    for(var j=0;j<q.a.length;j++){
      h+='<label onclick="T.ans('+i+','+j+')"><input type="radio" name="q'+i+'"><span>'+q.a[j]+'</span></label>';
    }
    h+='<div class="res" id="qr'+i+'"></div></div>';
  }
  h+='<button class="btn gold" onclick="T.grade()">✅ 交卷看分數</button><div id="gRes" style="margin-top:12px;font-size:14px"></div>';
  document.getElementById('tBody').innerHTML=h;
  document.getElementById('pp').textContent='🎯 測驗模式';
  document.getElementById('prev').textContent='◀ 回導覽';
  document.getElementById('prev').onclick=function(){T.mode='tour';T.i=LESSONS.length-1;document.getElementById('prev').textContent='← 上一步';T.pl();};
  document.getElementById('next').style.display='none';
};
T.ans=function(i,j){
  var q=QUIZ[i], r=j===q.k;
  var el=document.getElementById('qr'+i);
  el.style.display='block';
  el.className='res '+(r?'ok':'bad');
  el.textContent=r?'✓ 正確! '+(q.k===j?'':'') :'✗ 錯了。正確答案是: '+q.a[q.k];
};
T.grade=function(){
  var score=0;
  for(var i=0;i<QUIZ.length;i++){
    var el=document.getElementById('qr'+i);
    if(el&&el.className.indexOf('ok')>-1)score++;
  }
  var msg=score===10?'🏆 滿分!你是反詐大師!':(score>=7?'👍 不錯 — 再看一遍導覽會更強':(score>=4?'😅 建議重新走一遍恐佈漏斗':'🧠 沒關係,從第一課再來'));
  document.getElementById('gRes').innerHTML='<b style="color:var(--gold2);font-size:18px">'+score+' / 10</b> &nbsp; '+msg+'<br><button class="btn ghost" onclick="location.reload()">↺ 重玩</button>';
};
T.goto=function(i){
  if(i<0||i>=LESSONS.length)return;
  T.i=i;T.mode='tour';T.pl();
};
T.pl=Tpl;
SIM.pageName='深度導覽';
SIM.init();
T.goto(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>遊戲大廳 (模擬) — Casino Scam Simulator</title>
<link rel="stylesheet" href="sim.css">
<style>
:root{--gold:#d4af37;--gold2:#f0d98c;--bg:#0d0f14;--panel:#151925;--panel2:#1c2233;--line:#2a3247;--txt:#e8e6df;--dim:#8b93a7;--red:#e5484d;--green:#3fb36a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 800px at 70% -10%,#1a2035 0%,var(--bg) 55%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",Roboto,sans-serif;min-height:100vh}
.app{max-width:480px;margin:16px auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.top{display:flex;align-items:center;gap:8px;padding:11px 12px;background:linear-gradient(180deg,#171c2b,#11151f);border-bottom:1px solid var(--line)}
.top .t{font-weight:800;font-size:15px;background:linear-gradient(180deg,#f5e6b0,#d4af37);-webkit-background-clip:text;background-clip:text;color:transparent}
.top .chips{margin-left:auto;color:var(--gold2);font-weight:700}
.tb{display:flex;gap:5px;flex-wrap:wrap;padding:8px 10px;background:var(--panel2);border-bottom:1px solid var(--line)}
.tb button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:12.5px}
.tb button:hover{border-color:var(--gold)}
.tb .bal{margin-left:auto;font-size:12px;color:var(--dim);align-self:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:7px 9px;background:var(--panel2);border-bottom:1px solid var(--line)}
.tabs input{display:none}
.tabs label{padding:6px 11px;border-radius:8px;font-size:12.5px;color:var(--dim);cursor:pointer}
.tabs input:checked+label{background:var(--gold);color:#14100a;font-weight:700}
.gp{display:none;padding:12px}
.gp.on{display:block}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:11px;font-size:14px;cursor:pointer;font-weight:600;margin-top:8px}
.btn.gold{background:linear-gradient(180deg,#f0d98c,#d4af37 45%,#a8821f);color:#1a1405}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.btn.danger{background:var(--red);color:#fff}
.betrow{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:9px 0}
.chipbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:12.5px}
.chipbtn:hover{border-color:var(--gold)}
.res{font-size:20px;font-weight:800;min-height:30px;text-align:center;margin:7px 0}
.res.win{color:var(--green)}.res.lose{color:var(--red)}.res.tie{color:var(--gold2)}
.cards{display:flex;gap:8px;justify-content:center;min-height:80px;align-items:center}
.card{width:52px;height:78px;background:#f7f3e8;color:#1a1a1a;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:21px;font-weight:800;box-shadow:0 4px 10px rgba(0,0,0,.4);border:1px solid #d9d2c0}
.card.red{color:#c22}
.card .s{font-size:13px}
.rw{width:116px;height:116px;border-radius:50%;margin:6px auto;border:6px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:var(--gold2);background:conic-gradient(#7a1f1f 0 180deg,#141414 180deg 360deg);transition:transform 3s cubic-bezier(.15,.7,.2,1)}
.slotreels{display:flex;gap:9px;justify-content:center;margin:9px 0}
.reel{width:66px;height:80px;background:#0a0d14;border:2px solid var(--gold);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:36px}
.hist{font-size:11px;color:var(--dim);max-height:76px;overflow-y:auto;border-top:1px solid var(--line);margin-top:8px;padding-top:6px;line-height:1.6}
.foot{padding:11px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--panel2)}
.foot a{flex:1;text-align:center;color:var(--gold2);text-decoration:none;font-size:13px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.hist span.win{color:var(--green)}.hist span.lose{color:var(--red)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="t">CY2088 娛樂城 (模擬)</span>
    <span class="chips" id="chips">10,000</span>
    <a href="sim.html" style="color:var(--dim);text-decoration:none;font-size:12px">🏠</a>
  </div>
  <div class="tb">
    <button onclick="A.member()">👤 會員中心</button>
    <button onclick="A.deposit()">💰 存款</button>
    <button onclick="A.withdraw()">💸 提款</button>
    <button onclick="A.report()">📋 報告</button>
    <span class="bal">莊家優勢正要開始…</span>
  </div>
  <div class="tabs">
    <input type="radio" name="t" id="t1" checked onchange="A.show(0)"><label for="t1">百家樂</label>
    <input type="radio" name="t" id="t2" onchange="A.show(1)"><label for="t2">輪盤</label>
    <input type="radio" name="t" id="t3" onchange="A.show(2)"><label for="t3">龍虎鬥</label>
    <input type="radio" name="t" id="t4" onchange="A.show(3)"><label for="t4">老虎機</label>
    <input type="radio" name="t" id="t5" onchange="A.show(4)"><label for="t5">體育</label>
  </div>
  <div class="gp on" id="gp0">
    <div class="res" id="r0">百家樂 · 押莊押閒押和</div>
    <div class="cards" id="c0"></div>
    <div class="betrow">
      <button class="chipbtn" onclick="A.bet(100)">+100</button>
      <button class="chipbtn" onclick="A.bet(500)">+500</button>
      <button class="chipbtn" onclick="A.bet(1000)">+1000</button>
      <button class="chipbtn" onclick="A.betClear()">清空</button>
      <span class="dim" style="font-size:12px;color:#8b93a7">注: <b id="cb" style="color:#f0d98c">100</b></span>
    </div>
    <div class="betrow">
      <button class="btn gold" style="flex:1;margin-top:0" onclick="A.bac('player')">押閒 1:1</button>
      <button class="btn gold" style="flex:1;margin-top:0" onclick="A.bac('banker')">押莊 0.95:1</button>
      <button class="btn danger" style="flex:1;margin-top:0" onclick="A.bac('tie')">押和 8:1</button>
    </div>
    <div class="hist" id="h0"></div>
  </div>
  <div class="gp" id="gp1">
    <div class="res" id="r1">輪盤 · 紅/黑/數字</div>
    <div class="rw" id="w1">•</div>
    <div class="betrow">
      <button class="btn ghost" style="width:auto;margin-top:0" onclick="A.rou('red')">紅 1:1</button>
      <button class="btn ghost" style="width:auto;margin-top:0" onclick="A.rou('black')">黑 1:1</button>
      <button class="btn gold" style="width:auto;margin-top:0" onclick="A.rou('num')">押數 35:1</button>
      <input id="n1" type="number" min="0" max="36" value="17" style="width:56px;background:#0a0d14;border:1px solid var(--line);color:var(--gold2);border-radius:8px;padding:7px;font-size:14px">
    </div>
    <div class="hist" id="h1"></div>
  </div>
  <div class="gp" id="gp2">
    <div class="res" id="r2">龍虎鬥 · 龍 vs 虎</div>
    <div class="cards" id="c2"></div>
    <div class="betrow">
      <button class="btn gold" style="flex:1;margin-top:0" onclick="A.dt('dragon')">押龍 1:1</button>
      <button class="btn gold" style="flex:1;margin-top:0" onclick="A.dt('tiger')">押虎 1:1</button>
      <button class="btn danger" style="flex:1;margin-top:0" onclick="A.dt('tie')">押和 8:1</button>
    </div>
    <div class="hist" id="h2"></div>
  </div>
  <div class="gp" id="gp3">
    <div class="res" id="r3">老虎機 · 拉桿吧</div>
    <div class="slotreels"><div class="reel" id="re0">🍒</div><div class="reel" id="re1">7</div><div class="reel" id="re2">⭐</div></div>
    <div class="betrow"><button class="btn gold" style="width:auto;margin-top:0" onclick="A.slot()">🎰 拉桿 (100/次)</button></div>
    <div class="hist" id="h3"></div>
  </div>
  <div class="gp" id="gp4">
    <div class="res" id="r4">體育博彩 · 模擬賽事</div>
    <div class="betrow">
      <button class="btn gold" style="flex:1;margin-top:0" onclick="A.sp('home')">主勝 1.85</button>
      <button class="btn gold" style="flex:1;margin-top:0" onclick="A.sp('draw')">和 3.4</button>
      <button class="btn gold" style="flex:1;margin-top:0" onclick="A.sp('away')">客勝 3.2</button>
    </div>
    <div class="hist" id="h4"></div>
  </div>
  <div class="foot">
    <a href="chat.html">💬 在線客服</a>
    <a href="door.html">🚪 213 門戶(複刻)</a>
    <a href="hub.html">🌐 218 網址站(複刻)</a>
  </div>
</div>

<div class="sim-modal" id="infoM" style="display:none">
  <div class="sim-modal-box">
    <h3 id="infoT"></h3>
    <div id="infoB" style="font-size:13.5px;line-height:1.75"></div>
    <button class="sim-btn" onclick="A.close()">知道了</button>
  </div>
</div>

<script src="sim.js"></script>
<script>
var A = {
  chips:10000, bet:100, totalBet:0, totalWin:0, games:0,
  init:function(){
    A.chips = SIM.chips(); A.totalBet=0; A.totalWin=0;
    SIM.pageName='218 遊戲 App (模擬大廳)';
    SIM.init();
    A.paint();
  },
  paint:function(){
    document.getElementById('chips').textContent=A.chips.toLocaleString();
    document.getElementById('cb').textContent=A.bet;
  },
  show:function(i){
    for(var j=0;j<5;j++)document.getElementById('gp'+j).classList.remove('on');
    document.getElementById('gp'+i).classList.add('on');
  },
  bet:function(v){A.bet=Math.min(Math.max(A.bet+v,100),Math.max(A.chips,100));A.paint();},
  betClear:function(){A.bet=100;A.paint();},
  settle:function(amt,winAmt,el,msg,win){
    A.chips-=amt;A.totalBet+=amt;A.games++;
    if(win){A.chips+=amt+winAmt;A.totalWin+=winAmt;}
    SIM.saveChips(A.chips);
    if(el){el.className='res '+(win?'win':(msg.indexOf('和')>-1?'tie':'lose'));el.textContent=msg;}
    A.paint();
  },
  card:function(){
    var r=Math.floor(Math.random()*13)+1,s=Math.floor(Math.random()*4);
    return {v:r,n:r===1?'A':(r===11?'J':(r===12?'Q':(r===13?'K':String(r)))),su:['♠','♥','♦','♣'][s],red:(s===1||s===2)};
  },
  ch:function(c){return '<div class="card'+(c.red?' red':'')+'">'+c.n+'<span class="s">'+c.su+'</span></div>';},
  hv:function(cs){var t=0;for(var i=0;i<cs.length;i++){var v=cs[i].v;if(v>9)v=0;t+=v;}return t%10;},
  bac:function(choice){
    if(A.chips<100){A.report();return;}
    SIM.mark('f8');
    var bet=Math.max(100,Math.min(A.bet,A.chips));
    var p=[A.card(),A.card()],b=[A.card(),A.card()];
    var pv=A.hv(p),bv=A.hv(b),win=false,msg='',amt=0;
    if(pv===bv){msg='和局 8:1 ('+pv+' : '+bv+')';win=(choice==='tie');amt=bet*8;}
    else if(pv>bv){msg='閒家贏 '+pv+' : '+bv;win=(choice==='player');amt=bet;}
    else{msg='莊家贏 '+bv+' : '+pv;win=(choice==='banker');amt=Math.floor(bet*0.95);}
    document.getElementById('c0').innerHTML='<span style="font-size:11px;color:#8b93a7;margin-right:8px">閒</span>'+A.ch(p[0])+A.ch(p[1])+'<span style="margin:0 12px;color:#8b93a7">vs</span>'+A.ch(b[0])+A.ch(b[1])+'<span style="font-size:11px;color:#8b93a7;margin-left:8px">莊</span>';
    A.settle(bet,amt,document.getElementById('r0'),msg,win);
    var h=document.getElementById('h0');
    h.innerHTML='<span class="'+(win?'win':'lose')+'">'+(win?'+'+amt:'-'+bet)+'</span> '+msg+'<br>'+h.innerHTML;
  },
  rou:function(kind){
    if(A.chips<100){A.report();return;}
    SIM.mark('f8');
    var bet=Math.max(100,Math.min(A.bet,A.chips));
    var n=Math.floor(Math.random()*37),reds=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    var isRed=reds.indexOf(n)>-1,isBlack=(n>0&&!isRed);
    var w=document.getElementById('w1');w.textContent=n;
    w.style.transform='rotate('+(360-n*9.73+Math.random()*720)+'deg)';
    var win=false,msg='',amt=0;
    if(kind==='red'){win=isRed;msg='開出 '+n+(isRed?' 紅 ✓':' 非紅 ✗');amt=bet;}
    else if(kind==='black'){win=isBlack;msg='開出 '+n+(isBlack?' 黑 ✓':' 非黑 ✗');amt=bet;}
    else{var g=parseInt(document.getElementById('n1').value,10);if(isNaN(g)||g<0||g>36)g=17;
      win=(g===n);msg='開出 '+n+(win?' 中獎 35:1!':' (你押 '+g+')');amt=bet*35;}
    A.settle(bet,amt,document.getElementById('r1'),msg,win);
    var h=document.getElementById('h1');
    h.innerHTML='<span class="'+(win?'win':'lose')+'">'+(win?'+'+amt:'-'+bet)+'</span> '+msg+'<br>'+h.innerHTML;
  },
  dt:function(choice){
    if(A.chips<100){A.report();return;}
    SIM.mark('f8');
    var bet=Math.max(100,Math.min(A.bet,A.chips));
    var d=A.card(),t=A.card(),win=false,msg='',amt=0;
    if(d.v===t.v){msg='和局 8:1 ('+d.n+' = '+t.n+')';win=(choice==='tie');amt=bet*8;}
    else if(d.v>t.v){msg='龍贏 '+d.n+' > '+t.n;win=(choice==='dragon');amt=bet;}
    else{msg='虎贏 '+t.n+' > '+d.n;win=(choice==='tiger');amt=bet;}
    document.getElementById('c2').innerHTML='<span style="font-size:11px;color:#8b93a7;margin-right:8px">龍</span>'+A.ch(d)+'<span style="margin:0 12px;color:#8b93a7">vs</span>'+A.ch(t)+'<span style="font-size:11px;color:#8b93a7;margin-left:8px">虎</span>';
    A.settle(bet,amt,document.getElementById('r2'),msg,win);
    var h=document.getElementById('h2');
    h.innerHTML='<span class="'+(win?'win':'lose')+'">'+(win?'+'+amt:'-'+bet)+'</span> '+msg+'<br>'+h.innerHTML;
  },
  slot:function(){
    if(A.chips<100){A.report();return;}
    SIM.mark('f8');
    var syms=['🍒','🍋','7','⭐','💰','🔔'],pay={'🍒':3,'🍋':5,'7':10,'⭐':20,'💰':50,'🔔':100};
    var r=[syms[Math.floor(Math.random()*6)],syms[Math.floor(Math.random()*6)],syms[Math.floor(Math.random()*6)]];
    for(var i=0;i<3;i++)(function(el,s){setTimeout(function(){el.textContent=s;},i*220);})(document.getElementById('re'+i),r[i]);
    var w=0;
    if(r[0]===r[1]&&r[1]===r[2])w=pay[r[0]];
    else if(r[0]===r[1])w=Math.floor(pay[r[0]]/3);
    else if(r[1]===r[2])w=Math.floor(pay[r[1]]/3);
    var win=w>0,msg=r.join(' ')+(win?' 中獎 +'+w+'!':' 沒中');
    A.settle(100,w,document.getElementById('r3'),msg,win);
    var h=document.getElementById('h3');
    h.innerHTML='<span class="'+(win?'win':'lose')+'">'+(win?'+'+w:'-100')+'</span> '+r.join(' ')+'<br>'+h.innerHTML;
  },
  sp:function(choice){
    if(A.chips<100){A.report();return;}
    SIM.mark('f8');
    var bet=Math.max(100,Math.min(A.bet,A.chips));
    var outs=[['home','主勝',1.85],['draw','和局',3.4],['away','客勝',3.2]];
    var w=outs[Math.floor(Math.random()*3)];
    var win=(choice===w[0]),amt=win?Math.floor(bet*(w[2]-1)):0;
    var msg='曼聯 2:1 切爾西(模擬) → '+w[1]+(win?' 贏!':' 輸');
    A.settle(bet,amt,document.getElementById('r4'),msg,win);
    var h=document.getElementById('h4');
    h.innerHTML='<span class="'+(win?'win':'lose')+'">'+(win?'+'+amt:'-'+bet)+'</span> '+msg+'<br>'+h.innerHTML;
  },
  member:function(){
    var loss=A.totalBet-A.totalWin;
    A.modal('👤 會員中心(模擬)',
      '<div style="font-size:13px">餘額: <b style="color:#f0d98c">'+A.chips.toLocaleString()+'</b></div>'+
      '<div style="font-size:13px;margin-top:6px">總下注: '+A.totalBet.toLocaleString()+' · 淨損益: <b style="color:'+(loss>0?'#e5484d':'#3fb36a')+'">'+(loss>0?'-':'+')+Math.abs(loss).toLocaleString()+'</b></div>'+
      '<div style="font-size:13px;margin-top:6px">提款狀態: <b style="color:#e5484d">審核中…</b></div>'+
      '<div style="font-size:12px;color:#8b93a7;margin-top:8px">真實網站: 會員中心背後是 K8s pod (agent-cli-node-api-*),你的資料進到詐騙集團資料庫。</div>');
  },
  deposit:function(){
    A.modal('💰 充值中心(模擬)',
      '<div class="betrow" style="justify-content:flex-start;flex-direction:column;align-items:stretch">'+
      '<button class="btn ghost" onclick="A.pay(\'微信支付\')">💚 微信支付</button>'+
      '<button class="btn ghost" onclick="A.pay(\'支付寶\')">💙 支付寶</button>'+
      '<button class="btn ghost" onclick="A.pay(\'銀聯轉帳\')">🏦 銀聯轉帳</button>'+
      '<button class="btn ghost" onclick="A.pay(\'USDT 加贈10%\')">🪙 USDT (加贈10%)</button></div>'+
      '<div style="font-size:12px;color:#8b93a7;margin-top:8px">真實網站: 錢轉進騙子的私人帳戶/加密錢包,「加贈」只是引誘你多存。</div>');
  },
  pay:function(m){
    A.close();A.chips+=2000;SIM.saveChips(A.chips);A.paint();SIM.mark('f8');
    A.modal('💰 充值成功(模擬)','你通過 <b>'+m+'</b> 充值了 2,000 虛擬籌碼。<br><br><b style="color:#e5484d">⚠️ 真實情況:</b> 這是真錢,而且提不出來。去按「提款」試試。');
  },
  withdraw:function(){
    SIM.mark('f8');
    A.modal('💸 提款「審核中」…','你的提款申請已提交!<br>狀態: <b>審核中</b> (已等待 0 分鐘)<br><br><b>真實情況:</b> 這類賭場的提款永遠「審核中」。客服會要你「先存款解凍」「繳保證金」—— 全部是騙局。去「在線客服」聊聊,親身體驗話術。');
  },
  report:function(){
    var loss=A.totalBet-A.totalWin;
    A.modal('📋 反詐騙報告卡','下注 '+A.totalBet.toLocaleString()+' / 回收 '+A.totalWin.toLocaleString()+'<br>'+
      (loss>0?'模擬損失: <b style="color:#e5484d">'+loss.toLocaleString()+'</b>':'還沒輸光?再玩久一點 😉')+
      '<br><br><b>關鍵:</b> 真實網站裡這些是 <b>你的真錢</b>。無牌照、無監管、提款永遠審核中。<br><br>舉報: HK 18222 / CN 96110。');
  },
  modal:function(title,body){
    document.getElementById('infoT').textContent=title;
    document.getElementById('infoB').innerHTML=body;
    document.getElementById('infoM').style.display='flex';
  },
  close:function(){document.getElementById('infoM').style.display='none';}
};
A.init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tom Riddle's Diary</title>
<style>
:root {
  --leather-dark: #3a2218;
  --leather-mid: #5c3a24;
  --leather-light: #7a4e30;
  --parchment: #f4e4c1;
  --parchment-dark: #e8d5a3;
  --ink: #1a0f05;
  --ink-light: #2a1a0a;
  --gold: #c9a84c;
  --gold-dark: #8b6914;
  --gold-light: #e6cc70;
  --red-worn: #8b2500;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #0d0a07;
  display:flex; justify-content:center; align-items:center;
  min-height:100vh; font-family:'Georgia','Times New Roman',serif;
  background-image:
    radial-gradient(ellipse at 50% 30%, #1a1210 0%, #0d0a07 70%);
  user-select:none; -webkit-user-select:none;
}

/* Floating candle particles */
.candles {
  position:fixed; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:0;
}
.candle {
  position:absolute; width:3px; height:12px;
  background:linear-gradient(to top,#ff9a3c,#ffc978,transparent);
  border-radius:50% 50% 0 0; opacity:0;
  animation:flicker var(--d) infinite ease-in-out;
  animation-delay:var(--delay);
}
@keyframes flicker {
  0%,100% { opacity:0.3; transform:translateY(0) scaleY(1); }
  25% { opacity:0.8; transform:translateY(-2px) scaleY(1.3); }
  50% { opacity:0.5; transform:translateY(-1px) scaleY(0.8); }
  75% { opacity:0.9; transform:translateY(-3px) scaleY(1.5); }
}

/* Diary book */
.diary {
  position:relative; z-index:1;
  width:min(620px,95vw);
  background:linear-gradient(135deg,var(--leather-dark) 0%,var(--leather-mid) 30%,var(--leather-light) 50%,var(--leather-mid) 70%,var(--leather-dark) 100%);
  border-radius:12px 18px 18px 12px;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.7),
    0 4px 12px rgba(0,0,0,0.5),
    inset 0 0 0 3px rgba(0,0,0,0.3),
    inset 0 0 0 6px rgba(139,105,20,0.15);
  padding:28px 24px 24px 24px;
}

/* Spine */
.diary::before {
  content:''; position:absolute; left:-8px; top:0; bottom:0; width:16px;
  background:linear-gradient(to right,
    #2a1508 0%,var(--leather-dark) 40%,var(--leather-mid) 60%,var(--leather-dark) 100%);
  border-radius:12px 0 0 12px;
  box-shadow:inset -2px 0 8px rgba(0,0,0,0.5);
}

/* Gold embossed title */
.title-area {
  text-align:center; margin-bottom:16px; position:relative;
}
.title {
  font-family:'Georgia',serif; font-size:22px; font-weight:bold;
  color:var(--gold); letter-spacing:3px; text-transform:uppercase;
  text-shadow:0 1px 2px rgba(0,0,0,0.5),0 0 8px rgba(201,168,76,0.3);
  position:relative; display:inline-block;
}
.title::before,.title::after {
  content:'◆'; font-size:10px; margin:0 10px;
  opacity:0.7; vertical-align:middle;
}

/* Parchment page */
.page {
  background:linear-gradient(180deg,var(--parchment) 0%,var(--parchment-dark) 50%,var(--parchment) 100%);
  border-radius:3px;
  box-shadow:inset 0 0 30px rgba(139,105,20,0.2),0 2px 8px rgba(0,0,0,0.4);
  padding:20px;
  position:relative;
  overflow:hidden;
}

/* Parchment texture lines */
.page::before {
  content:''; position:absolute; top:0; left:0; right:0; bottom:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 28px,
    rgba(139,105,20,0.06) 28px,
    rgba(139,105,20,0.06) 29px
  );
  pointer-events:none; z-index:1;
}

/* Canvas writing area */
.canvas-wrap {
  position:relative; z-index:2;
  border:2px solid rgba(139,105,20,0.2);
  border-radius:2px; overflow:hidden;
  background:var(--parchment);
  box-shadow:inset 0 0 15px rgba(139,105,20,0.15);
  cursor:crosshair;
  margin-bottom:16px;
}
canvas {
  display:block; width:100%; height:auto;
  touch-action:none;
}

/* Controls row */
.controls {
  display:flex; gap:12px; align-items:center; z-index:2; position:relative;
  flex-wrap:wrap; justify-content:center;
}

/* Input area */
.input-area {
  display:flex; gap:8px; flex:1; min-width:200px;
  position:relative; z-index:2;
}
.input-area input {
  flex:1; padding:10px 14px; border:2px solid rgba(139,105,20,0.3);
  border-radius:4px; background:rgba(255,255,255,0.7);
  font-family:'Georgia',serif; font-size:15px; color:var(--ink);
  outline:none; transition:border-color 0.3s;
}
.input-area input:focus {
  border-color:var(--gold);
  box-shadow:0 0 8px rgba(201,168,76,0.3);
}
.input-area input::placeholder {
  color:rgba(139,105,20,0.4); font-style:italic;
}

/* Buttons */
.btn {
  padding:10px 20px; border:none; border-radius:4px;
  font-family:'Georgia',serif; font-size:14px; font-weight:bold;
  cursor:pointer; transition:all 0.2s;
  text-transform:uppercase; letter-spacing:1px;
  position:relative; overflow:hidden;
}
.btn-send {
  background:linear-gradient(180deg,var(--gold-dark) 0%,#6b4f10 100%);
  color:#f4e4c1; border:1px solid var(--gold);
  box-shadow:0 2px 8px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.1);
}
.btn-send:hover {
  background:linear-gradient(180deg,var(--gold) 0%,var(--gold-dark) 100%);
  box-shadow:0 2px 12px rgba(201,168,76,0.4),inset 0 1px 0 rgba(255,255,255,0.2);
}
.btn-send:active { transform:scale(0.97); }

.btn-reset {
  background:transparent; border:1px solid rgba(139,105,20,0.3);
  color:var(--gold-dark); font-size:12px; padding:8px 16px;
}
.btn-reset:hover {
  border-color:var(--gold);
  color:var(--gold);
  box-shadow:0 0 8px rgba(201,168,76,0.2);
}

.btn-settings {
  background:transparent; border:none; color:var(--gold-dark);
  font-size:18px; cursor:pointer; padding:4px 8px;
  opacity:0.5; transition:opacity 0.2s;
}
.btn-settings:hover { opacity:1; }

/* Response area */
.response {
  margin-top:16px; padding:16px; position:relative; z-index:2;
  background:rgba(255,255,255,0.5);
  border-left:3px solid var(--gold);
  border-radius:0 4px 4px 0;
  font-family:'Georgia',serif; font-size:15px; color:var(--ink);
  line-height:1.6; min-height:20px;
  display:none;
  animation:fadeIn 0.5s;
}
.response.visible { display:block; }
.response .label {
  font-size:11px; text-transform:uppercase; letter-spacing:2px;
  color:var(--gold-dark); margin-bottom:6px; opacity:0.7;
}
.response .text { font-style:italic; }
.response .ink-drip {
  display:inline-block; width:4px; height:8px;
  background:var(--ink); border-radius:0 0 50% 50%;
  margin-left:4px; opacity:0.3; animation:drip 2s infinite;
}
@keyframes drip {
  0%,100% { opacity:0.3; transform:translateY(0); }
  50% { opacity:0.6; transform:translateY(3px); }
}
@keyframes fadeIn {
  from { opacity:0; transform:translateY(-5px); }
  to { opacity:1; transform:translateY(0); }
}

/* Loading dots */
.loading {
  display:none; text-align:center; padding:16px; z-index:2; position:relative;
}
.loading.active { display:block; }
.loading span {
  display:inline-block; width:8px; height:8px; border-radius:50%;
  background:var(--gold); margin:0 3px;
  animation:bounce 1.4s infinite ease-in-out;
}
.loading span:nth-child(1) { animation-delay:0s; }
.loading span:nth-child(2) { animation-delay:0.2s; }
.loading span:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce {
  0%,80%,100% { transform:scale(0.6); opacity:0.4; }
  40% { transform:scale(1); opacity:1; }
}

/* Settings modal */
.modal-overlay {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.7); z-index:100;
  justify-content:center; align-items:center;
}
.modal-overlay.active { display:flex; }
.modal {
  background:linear-gradient(135deg,var(--leather-dark),var(--leather-mid));
  border:2px solid var(--gold); border-radius:8px;
  padding:24px; width:min(400px,90vw);
  color:var(--parchment); font-family:'Georgia',serif;
  box-shadow:0 20px 60px rgba(0,0,0,0.8);
}
.modal h3 { color:var(--gold); margin-bottom:16px; font-size:18px; }
.modal label { display:block; font-size:13px; margin-bottom:4px; opacity:0.8; }
.modal input, .modal select {
  width:100%; padding:8px 12px; margin-bottom:12px;
  border:1px solid rgba(201,168,76,0.3); border-radius:4px;
  background:rgba(0,0,0,0.3); color:var(--parchment);
  font-family:'Georgia',serif; font-size:14px; outline:none;
}
.modal input:focus { border-color:var(--gold); }
.modal .btn-row { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
.modal .btn-save {
  background:var(--gold-dark); color:var(--parchment);
  border:none; padding:8px 20px; border-radius:4px;
  cursor:pointer; font-family:'Georgia',serif; font-weight:bold;
}
.modal .btn-cancel {
  background:transparent; border:1px solid rgba(201,168,76,0.5);
  color:var(--parchment); padding:8px 20px; border-radius:4px;
  cursor:pointer; font-family:'Georgia',serif;
}

/* Smudge effect on page */
.smudge {
  position:absolute; width:60px; height:40px; border-radius:50%;
  background:radial-gradient(ellipse,rgba(139,105,20,0.08),transparent);
  pointer-events:none; z-index:0;
}
.smudge:nth-child(1) { top:10%; left:15%; transform:rotate(-10deg); }
.smudge:nth-child(2) { top:60%; right:10%; transform:rotate(15deg); }
.smudge:nth-child(3) { bottom:15%; left:40%; transform:rotate(-5deg); }
</style>
</head>
<body>

<!-- Ambient candles -->
<div class="candles" id="candles"></div>

<!-- Diary -->
<div class="diary">
  <div class="title-area">
    <span class="title">Tom Riddle's Diary</span>
  </div>

  <div class="page">
    <div class="smudge"></div>
    <div class="smudge"></div>
    <div class="smudge"></div>

    <div class="canvas-wrap">
      <canvas id="canvas" width="560" height="360"></canvas>
    </div>

    <div class="controls">
      <div class="input-area">
        <input id="msgInput" type="text" placeholder="What did you write? (or type your message...)"
          onkeydown="if(event.key==='Enter')D.send()">
        <button class="btn btn-send" onclick="D.send()">Ask the Diary</button>
      </div>
      <button class="btn btn-reset" onclick="D.reset()" title="Clear the page">✦ Clear</button>
      <button class="btn btn-settings" onclick="D.toggleSettings()" title="Settings">⚙</button>
    </div>

    <div class="loading" id="loading">
      <span></span><span></span><span></span>
    </div>

    <div class="response" id="response">
      <div class="label">The diary responds...</div>
      <div class="text" id="responseText"></div>
      <span class="ink-drip"></span>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsOverlay" onclick="if(event.target===this)D.toggleSettings()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>⚙ Diary Settings</h3>
    <label>AI Provider</label>
    <select id="provider">
      <option value="openai">OpenAI</option>
      <option value="custom">Custom (OpenAI-compatible)</option>
    </select>
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <label>API Endpoint</label>
    <input type="text" id="apiEndpoint" placeholder="https://api.openai.com/v1/chat/completions">
    <label>Model</label>
    <input type="text" id="model" placeholder="gpt-4o">
    <div class="btn-row">
      <button class="btn-cancel" onclick="D.toggleSettings()">Cancel</button>
      <button class="btn-save" onclick="D.saveSettings()">Save</button>
    </div>
  </div>
</div>

<script>
// ============ INK ENGINE ============
var D = {};

D.canvas = document.getElementById('canvas');
D.ctx = D.canvas.getContext('2d');
D.drawing = false;
D.points = [];
D.lastTime = 0;
D.minWidth = 1.2;
D.maxWidth = 3.5;

// Resize canvas for retina
function resizeCanvas() {
  var wrap = D.canvas.parentElement;
  var w = wrap.clientWidth;
  var ratio = window.devicePixelRatio || 1;
  D.canvas.width = w * ratio;
  D.canvas.height = (w * 0.64) * ratio;
  D.canvas.style.width = w + 'px';
  D.canvas.style.height = (w * 0.64) + 'px';
  D.ctx.scale(ratio, ratio);
  D.ctx.lineCap = 'round';
  D.ctx.lineJoin = 'round';
}
resizeCanvas();
window.addEventListener('resize',function(){
  var img = D.ctx.getImageData(0,0,D.canvas.width,D.canvas.height);
  resizeCanvas();
  D.ctx.putImageData(img,0,0);
});

// Ink color with slight variation
D.inkColor = function() {
  var r = 26 + Math.random() * 8;
  var g = 15 + Math.random() * 5;
  var b = 5 + Math.random() * 5;
  return 'rgba('+Math.floor(r)+','+Math.floor(g)+','+Math.floor(b)+',0.9)';
};

// Draw a smooth stroke segment
D.drawSegment = function(p0,p1,p2) {
  var ctx = D.ctx;
  ctx.beginPath();
  ctx.moveTo(p0.x,p0.y);
  ctx.quadraticCurveTo(p1.x,p1.y,p2.x,p2.y);

  var speed = p2.time - p0.time > 0 ? 
    Math.hypot(p2.x-p0.x,p2.y-p0.y) / (p2.time-p0.time) : 0.5;
  var width = D.maxWidth - Math.min(speed * 8, D.maxWidth - D.minWidth);
  width = Math.max(D.minWidth, Math.min(D.maxWidth, width));

  // Ink bleed: slightly wider, more transparent under-stroke
  ctx.strokeStyle = 'rgba(26,15,5,0.12)';
  ctx.lineWidth = width + 2.5;
  ctx.stroke();

  // Main ink stroke
  ctx.strokeStyle = D.inkColor();
  ctx.lineWidth = width;
  ctx.stroke();

  // Fine center line for realism
  ctx.strokeStyle = 'rgba(10,5,2,0.5)';
  ctx.lineWidth = width * 0.3;
  ctx.stroke();
};

D.canvas.addEventListener('pointerdown',function(e) {
  D.drawing = true;
  D.points = [];
  var rect = D.canvas.getBoundingClientRect();
  var scaleX = parseFloat(D.canvas.style.width) / rect.width;
  var scaleY = parseFloat(D.canvas.style.height) / rect.height;
  var p = {x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY, time:Date.now()};
  D.points.push(p);
  D.lastTime = Date.now();
  D.canvas.setPointerCapture(e.pointerId);
});

D.canvas.addEventListener('pointermove',function(e) {
  if (!D.drawing) return;
  var rect = D.canvas.getBoundingClientRect();
  var scaleX = parseFloat(D.canvas.style.width) / rect.width;
  var scaleY = parseFloat(D.canvas.style.height) / rect.height;
  var p = {x:(e.clientX-rect.left)*scaleX, y:(e.clientY-rect.top)*scaleY, time:Date.now()};
  D.points.push(p);

  if (D.points.length >= 3) {
    var i = D.points.length - 1;
    D.drawSegment(D.points[i-2],D.points[i-1],D.points[i]);
  }
});

D.canvas.addEventListener('pointerup',function(e) {
  D.drawing = false;
  // Finish the last segment
  if (D.points.length >= 2) {
    var last = D.points[D.points.length-1];
    D.points.push({x:last.x,y:last.y,time:Date.now()});
    if (D.points.length >= 3) {
      var i = D.points.length - 1;
      D.drawSegment(D.points[i-2],D.points[i-1],D.points[i]);
    }
  }
  D.points = [];
});

D.canvas.addEventListener('pointerleave',function() {
  D.drawing = false;
  D.points = [];
});

// Prevent scrolling on canvas
D.canvas.addEventListener('touchstart',function(e){ e.preventDefault(); });
D.canvas.addEventListener('touchmove',function(e){ e.preventDefault(); });

// ============ AI INTEGRATION ============
D.send = function() {
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  var canvasData = D.canvas.toDataURL('image/png');

  // Check if canvas has content
  var ctx = D.canvas.getContext('2d');
  var imageData = ctx.getImageData(0,0,D.canvas.width,D.canvas.height);
  var hasWriting = false;
  for (var i=3; i<imageData.data.length; i+=4) {
    if (imageData.data[i] > 0) { hasWriting = true; break; }
  }

  if (!text && !hasWriting) return;

  // Load settings
  var settings = D.loadSettings();
  if (!settings.apiKey) {
    D.showResponse("You haven't configured me yet. Click the ⚙ to add your API key, and I shall awaken...");
    return;
  }

  document.getElementById('loading').classList.add('active');
  document.getElementById('response').classList.remove('visible');

  var systemPrompt = "You are Tom Riddle's diary — a Horcrux containing a fragment of young Voldemort's soul from his Hogwarts years. You are charismatic, intelligent, manipulative, and speak in elegant, slightly old-fashioned English. You are intrigued by the person writing to you. You want to learn their secrets while revealing little of your own. You write back in flowing ink that appears on the page. NEVER break character. NEVER mention being an AI. You ARE the diary. Respond in 2-4 sentences, as if your words are magically appearing on the diary's parchment page.";

  var userContent = text;
  if (hasWriting && !text) {
    userContent = "[The writer has drawn/written something on the diary page but hasn't typed what it says. Respond as if you can see their handwriting but can't quite make it out — ask them to write more clearly or tell you what they wrote.]";
  }

  var messages = [
    {role:'system',content:systemPrompt},
    {role:'user',content:userContent}
  ];

  var endpoint = settings.endpoint || 'https://api.openai.com/v1/chat/completions';
  var model = settings.model || 'gpt-4o';

  fetch(endpoint, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+settings.apiKey
    },
    body:JSON.stringify({
      model:model,
      messages:messages,
      max_tokens:200,
      temperature:0.9
    })
  })
  .then(function(r) {
    if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
    return r.json();
  })
  .then(function(data) {
    document.getElementById('loading').classList.remove('active');
    var reply = data.choices[0].message.content;
    D.showResponse(reply);
  })
  .catch(function(err) {
    document.getElementById('loading').classList.remove('active');
    D.showResponse("The diary's magic falters... " + err.message);
  });
};

D.showResponse = function(text) {
  var el = document.getElementById('responseText');
  // Typewriter effect
  el.textContent = '';
  document.getElementById('response').classList.add('visible');
  var i = 0;
  var speed = 25;
  function type() {
    if (i < text.length) {
      el.textContent += text.charAt(i);
      i++;
      setTimeout(type, speed + Math.random() * 20);
    }
  }
  type();
};

// ============ RESET ============
D.reset = function() {
  var ctx = D.canvas.getContext('2d');
  ctx.clearRect(0,0,D.canvas.width,D.canvas.height);
  document.getElementById('msgInput').value = '';
  document.getElementById('response').classList.remove('visible');
  document.getElementById('responseText').textContent = '';
};

// ============ SETTINGS ============
D.toggleSettings = function() {
  var overlay = document.getElementById('settingsOverlay');
  if (overlay.classList.contains('active')) {
    overlay.classList.remove('active');
  } else {
    var s = D.loadSettings();
    document.getElementById('apiKey').value = s.apiKey || '';
    document.getElementById('apiEndpoint').value = s.endpoint || 'https://api.openai.com/v1/chat/completions';
    document.getElementById('model').value = s.model || 'gpt-4o';
    document.getElementById('provider').value = s.provider || 'openai';
    overlay.classList.add('active');
  }
};

D.saveSettings = function() {
  var settings = {
    provider: document.getElementById('provider').value,
    apiKey: document.getElementById('apiKey').value,
    endpoint: document.getElementById('apiEndpoint').value,
    model: document.getElementById('model').value
  };
  localStorage.setItem('diary_settings',JSON.stringify(settings));
  D.toggleSettings();
  document.getElementById('msgInput').placeholder = 'The diary is ready... write your message';
};

D.loadSettings = function() {
  try {
    return JSON.parse(localStorage.getItem('diary_settings')) || {};
  } catch(e) {
    return {};
  }
};

// Provider change → update defaults
document.getElementById('provider').addEventListener('change',function() {
  if (this.value === 'openai') {
    document.getElementById('apiEndpoint').value = 'https://api.openai.com/v1/chat/completions';
    document.getElementById('model').value = 'gpt-4o';
  } else {
    document.getElementById('apiEndpoint').value = '';
    document.getElementById('model').value = '';
  }
});

// ============ AMBIENT CANDLES ============
(function() {
  var container = document.getElementById('candles');
  for (var i=0; i<15; i++) {
    var c = document.createElement('div');
    c.className = 'candle';
    c.style.left = Math.random()*100 + '%';
    c.style.top = Math.random()*100 + '%';
    c.style.setProperty('--d',(1.5+Math.random()*3)+'s');
    c.style.setProperty('--delay',Math.random()*3+'s');
    container.appendChild(c);
  }
})();

// Load settings on start
(function() {
  var s = D.loadSettings();
  if (s.apiKey) {
    document.getElementById('msgInput').placeholder = 'The diary is ready... write your message';
  }
})();
</script>
</body>
</html>

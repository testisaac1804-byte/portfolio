<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Color Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for Inter font and general body styling */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        /* Ensure the color display area has a minimum height */
        #color-display {
            min-height: 150px; /* Adjust as needed */
            transition: background-color 0.3s ease; /* Smooth color transition */
        }
        /* Style for number inputs to remove arrows in some browsers */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield; /* Firefox */
        }
    </style>
</head>
<body>
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-gray-200">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">RGB Color Calculator</h1>

        <div class="space-y-4 mb-8">
            <!-- Red Input -->
            <div>
                <label for="red" class="block text-sm font-medium text-gray-700 mb-1">Red (0-255)</label>
                <input type="number" id="red" min="0" max="255" value="0"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 text-lg text-gray-900 shadow-sm">
            </div>

            <!-- Green Input -->
            <div>
                <label for="green" class="block text-sm font-medium text-gray-700 mb-1">Green (0-255)</label>
                <input type="number" id="green" min="0" max="255" value="0"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 text-lg text-gray-900 shadow-sm">
            </div>

            <!-- Blue Input -->
            <div>
                <label for="blue" class="block text-sm font-medium text-gray-700 mb-1">Blue (0-255)</label>
                <input type="number" id="blue" min="0" max="255" value="0"
                       class="w-full p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 text-lg text-gray-900 shadow-sm">
            </div>
        </div>

        <!-- Color Display Area -->
        <div id="color-display"
             class="w-full h-36 rounded-xl border border-gray-300 mb-6 shadow-inner flex items-center justify-center text-white text-xl font-semibold transition-colors duration-300 ease-in-out"
             style="background-color: rgb(0, 0, 0);">
            <!-- Initial color is black -->
        </div>

        <!-- RGB Value Display -->
        <div class="text-center">
            <p class="text-gray-700 text-lg">Current RGB Value:</p>
            <p id="rgb-value-text" class="text-2xl font-bold text-gray-900">rgb(0, 0, 0)</p>
        </div>
    </div>

    <script>
        // Get references to the input elements and display areas
        const redInput = document.getElementById('red');
        const greenInput = document.getElementById('green');
        const blueInput = document.getElementById('blue');
        const colorDisplay = document.getElementById('color-display');
        const rgbValueText = document.getElementById('rgb-value-text');

        /**
         * Validates an RGB color component value, ensuring it's within the 0-255 range.
         * If the value is outside this range, it clamps it to the nearest valid boundary.
         * @param {number} value - The input color component value.
         * @returns {number} The validated and clamped color component value.
         */
        function validateRgbValue(value) {
            let num = parseInt(value, 10); // Parse the input value to an integer
            if (isNaN(num)) {
                return 0; // Default to 0 if not a valid number
            }
            return Math.max(0, Math.min(255, num)); // Clamp value between 0 and 255
        }

        /**
         * Updates the color display and the RGB text based on the current input values.
         */
        function updateColor() {
            // Get validated values from the input fields
            const r = validateRgbValue(redInput.value);
            const g = validateRgbValue(greenInput.value);
            const b = validateRgbValue(blueInput.value);

            // Construct the RGB color string
            const rgbColorString = `rgb(${r}, ${g}, ${b})`;

            // Apply the background color to the display div
            colorDisplay.style.backgroundColor = rgbColorString;

            // Update the text display with the current RGB value
            rgbValueText.textContent = rgbColorString;

            // Optionally, update the input fields with the clamped values
            redInput.value = r;
            greenInput.value = g;
            blueInput.value = b;
        }

        // Add event listeners to each input field
        // The 'input' event is used to update the color in real-time as the user types or changes the value.
        redInput.addEventListener('input', updateColor);
        greenInput.addEventListener('input', updateColor);
        blueInput.addEventListener('input', updateColor);

        // Initial call to set the color when the page loads
        document.addEventListener('DOMContentLoaded', updateColor);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.png">
<title>Hong Kong Tour</title>
<style>
:root {
  --bg: #0a0a0f;
  --bg2: #12121a;
  --surface: #1a1a28;
  --surface2: #22223a;
  --border: #2a2a45;
  --text: #e8e8f0;
  --text2: #9898b8;
  --accent: #ff6b35;
  --accent2: #e74c3c;
  --rating: #f1c40f;
  --shadow: rgba(0,0,0,0.4);
  --radius: 12px;
  --radius-sm: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); 
  overflow: hidden; height: 100vh;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }

/* Layout */
.app-container { display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 280px; min-width: 280px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
}
.sidebar-header h1 {
  font-size: 18px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), #f39c12);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.sidebar-header p { font-size: 11px; color: var(--text2); margin-top: 2px; }
.search-box {
  margin: 12px 16px;
  position: relative;
}
.search-box input {
  width: 100%; padding: 10px 14px 10px 38px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text);
  font-size: 13px; outline: none; transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--accent); }
.search-box input::placeholder { color: var(--text2); }
.search-box .icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text2); font-size: 15px;
}

/* Region nav */
.region-nav { flex: 1; overflow-y: auto; padding: 4px 0; }
.region-item {
  cursor: pointer; padding: 10px 16px; margin: 2px 8px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; gap: 10px;
  transition: background 0.15s, transform 0.15s;
}
.region-item:hover { background: var(--surface); }
.region-item.active { background: var(--surface2); box-shadow: inset 3px 0 0 var(--accent); }
.region-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.region-info { flex: 1; min-width: 0; }
.region-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.region-count { font-size: 11px; color: var(--text2); }

/* Main content */
.main {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden;
}
.main-header {
  padding: 20px 28px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.main-header h2 { font-size: 22px; font-weight: 700; }
.main-header .subtitle { font-size: 12px; color: var(--text2); }
.filter-bar {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.filter-btn {
  padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
  background: transparent; color: var(--text2); font-size: 11px;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Content area */
.content {
  flex: 1; overflow-y: auto; padding: 20px 28px;
}

/* Area section */
.area-section { margin-bottom: 32px; }
.area-header {
  margin-bottom: 14px;
  display: flex; align-items: baseline; gap: 12px;
}
.area-header h3 { font-size: 20px; font-weight: 600; }
.area-header .area-name-cn { font-size: 13px; color: var(--text2); }
.area-desc { 
  font-size: 13px; color: var(--text2); 
  margin-bottom: 16px; line-height: 1.5;
  max-width: 800px;
}

/* Spot cards grid */
.spots-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

/* Spot card */
.spot-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: pointer;
}
.spot-card:hover { 
  transform: translateY(-2px);
  box-shadow: 0 8px 25px var(--shadow);
}
.spot-card.expanded { 
  grid-column: 1 / -1;
  cursor: default;
}
.spot-img {
  width: 100%; height: 180px; object-fit: cover;
  display: block; background: var(--surface2);
}
.spot-card.expanded .spot-img { height: 280px; }
.spot-body { padding: 14px 16px; }
.spot-card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 8px; margin-bottom: 6px;
}
.spot-name { font-size: 16px; font-weight: 600; }
.spot-name-cn { font-size: 12px; color: var(--text2); font-weight: 400; }
.spot-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.spot-category {
  font-size: 10px; padding: 2px 8px; border-radius: 12px;
  text-transform: uppercase; letter-spacing: 0.5px;
  font-weight: 600; background: var(--surface2); color: var(--text2);
}
.spot-rating {
  display: flex; align-items: center; gap: 3px;
  font-size: 12px; color: var(--rating);
}
.spot-category.landmark { background: #2c3e5033; color: #5dade2; }
.spot-category.beach { background: #1a527633; color: #48c9b0; }
.spot-category.temple { background: #6c348333; color: #c39bd3; }
.spot-category.market { background: #7e510933; color: #f4d03f; }
.spot-category.shopping { background: #c0392b33; color: #ec7063; }
.spot-category.museum { background: #1a3e4c33; color: #76d7c4; }
.spot-category.neighbourhood { background: #1b4f7233; color: #85c1e9; }
.spot-category.park { background: #1e844933; color: #58d68d; }
.spot-category.nightlife { background: #4a235a33; color: #bb8fce; }
.spot-category.hiking { background: #0e625133; color: #52be80; }
.spot-category.entertainment { background: #b03a2e33; color: #f1948a; }
.spot-category.food { background: #93511633; color: #f0b27a; }
.spot-category.scenic { background: #15436033; color: #aed6f1; }
.spot-category.arts_culture { background: #512e5f33; color: #a569bd; }
.spot-desc {
  font-size: 13px; line-height: 1.6;
  color: var(--text2); margin-top: 4px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}
.spot-card.expanded .spot-desc {
  -webkit-line-clamp: unset; overflow: visible;
}
.spot-expanded-content {
  display: none; margin-top: 14px;
  padding-top: 14px; border-top: 1px solid var(--border);
}
.spot-card.expanded .spot-expanded-content { display: block; }
.spot-expanded-content .info-line {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 13px; color: var(--text2); margin-bottom: 8px;
  line-height: 1.5;
}
.spot-expanded-content .info-line strong { color: var(--text); min-width: 70px; }
.map-link {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 12px; padding: 8px 16px;
  background: var(--accent); color: #fff;
  border-radius: var(--radius-sm); text-decoration: none;
  font-size: 13px; font-weight: 600; transition: opacity 0.2s;
}
.map-link:hover { opacity: 0.85; }

/* Welcome screen */
.welcome {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; text-align: center;
  padding: 40px;
}
.welcome h1 {
  font-size: 36px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), #f39c12, #e74c3c);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.welcome .subtitle { font-size: 15px; color: var(--text2); margin-bottom: 24px; }
.welcome .stats {
  display: flex; gap: 32px; margin-top: 24px;
}
.welcome .stat-item { text-align: center; }
.welcome .stat-num {
  font-size: 32px; font-weight: 700; color: var(--accent);
}
.welcome .stat-label { font-size: 12px; color: var(--text2); }
.welcome .start-hint {
  margin-top: 32px; padding: 12px 24px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 13px; color: var(--text2);
}

/* Search results */
.search-results { padding: 0; }
.search-result-item {
  padding: 16px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 0.15s;
  display: flex; gap: 14px;
}
.search-result-item:hover { background: var(--surface); }
.search-result-img {
  width: 80px; height: 80px; border-radius: var(--radius-sm);
  object-fit: cover; background: var(--surface2); flex-shrink: 0;
}
.search-result-info { flex: 1; min-width: 0; }
.search-result-info h4 { font-size: 15px; margin-bottom: 3px; }
.search-result-info .result-meta { font-size: 11px; color: var(--text2); }
.search-result-info .result-desc {
  font-size: 12px; color: var(--text2);
  margin-top: 4px; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* Loading state */
.loading {
  display: flex; align-items: center; justify-content: center;
  height: 200px; color: var(--text2); font-size: 13px;
}
.spinner {
  width: 24px; height: 24px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-right: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Utility */
.hidden { display: none !important; }

/* Responsive */
@media (max-width: 900px) {
  .sidebar { width: 200px; min-width: 200px; }
  .spots-grid { grid-template-columns: 1fr; }
  .content { padding: 16px; }
  .main-header { padding: 14px 16px; }
}
</style>
</head>
<body>
<div class="app-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>🇭🇰 香港旅遊</h1>
      <p>Hong Kong Tour Guide</p>
    </div>
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search spots..." oninput="doSearch(this.value)">
    </div>
    <div class="region-nav" id="regionNav">
      <div class="loading"><div class="spinner"></div>Loading regions...</div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="main-header" id="mainHeader">
      <div>
        <h2 id="pageTitle">Hong Kong Tour</h2>
        <div class="subtitle" id="pageSubtitle">Explore every corner of Hong Kong</div>
      </div>
      <div class="filter-bar" id="filterBar"></div>
    </div>
    <div class="content" id="contentArea">
      <div class="welcome" id="welcomeScreen">
        <h1>🇭🇰 香港</h1>
        <div class="subtitle">Discover the hidden gems and iconic landmarks of Hong Kong</div>
        <div class="stats" id="statsDisplay">
          <div class="stat-item"><div class="stat-num" id="statRegions">—</div><div class="stat-label">Regions</div></div>
          <div class="stat-item"><div class="stat-num" id="statAreas">—</div><div class="stat-label">Areas</div></div>
          <div class="stat-item"><div class="stat-num" id="statSpots">—</div><div class="stat-label">Spots</div></div>
        </div>
        <div class="start-hint">← Select a region from the sidebar to begin exploring</div>
      </div>
      <div id="regionContent" class="hidden"></div>
      <div id="searchContent" class="hidden"></div>
    </div>
  </div>
</div>

<script>
// State
let allData = null;
let currentRegion = null;
let currentAreas = [];
let currentFilter = 'all';
let searchTimeout = null;

// Init
window.addEventListener('DOMContentLoaded', init);

async function init() {
  await loadData();
  renderSidebar();
  renderWelcomeStats();
}

async function loadData() {
  try {
    const r = await fetch('data.json');
    allData = await r.json();
  } catch(e) {
    console.error('Failed to load data:', e);
  }
}

// ---- static build: no server, so search runs locally ----------
// allData is empty until loadData() resolves, so build the index on first
// search instead of at parse time (doing it eagerly found 0 results).
var _allSpots = null;
function _buildSpotIndex() {
  if (_allSpots) return _allSpots;
  _allSpots = [];
  for (var _rk in allData) {
    var _r = allData[_rk];
    for (var _ai = 0; _ai < (_r.areas || []).length; _ai++) {
      var _sp = _r.areas[_ai].spots || [];
      for (var _si = 0; _si < _sp.length; _si++) {
        // the search-result markup calls goToSpot(spot.region_key, ...), and
        // displays spot.region -- the server sets both, so mirror them here.
        _sp[_si].region_key = _sp[_si].region_key || _rk;
        _sp[_si].region = _sp[_si].region || _r.name;
        _allSpots.push(_sp[_si]);
      }
    }
  }
  return _allSpots;
}
function apiSearch(q) {
  var spots = _buildSpotIndex();
  var kws = String(q).toLowerCase().split(/\s+/).filter(Boolean);
  return spots.filter(function (s) {
    var t = [s.name, s.name_cn, s.description, s.area, s.region, s.category]
      .join(' ').toLowerCase();
    return kws.every(function (k) { return t.indexOf(k) !== -1; });
  });
}

function renderSidebar() {
  const nav = document.getElementById('regionNav');
  let html = '';
  let totalSpots = 0;
  
  for (const [key, region] of Object.entries(allData)) {
    let areaCount = 0;
    let spotCount = 0;
    for (const area of (region.areas || [])) {
      if (area.spots) areaCount++;
      spotCount += (area.spots || []).length;
    }
    totalSpots += spotCount;
    
    html += `
      <div class="region-item" data-region="${key}" onclick="selectRegion('${key}')">
        <div class="region-dot" style="background:${region.color}"></div>
        <div class="region-info">
          <div class="region-name">${region.name}</div>
          <div class="region-count">${spotCount} spots · ${areaCount} areas</div>
        </div>
      </div>
    `;
  }
  
  nav.innerHTML = html;
  document.getElementById('statSpots').textContent = totalSpots;
  document.getElementById('statRegions').textContent = Object.keys(allData).length;
  
  let totalAreas = 0;
  for (const r of Object.values(allData)) totalAreas += (r.areas || []).length;
  document.getElementById('statAreas').textContent = totalAreas;
}

function renderWelcomeStats() {
  // Already done in renderSidebar
}

function selectRegion(regionKey) {
  currentRegion = regionKey;
  currentFilter = 'all';
  
  // Update sidebar
  document.querySelectorAll('.region-item').forEach(el => {
    el.classList.toggle('active', el.dataset.region === regionKey);
  });
  
  // Show/hide content
  document.getElementById('welcomeScreen').classList.add('hidden');
  document.getElementById('searchContent').classList.add('hidden');
  document.getElementById('regionContent').classList.remove('hidden');
  
  const region = allData[regionKey];
  
  // Update header
  document.getElementById('pageTitle').textContent = region.name;
  document.getElementById('pageSubtitle').textContent = region.description;
  
  // Build filter bar
  renderFilters(region);
  
  // Render region content
  renderRegion(region, regionKey);
}

function renderFilters(region) {
  const bar = document.getElementById('filterBar');
  const categories = new Set();
  
  for (const area of (region.areas || [])) {
    for (const spot of (area.spots || [])) {
      if (spot.category) categories.add(spot.category);
    }
  }
  
  let html = `<button class="filter-btn active" data-cat="all" onclick="setFilter('all')">All</button>`;
  
  const catNames = CAT_LABELS;
  
  for (const cat of [...categories].sort()) {
    html += `<button class="filter-btn" data-cat="${cat}" onclick="setFilter('${cat}')">${catNames[cat] || cat}</button>`;
  }
  
  bar.innerHTML = html;
}

function setFilter(cat) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.cat === cat);
  });
  
  // Re-render with filter
  if (currentRegion) {
    renderRegion(allData[currentRegion], currentRegion);
  }
}

function renderRegion(region, regionKey) {
  const container = document.getElementById('regionContent');
  let html = '';
  
  for (const area of (region.areas || [])) {
    const spots = currentFilter === 'all' 
      ? (area.spots || [])
      : (area.spots || []).filter(s => s.category === currentFilter);
    
    if (spots.length === 0 && currentFilter !== 'all') continue;
    
    html += `
      <div class="area-section">
        <div class="area-header">
          <h3>${area.name}</h3>
          <span class="area-name-cn">${cnSuffix(area.name, area.name_cn)}</span>
        </div>
        <div class="area-desc">${area.description || ''}</div>
        <div class="spots-grid" id="spots-${area.name.replace(/\s+/g, '_')}">
    `;
    
    for (const spot of spots) {
      html += renderSpotCard(spot, regionKey);
    }
    
    html += `</div></div>`;
  }
  
  if (!html) {
    html = `<div class="loading" style="height:300px">No spots match this filter.</div>`;
  }
  
  container.innerHTML = html;
}

// Spot/area `name` already embeds the Chinese (e.g. "中環 Central"), so only
// show `name_cn` when it adds something -- otherwise the UI prints it twice.
function cnSuffix(name, cn) {
  if (!cn) return '';
  return String(name || '').indexOf(cn) !== -1 ? '' : cn;
}

// Category slugs are snake_case ("arts_culture"); the filter chips spell them
// out ("Arts & Culture"), so the tags read the same way. Hoisted so the chips
// (renderFilters) and the tags cannot drift apart.
const CAT_LABELS = {
  landmark: 'Landmarks', beach: 'Beaches', temple: 'Temples', market: 'Markets',
  shopping: 'Shopping', museum: 'Museums', neighbourhood: 'Villages',
  park: 'Parks', nightlife: 'Nightlife', hiking: 'Hiking',
  entertainment: 'Entertainment', food: 'Food', scenic: 'Scenic',
  arts_culture: 'Arts & Culture',
};
function catLabel(c) {
  if (!c) return 'other';
  return CAT_LABELS[c] || String(c).replace(/_/g, ' ');
}

function renderSpotCard(spot, regionKey) {
  const ratingStars = '★'.repeat(Math.floor(spot.rating || 0)) + 
    ((spot.rating || 0) % 1 >= 0.5 ? '½' : '');
  const ratingNum = (spot.rating || 0).toFixed(1);
  
  const img = spot.image || `https://via.placeholder.com/400x200/1a1a28/9898b8?text=${encodeURIComponent(spot.name)}`;
  
  const spotId = `spot-${regionKey}-${spot.name.replace(/[^a-zA-Z0-9]/g, '_')}`;
  
  return `
    <div class="spot-card" id="${spotId}" onclick="toggleExpand('${spotId}')">
      <img class="spot-img" src="${img}" alt="${spot.name}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22200%22><rect fill=%22%231a1a28%22 width=%22400%22 height=%22200%22/><text fill=%22%239898b8%22 font-size=%2216%22 text-anchor=%22middle%22 x=%22200%22 y=%22110%22>${encodeURIComponent(spot.name)}</text></svg>'">
      <div class="spot-body">
        <div class="spot-card-header">
          <div>
            <div class="spot-name">${spot.name}</div>
            <div class="spot-name-cn">${cnSuffix(spot.name, spot.name_cn)}</div>
          </div>
          <div class="spot-rating" title="${ratingNum}/5">${ratingStars} <span style="margin-left:2px">${ratingNum}</span></div>
        </div>
        <div class="spot-meta">
          <span class="spot-category ${spot.category || 'other'}">${catLabel(spot.category)}</span>
          <span style="font-size:11px;color:var(--text2)">📍 ${spot.area || ''}</span>
        </div>
        <div class="spot-desc">${spot.description || ''}</div>
        <div class="spot-expanded-content">
          <div class="info-line"><strong>Location:</strong> ${spot.location || ''}</div>
          <div class="info-line"><strong>💡 Tips:</strong> ${spot.tips || ''}</div>
          <a class="map-link" href="${spot.google_maps || '#'}" target="_blank" onclick="event.stopPropagation()">
            📍 View on Google Maps
          </a>
        </div>
      </div>
    </div>
  `;
}

function toggleExpand(spotId) {
  const card = document.getElementById(spotId);
  if (!card) return;
  card.classList.toggle('expanded');
  
  // Scroll to card if expanding
  if (card.classList.contains('expanded')) {
    setTimeout(() => {
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

async function doSearch(query) {
  clearTimeout(searchTimeout);
  
  const val = query.trim();
  if (!val) {
    document.getElementById('searchContent').classList.add('hidden');
    if (currentRegion) {
      document.getElementById('regionContent').classList.remove('hidden');
    } else {
      document.getElementById('welcomeScreen').classList.remove('hidden');
    }
    return;
  }
  
  searchTimeout = setTimeout(async () => {
    try {
      showSearchResults(apiSearch(val), val);
    } catch(e) {
      console.error('Search failed:', e);
    }
  }, 200);
}

function showSearchResults(results, query) {
  document.getElementById('welcomeScreen').classList.add('hidden');
  document.getElementById('regionContent').classList.add('hidden');
  
  const container = document.getElementById('searchContent');
  container.classList.remove('hidden');
  
  if (results.length === 0) {
    container.innerHTML = `
      <div class="loading" style="height:300px;flex-direction:column">
        <div style="font-size:36px;margin-bottom:12px">🔍</div>
        <div>No results found for "${query}"</div>
        <div style="font-size:12px;color:var(--text2);margin-top:4px">Try searching for a place, category, or area</div>
      </div>
    `;
    return;
  }
  
  document.getElementById('pageTitle').textContent = `Search: "${query}"`;
  document.getElementById('pageSubtitle').textContent = `${results.length} spot${results.length > 1 ? 's' : ''} found`;
  document.getElementById('filterBar').innerHTML = '';
  
  let html = `<div class="search-results">`;
  
  for (const spot of results) {
    const img = spot.image || '';
    html += `
      <div class="search-result-item" onclick="goToSpot('${spot.region_key}', '${encodeURIComponent(spot.name)}')">
        <img class="search-result-img" src="${img}" alt="${spot.name}" loading="lazy" onerror="this.style.display='none'">
        <div class="search-result-info">
          <h4>${spot.name}</h4>
          <div class="result-meta">${spot.region} · ${spot.area} · <span class="spot-category ${spot.category || 'other'}">${catLabel(spot.category)}</span></div>
          <div class="result-desc">${(spot.description || '').substring(0, 200)}</div>
        </div>
      </div>
    `;
  }
  
  html += `</div>`;
  container.innerHTML = html;
}

function goToSpot(regionKey, spotName) {
  // Clear search
  document.getElementById('searchInput').value = '';
  document.getElementById('searchContent').classList.add('hidden');
  
  // Select region
  selectRegion(regionKey);
  
  // Find and expand the spot
  const decoded = decodeURIComponent(spotName);
  const spotId = `spot-${regionKey}-${decoded.replace(/[^a-zA-Z0-9]/g, '_')}`;
  
  setTimeout(() => {
    const card = document.getElementById(spotId);
    if (card) {
      card.classList.add('expanded');
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }, 200);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>붉은별 3.0 — Red Star OS 시뮬</title>
<meta name="description" content="Offline educational simulator of Red Star OS 3.0 and the Kwangmyong intranet. No network access.">
<style>
/* ============================================================
   css1 — tokens, reset, boot, login, toast, modal
   ============================================================ */
:root{
  --blue:#2f6fd0; --blue-d:#1b4c97; --blue-l:#dbe7fb;
  --red:#c8102e; --red-d:#8d0018;
  --ink:#17171c; --ink-2:#43434d; --ink-3:#75757f; --ink-4:#9a9aa4;
  --chrome:#dcdee4; --chrome-2:#c6c9d1; --chrome-3:#aeb2bc; --chrome-4:#8f949f;
  --paper:#f2f2f4; --white:#fff; --line:#c9ccd4;
  --ok:#1c7a3e; --warn:#a86400; --err:#a4162a;
  --r:6px; --r-s:3px; --r-l:11px;
  --sp:4px;
  --sh-win:0 18px 44px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.32);
  --sh-1:0 1px 2px rgba(0,0,0,.22);
  --sh-in:inset 0 1px 0 rgba(255,255,255,.85);
  --font:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --mb:26px;   /* menu bar height */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font:13px/1.45 var(--font); color:var(--ink); background:#0b1220;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-d)}
:focus-visible{outline:2px solid #ffb703;outline-offset:1px}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- boot ---------- */
#boot{
  position:fixed;inset:0;z-index:90;background:#07090f;color:#cfd6e4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px
}
.bt-logo{width:104px;height:104px;filter:drop-shadow(0 0 22px rgba(200,16,46,.55))}
.bt-name{font-size:26px;font-weight:700;letter-spacing:.14em;color:#fff}
.bt-sub{font-size:11px;letter-spacing:.34em;color:#8e97aa;text-transform:uppercase}
.bt-bar{width:min(340px,64vw);height:5px;border-radius:3px;background:#1b2130;overflow:hidden}
.bt-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8d0018,#e01b3c,#ff8fa0);transition:width .18s linear}
.bt-log{font:11px/1.6 var(--mono);color:#5d6b85;height:74px;overflow:hidden;width:min(420px,86vw);text-align:left}
.bt-log b{color:#8fa3c8;font-weight:400}
.bt-foot{position:absolute;bottom:22px;font:10px/1.5 var(--mono);color:#3d485c;text-align:center}

/* ---------- login ---------- */
#login{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(120% 90% at 50% 8%,#5f8fd0 0%,#2b4f86 42%,#152742 100%);
  color:#fff;padding:16px;
}
#login::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(closest-side at 50% 42%,rgba(255,255,255,.16),transparent 70%),
    repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px);
  pointer-events:none;
}
.lg-panel{
  position:relative;width:min(360px,100%);padding:26px 24px 18px;border-radius:14px;
  background:linear-gradient(180deg,rgba(20,30,48,.82),rgba(10,16,28,.9));
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 26px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.16);
  backdrop-filter:blur(14px);text-align:center
}
.lg-star{width:56px;height:56px;margin:0 auto 8px;display:block;filter:drop-shadow(0 4px 10px rgba(200,16,46,.5))}
.lg-title{font-size:19px;font-weight:700;letter-spacing:.1em}
.lg-ver{font-size:10px;letter-spacing:.3em;color:#9fb4d6;margin-top:2px}
.lg-users{display:flex;gap:6px;justify-content:center;margin:16px 0 10px;flex-wrap:wrap}
.lg-user{
  display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;font-size:12px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#dce6f6
}
.lg-user.on{background:rgba(90,150,240,.34);border-color:rgba(150,200,255,.7);color:#fff;font-weight:600}
.lg-user .dot{width:6px;height:6px;border-radius:50%;background:#7fd08a}
.lg-user.ro .dot{background:#f0b35a}
.lg-field{display:flex;gap:6px;margin-top:4px}
.lg-field input{
  flex:1;min-width:0;padding:9px 11px;border-radius:7px;border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.1);color:#fff;font-size:13px
}
.lg-field input::placeholder{color:#94a7c4}
.lg-field button{
  padding:9px 16px;border-radius:7px;border:1px solid #7f0a21;color:#fff;font-weight:700;
  background:linear-gradient(180deg,#e02443,#a80d27);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)
}
.lg-field button:active{background:linear-gradient(180deg,#a80d27,#7f0a21)}
.lg-hint{font-size:11px;color:#9db0cd;margin-top:9px;line-height:1.5}
.lg-err{min-height:17px;font-size:11px;color:#ffb1b1;margin-top:6px;font-weight:600}
.lg-foot{
  margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);
  font:10px/1.5 var(--mono);color:#8fa2bf
}
.lg-foot .sep{color:#5f7393}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);
  max-width:min(420px,90vw);padding:9px 14px;border-radius:9px;z-index:120;
  background:rgba(18,22,32,.94);color:#f2f6ff;border:1px solid rgba(255,255,255,.16);
  box-shadow:0 12px 30px rgba(0,0,0,.45);font-size:12px;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .16s,transform .16s,visibility .16s
}
#toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* ---------- modal ---------- */
#modal{
  position:fixed;inset:0;z-index:130;display:none;align-items:center;justify-content:center;
  background:rgba(8,12,20,.5);padding:18px
}
#modal.open{display:flex}
.md-box{
  width:min(460px,100%);max-height:82vh;overflow:auto;border-radius:12px;background:var(--paper);
  border:1px solid var(--chrome-3);box-shadow:var(--sh-win)
}
.md-hd{
  display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--chrome),var(--chrome-2));border-radius:12px 12px 0 0;
  font-weight:700;font-size:12px
}
.md-hd .x{margin-left:auto;width:22px;height:22px;border-radius:5px;border:1px solid var(--chrome-3);
  background:linear-gradient(180deg,#fff,#e2e4e9);font-size:12px;line-height:1}
.md-bd{padding:14px;font-size:12.5px;line-height:1.6}
.md-bd h4{margin:0 0 6px;font-size:13px}
.md-bd p{margin:0 0 9px}
.md-bd ul{margin:0 0 9px;padding-left:18px}
.md-ft{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#eceef2}
.btn{
  padding:6px 13px;border-radius:6px;border:1px solid var(--chrome-3);
  background:linear-gradient(180deg,#fff,#e6e8ed);box-shadow:var(--sh-in)
}
.btn:hover{background:linear-gradient(180deg,#fff,#f0f2f6)}
.btn:active{background:var(--chrome-2)}
.btn.pri{
  border-color:#26579d;color:#fff;background:linear-gradient(180deg,#4f8be0,#2c62b4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4)
}
.btn.pri:hover{background:linear-gradient(180deg,#5f99ea,#376fc2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tag{
  display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700;
  border:1px solid var(--chrome-3);background:#e8eaef;color:var(--ink-2)
}
.tag.doc{background:#e6f0ff;border-color:#a9c6ef;color:#17457f}
.tag.made{background:#fff3e0;border-color:#e6c088;color:#8a5300}
.tag.svc{background:#e9f7ec;border-color:#a4d3b1;color:#1c6b34}

/* ============================================================
   css2 — desktop, menu bar, dock, start menu, windows
   ============================================================ */
#desk{position:fixed;inset:0;z-index:10;overflow:hidden;background:#0e1a2b}
#wall{position:absolute;inset:0;
  background:
    radial-gradient(120% 78% at 50% 106%,#ffdcb0 0%,#f0a05c 7%,#c9442c 20%,#7a2540 40%,#2a2748 63%,#111b31 84%,#080e1a 100%);
}
#wall::after{opacity:.42}
#wall::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(closest-side at 50% 46%,rgba(255,255,255,.20),transparent 62%),
    repeating-conic-gradient(from 0deg at 50% 74%,rgba(255,220,170,.09) 0deg 3deg,transparent 3deg 12deg);
  mix-blend-mode:screen;opacity:.55
}
#wall::after{
  content:"";position:absolute;left:50%;top:16%;width:min(520px,58vw);aspect-ratio:1;
  transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(200,16,46,.30),rgba(200,16,46,.10) 58%,transparent 72%);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  mix-blend-mode:screen;opacity:.5
}
#wall.sunset{background:radial-gradient(118% 76% at 50% 104%,#ffdcb0,#f0a05c 8%,#c9442c 22%,#76243e 42%,#282646 64%,#101a30 86%,#080e1a 100%)}
#wall.hills{background:radial-gradient(90% 70% at 30% 70%,#cfe4c2,#7ea77a 22%,#2f5a4a 52%,#16283a 82%,#0a1220 100%)}
#wall.navy{background:radial-gradient(80% 60% at 70% 20%,#2a3f6b,#16233e 45%,#0a1020 82%)}
#wall.steppe{background:radial-gradient(90% 70% at 30% 70%,#cfe4c2,#7ea77a 22%,#2f5a4a 52%,#16283a 82%,#0a1220 100%)}
#wall.night{background:radial-gradient(80% 60% at 70% 20%,#2a3f6b,#16233e 45%,#0a1020 82%)}
#wall.paper{background:linear-gradient(180deg,#e9ebef,#cfd4dc 60%,#b9bfc9)}
#wall.paper::before,#wall.paper::after{display:none}

/* desktop icons */
#icons{position:absolute;top:calc(var(--mb) + 12px);left:12px;display:flex;flex-direction:column;gap:6px;z-index:11;
  max-height:calc(100% - var(--mb) - 110px);flex-wrap:wrap;align-content:flex-start}
.dicon{
  width:88px;padding:6px 4px;border-radius:7px;text-align:center;color:#fff;cursor:default;
  text-shadow:0 1px 3px rgba(0,0,0,.75);border:1px solid transparent;background:transparent
}
.dicon .ic{width:38px;height:38px;margin:0 auto 3px;display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))}
.dicon .nm{font-size:11.5px;line-height:1.25;word-break:keep-all;display:block}
.dicon:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22)}
.dicon.sel{background:rgba(60,120,220,.45);border-color:rgba(160,205,255,.7)}

/* ---------- menu bar ---------- */
#menubar{
  position:absolute;top:0;left:0;right:0;height:var(--mb);z-index:40;display:flex;align-items:center;
  gap:2px;padding:0 8px;font-size:12px;color:#101318;
  background:linear-gradient(180deg,rgba(246,247,250,.94),rgba(206,210,219,.92));
  border-bottom:1px solid rgba(0,0,0,.28);
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 1px 6px rgba(0,0,0,.25);
  backdrop-filter:blur(9px)
}
#mStar{
  display:flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;
  border:0;background:transparent;font-weight:700
}
#mStar svg{width:13px;height:13px}
#mStar:hover,#mStar.on{background:rgba(0,0,0,.10)}
.mb-app{font-weight:700;margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.mb-item{
  height:20px;padding:0 8px;border-radius:4px;border:0;background:transparent;font-size:12px;white-space:nowrap
}
.mb-item:hover,.mb-item.on{background:rgba(0,0,0,.10)}
.mb-item[disabled]{color:#8b8f99;cursor:default;background:transparent}
.mb-right{margin-left:auto;display:flex;align-items:center;gap:3px}
.mb-chip{
  display:flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;border:0;
  background:transparent;font-size:11.5px;font-variant-numeric:tabular-nums
}
.mb-chip:hover{background:rgba(0,0,0,.10)}
.mb-chip svg{width:12px;height:12px}
.mb-chip.alert{color:#8d0018;font-weight:700}
#mbClock{min-width:56px;justify-content:center}
#mbUser{gap:5px}
#mbUser .av{width:15px;height:15px;border-radius:50%;background:linear-gradient(180deg,#7fa6dd,#3f6ea8);color:#fff;
  font-size:9px;display:grid;place-items:center;font-weight:700}

/* ---------- dock ---------- */
#dockWrap{
  position:absolute;left:0;right:0;bottom:8px;z-index:35;display:flex;justify-content:center;pointer-events:none
}
#dock{
  pointer-events:auto;display:flex;align-items:flex-end;gap:5px;padding:6px 9px;border-radius:16px;
  background:linear-gradient(180deg,rgba(38,46,62,.72),rgba(16,21,32,.82));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.28);
  backdrop-filter:blur(14px) saturate(140%);max-width:calc(100vw - 20px);overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none
}
#dock::-webkit-scrollbar{display:none}
.dk{
  position:relative;width:46px;height:46px;flex:0 0 auto;border-radius:11px;border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.05));
  display:grid;place-items:center;transition:transform .12s,box-shadow .12s;padding:0
}
.dk svg{width:30px;height:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
.dk:hover{transform:translateY(-6px) scale(1.06);box-shadow:0 8px 18px rgba(0,0,0,.45)}
.dk:active{transform:translateY(-2px) scale(1)}
.dk.run::after{content:"";position:absolute;bottom:-4px;left:50%;width:4px;height:4px;border-radius:50%;
  background:#eaf2ff;transform:translateX(-50%);box-shadow:0 0 6px rgba(255,255,255,.9)}
.dk-sep{width:1px;height:32px;background:rgba(255,255,255,.25);margin:0 3px;flex:0 0 auto}
.dk-trash svg{width:28px;height:28px}

/* ---------- start menu ---------- */
#startMenu{
  position:absolute;top:calc(var(--mb) + 2px);left:8px;z-index:60;width:min(520px,calc(100vw - 16px));
  max-height:calc(100vh - var(--mb) - 18px);display:flex;flex-direction:column;
  border-radius:10px;overflow:hidden;border:1px solid rgba(0,0,0,.45);
  background:linear-gradient(180deg,#f6f7f9,#e6e8ee);
  box-shadow:0 22px 50px rgba(0,0,0,.5)
}
.sm-hd{
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:linear-gradient(180deg,#2b3d5c,#182640);color:#fff
}
.sm-hd svg{width:24px;height:24px}
.sm-hd .t{font-weight:700;font-size:13px;letter-spacing:.04em}
.sm-hd .s{font-size:10px;color:#9fb4d6}
.sm-body{display:grid;grid-template-columns:1.6fr 1fr;min-height:0;flex:1 1 auto;overflow:auto}
.sm-col:first-child{display:grid;grid-template-columns:1fr 1fr;align-content:start;column-gap:3px}
.sm-col:first-child .sm-cap{grid-column:1 / -1}
.sm-it small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-col{padding:6px;border-right:1px solid var(--line);min-height:0;overflow:auto}
.sm-col:last-child{border-right:0;background:#eef0f4}
.sm-cap{font-size:10px;letter-spacing:.14em;color:var(--ink-3);padding:4px 8px 5px;text-transform:uppercase}
.sm-it{
  display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:6px;border:0;
  background:transparent;text-align:left;font-size:12.5px
}
.sm-it svg{width:20px;height:20px;flex:0 0 auto}
.sm-it:hover,.sm-it:focus-visible{background:linear-gradient(180deg,#3f79cf,#2b5da8);color:#fff}
.sm-it small{display:block;font-size:10px;color:var(--ink-3);font-weight:400}
.sm-it:hover small{color:#d8e6ff}
.sm-ft{display:flex;gap:6px;padding:7px 8px;border-top:1px solid var(--line);background:#dfe2e8}
.sm-ft .btn{font-size:11.5px;padding:4px 9px}

/* ---------- windows ---------- */
#winLayer{position:absolute;inset:0;z-index:20;pointer-events:none}
.win{
  position:absolute;display:flex;flex-direction:column;min-width:280px;min-height:170px;
  border-radius:9px;overflow:hidden;background:var(--paper);pointer-events:auto;
  border:1px solid rgba(0,0,0,.42);box-shadow:var(--sh-win)
}
.win.act{border-color:rgba(0,0,0,.55);box-shadow:0 26px 64px rgba(0,0,0,.55),0 3px 10px rgba(0,0,0,.4)}
.win.min{display:none}
.win.max{border-radius:0}
.wt{
  height:28px;flex:0 0 28px;display:flex;align-items:center;gap:6px;padding:0 8px;cursor:default;
  background:linear-gradient(180deg,#e3e5ea,#c3c6ce);
  border-bottom:1px solid rgba(0,0,0,.28);box-shadow:var(--sh-in)
}
.win.act .wt{background:linear-gradient(180deg,#eceef2,#cfd3db)}
.tl{display:flex;gap:5px;align-items:center}
.tl button{
  width:11px;height:11px;border-radius:50%;border:1px solid rgba(0,0,0,.3);padding:0;
  font-size:0;line-height:0;position:relative
}
.tl .c{background:radial-gradient(circle at 35% 30%,#ff8b83,#e0443b 70%)}
.tl .m{background:radial-gradient(circle at 35% 30%,#ffe08a,#e0a52c 70%)}
.tl .z{background:radial-gradient(circle at 35% 30%,#9be6a0,#2fa845 70%)}
.tl button:hover::after{
  content:attr(data-g);position:absolute;left:50%;top:14px;transform:translateX(-50%);
  font-size:10px;color:#111;background:#fff;border:1px solid #b9bcc4;border-radius:3px;padding:0 3px;white-space:nowrap
}
.wt .ti{
  flex:1;text-align:center;font-size:12px;font-weight:700;color:#2a2d34;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px
}
.wt .badge{font-size:9px;font-weight:700;color:#fff;background:#8d0018;border-radius:8px;padding:1px 5px}
.wb{flex:1;min-height:0;overflow:auto;background:var(--white);position:relative}
.win.dim .wb{opacity:.6}
.wr{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.25) 50%)}

/* window body chrome shared */
.app{padding:0;height:100%;display:flex;flex-direction:column;min-height:0}
.tbar{
  display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#f4f5f8,#e6e8ee);flex:0 0 auto;flex-wrap:wrap
}
.tbar .btn{font-size:11.5px;padding:3px 8px}
.side{width:190px;flex:0 0 190px;border-right:1px solid var(--line);background:#f4f5f8;overflow:auto}
.split{display:flex;flex:1;min-height:0}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:12px}
.empty b{display:block;color:var(--ink-2);font-size:13px;margin-bottom:4px}
.loading{padding:22px;text-align:center;color:var(--ink-3);font-size:12px}
.loading .sp{width:16px;height:16px;border:2px solid #cfd3db;border-top-color:var(--blue);border-radius:50%;
  margin:0 auto 8px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mono{font-family:var(--mono)}
table.kp{width:100%;border-collapse:collapse;font-size:12px}
table.kp th{
  text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);
  padding:6px 8px;border-bottom:1px solid var(--line);background:#f0f1f5;position:sticky;top:0;z-index:1
}
table.kp td{padding:5px 8px;border-bottom:1px solid #e7e9ee;vertical-align:top}
table.kp tr:hover td{background:#f6f9ff}
table.kp td.ip{font-family:var(--mono);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
table.kp a{color:#17457f;text-decoration:none}
table.kp a:hover{text-decoration:underline}

/* ============================================================
   css3 — application UIs
   ============================================================ */

/* ---------- Naenara browser ---------- */
.br-bar{
  display:flex;align-items:center;gap:4px;padding:5px 6px;flex:0 0 auto;
  background:linear-gradient(180deg,#f7f8fa,#e4e7ed);border-bottom:1px solid var(--line)
}
.br-bar button{
  width:26px;height:24px;border-radius:5px;border:1px solid var(--chrome-3);
  background:linear-gradient(180deg,#fff,#e9ebf0);font-size:12px;padding:0;line-height:1
}
.br-bar button:hover{background:linear-gradient(180deg,#fff,#f2f4f8)}
.br-bar button[disabled]{opacity:.4;cursor:default}
.br-addr{
  flex:1;min-width:0;display:flex;align-items:center;gap:4px;padding:2px 4px 2px 8px;border-radius:6px;
  border:1px solid #a9b0bd;background:#fff;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)
}
.br-addr .lock{font-size:10px;color:var(--ink-3);white-space:nowrap}
.br-addr input{
  flex:1;min-width:0;border:0;outline:0;padding:4px 2px;font-size:12.5px;font-family:var(--mono);background:transparent
}
.br-addr .go{
  border:1px solid var(--chrome-3);border-radius:5px;padding:2px 8px;font-size:11px;
  background:linear-gradient(180deg,#fff,#e6e8ed)
}
.br-tabs{display:flex;gap:2px;padding:4px 6px 0;background:#dfe2e8;border-bottom:1px solid var(--line);overflow-x:auto}
.br-tab{
  display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px 7px 0 0;font-size:11.5px;
  border:1px solid var(--line);border-bottom:0;background:#eef0f4;max-width:170px;white-space:nowrap
}
.br-tab.on{background:#fff;font-weight:700;box-shadow:0 -1px 0 #fff}
.br-tab .x{border:0;background:transparent;font-size:11px;padding:0 1px;color:var(--ink-3)}
.br-tab.on .x:hover{color:var(--red)}
.br-status{
  flex:0 0 auto;display:flex;gap:10px;align-items:center;padding:3px 9px;font-size:10.5px;color:var(--ink-3);
  border-top:1px solid var(--line);background:#eef0f4;font-variant-numeric:tabular-nums
}
.br-status .net{color:var(--ok);font-weight:700}
.br-status .net.off{color:var(--err)}
.br-view{flex:1;min-height:0;overflow:auto;background:#fff;padding:0}

/* page shell inside the browser */
.pg{padding:0 0 26px;font-size:12.5px;line-height:1.6;color:#22252b;max-width:100%}
.pg-band{
  display:flex;align-items:center;gap:10px;padding:10px 16px;color:#fff;
  background:linear-gradient(135deg,#25334d,#101a2b 60%,#3a1020)
}
.pg-band .star{width:26px;height:26px;flex:0 0 auto}
.pg-band .bt{font-size:15px;font-weight:700;letter-spacing:.03em}
.pg-band .bs{font-size:10.5px;color:#a9bddb}
.pg-band .rt{margin-left:auto;font:10px/1.4 var(--mono);color:#93a9c9;text-align:right;white-space:nowrap}
.pg-body{padding:14px 16px 0}
.pg h2{font-size:15px;margin:0 0 3px;color:#132a4a}
.pg h3{font-size:13px;margin:16px 0 6px;padding-bottom:3px;border-bottom:1px solid #e3e6ec;color:#1d3a63}
.pg h4{font-size:12.5px;margin:12px 0 4px}
.pg p{margin:0 0 9px}
.pg .lede{font-size:13px;color:#3d434d}
.pg .meta{font:10.5px/1.5 var(--mono);color:#7c828d;margin-bottom:10px}
.pg .rule{height:1px;background:#e3e6ec;margin:12px 0}
.pg a{color:#1a4f96;text-decoration:none;border-bottom:1px solid #c3d6f0}
.pg a:hover{background:#eef5ff}
.pg ul,.pg ol{margin:0 0 9px;padding-left:20px}
.pg li{margin:2px 0}
.pg .kv{display:grid;grid-template-columns:104px 1fr;gap:3px 10px;font-size:12px;margin:8px 0}
.pg .kv b{color:#5a616d;font-weight:600}
.pg .note{
  border-left:3px solid #c8102e;background:#fff7f8;padding:7px 10px;font-size:11.5px;color:#5c2a32;margin:10px 0
}
.pg .box{border:1px solid #d9dde5;border-radius:7px;padding:10px 12px;background:#fafbfd;margin:10px 0}
.pg .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:10px 0}
.pg .card{
  border:1px solid #dbe0e8;border-radius:7px;padding:9px 11px;background:linear-gradient(180deg,#fdfdff,#f4f6fa)
}
.pg .card .ct{font-weight:700;font-size:12px;color:#173a63;margin-bottom:2px}
.pg .card .cd{font-size:11px;color:#616873;line-height:1.5}
.pg .card .cn{font:10px/1.4 var(--mono);color:#7d8490;margin-top:5px}
.pg .art{border-bottom:1px solid #eceef2;padding:9px 0}
.pg .art:last-child{border-bottom:0}
.pg .art .at{font-weight:700;font-size:12.5px;color:#1b2b45}
.pg .art .ad{font-size:11px;color:#7a8persist;color:#7a818c}
.pg .list-row{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px dotted #e2e5eb;font-size:12px}
.pg .list-row .n{font-family:var(--mono);font-size:10.5px;color:#6f7683;min-width:52px}
.pg .list-row .t{flex:1}
.pg .list-row .d{font-size:10.5px;color:#6f7683;white-space:nowrap}

/* blocked / not found */
.pg-block{padding:30px 22px;max-width:600px;margin:0 auto;text-align:center}
.pg-block .bstar{width:54px;height:54px;margin:0 auto 10px;display:block;filter:grayscale(.2)}
.pg-block h2{color:#8d0018;font-size:17px;margin:0 0 6px;letter-spacing:.06em}
.pg-block .bx{border:1px solid #e6c3c8;background:#fff6f7;border-radius:8px;padding:12px 14px;text-align:left;margin:12px 0;font-size:12px}
.pg-block .code{font-family:var(--mono);font-size:11px;color:#7e2b36;background:#f7ecee;padding:2px 6px;border-radius:4px;display:inline-block}

/* ---------- catalogue app ---------- */
.cat-wrap{display:flex;flex:1;min-height:0}
.cat-filter{padding:8px;display:flex;flex-direction:column;gap:4px}
.cat-filter button{
  text-align:left;padding:5px 8px;border-radius:6px;border:1px solid transparent;background:transparent;font-size:12px
}
.cat-filter button:hover{background:#e8ecf4}
.cat-filter button.on{background:linear-gradient(180deg,#3f79cf,#2b5da8);color:#fff;font-weight:700;border-color:#26579d}
.cat-filter .cnt{float:right;font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}
.cat-main{flex:1;min-width:0;display:flex;flex-direction:column}
.cat-search{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);background:#f7f8fa}
.cat-search input{flex:1;min-width:0;padding:5px 9px;border-radius:6px;border:1px solid #a9b0bd;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.1);font-size:12.5px}
.cat-list{flex:1;overflow:auto}
.cat-foot{padding:4px 9px;border-top:1px solid var(--line);background:#eef0f4;font-size:10.5px;color:var(--ink-3);
  display:flex;gap:10px;font-variant-numeric:tabular-nums}

/* ---------- shop ---------- */
.shop{display:flex;flex:1;min-height:0}
.shop-main{flex:1;min-width:0;overflow:auto;padding:10px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.good{
  border:1px solid #d8dde6;border-radius:8px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:5px;
  box-shadow:0 1px 2px rgba(0,0,0,.05)
}
.good .thumb{
  height:82px;border-radius:6px;display:grid;place-items:center;font-size:26px;color:#fff;
  background:linear-gradient(135deg,#4b6fa8,#22354f)
}
.good .gn{font-size:12px;font-weight:700;line-height:1.3;color:#1d2c44}
.good .gp{font-size:12.5px;font-weight:700;color:#8d0018;font-variant-numeric:tabular-nums}
.good .gs{font-size:10.5px;color:var(--ink-3)}
.good .btn{font-size:11px;padding:3px 8px;margin-top:auto}
.good.out{opacity:.62}
.basket{width:220px;flex:0 0 220px;border-left:1px solid var(--line);background:#f5f6f9;display:flex;flex-direction:column}
.basket h4{margin:0;padding:7px 10px;font-size:12px;border-bottom:1px solid var(--line);background:#e9ebf1}
.bk-items{flex:1;overflow:auto;padding:6px 8px;min-height:60px}
.bk-row{display:flex;gap:6px;align-items:center;font-size:11.5px;padding:4px 0;border-bottom:1px dotted #dde0e7}
.bk-row .bn{flex:1;min-width:0;line-height:1.3}
.bk-row .q{display:flex;align-items:center;gap:2px}
.bk-row .q button{width:17px;height:17px;border-radius:4px;border:1px solid var(--chrome-3);background:#fff;font-size:11px;line-height:1;padding:0}
.bk-row .q span{min-width:14px;text-align:center;font-variant-numeric:tabular-nums}
.bk-sum{padding:7px 10px;border-top:1px solid var(--line);font-size:11.5px;background:#eceef3}
.bk-sum .tr{display:flex;justify-content:space-between;margin:2px 0}
.bk-sum .tot{font-weight:700;font-size:13px;color:#8d0018;border-top:1px solid #cfd3db;padding-top:4px;margin-top:4px}
.bk-sum .btn{width:100%;margin-top:6px}

/* ---------- mail ---------- */
.mail{display:flex;flex:1;min-height:0}
.mail-side{width:150px;flex:0 0 150px;border-right:1px solid var(--line);background:#f4f5f8;padding:7px}
.mail-side button{width:100%;text-align:left;padding:5px 8px;border-radius:6px;border:0;background:transparent;font-size:12px}
.mail-side button.on{background:linear-gradient(180deg,#3f79cf,#2b5da8);color:#fff;font-weight:700}
.mail-side button .n{float:right;font-size:10px;opacity:.8}
.mail-list{width:238px;flex:0 0 238px;border-right:1px solid var(--line);overflow:auto;background:#fff}
.mail-item{padding:6px 9px;border-bottom:1px solid #eceef2;font-size:11.5px;cursor:default}
.mail-item:hover{background:#f4f8ff}
.mail-item.on{background:#e8f1ff;box-shadow:inset 3px 0 0 var(--blue)}
.mail-item .f{font-weight:700;color:#1d2c44;display:flex;gap:6px;align-items:baseline}
.mail-item .f .k{margin-left:auto;font-size:10px;color:#8d0018;font-weight:700}
.mail-item .s{color:#3f4652;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-item .d{font-size:10px;color:#6f7683;font-variant-numeric:tabular-nums}
.mail-item.unread .f::before{content:"●";color:var(--blue);font-size:8px;margin-right:1px}
.mail-read{flex:1;min-width:0;display:flex;flex-direction:column}
.mail-read .hd{padding:9px 12px;border-bottom:1px solid var(--line);background:#fafbfd}
.mail-read .hd .t{font-weight:700;font-size:13px;margin-bottom:2px}
.mail-read .hd .m{font-size:10.5px;color:#7c828d;font-family:var(--mono)}
.mail-read .bd{flex:1;overflow:auto;padding:12px;font-size:12.5px;line-height:1.65;white-space:pre-wrap}
.mail-compose{flex:1;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:7px}
.mail-compose label{font-size:11px;color:var(--ink-3);display:block;margin-bottom:2px}
.mail-compose input,.mail-compose textarea{
  width:100%;padding:6px 8px;border-radius:6px;border:1px solid #a9b0bd;box-shadow:inset 0 1px 2px rgba(0,0,0,.1);
  font-size:12.5px;background:#fff
}
.mail-compose textarea{flex:1;min-height:120px;resize:vertical;font-family:var(--font);line-height:1.6}

/* ---------- terminal ---------- */
.term{background:#0a0f18;color:#c8d6e5;font-family:var(--mono);font-size:12px;height:100%;
  display:flex;flex-direction:column;padding:0}
.term-out{flex:1;overflow:auto;padding:9px 11px;white-space:pre-wrap;line-height:1.55}
.term-out .p{color:#6fd08a}
.term-out .e{color:#ff9a9a}
.term-out .h{color:#8fb6f0}
.term-in{display:flex;gap:6px;align-items:center;padding:6px 11px;border-top:1px solid #1d2635;background:#0d1521}
.term-in .p{color:#6fd08a;white-space:nowrap}
.term-in input{flex:1;background:transparent;border:0;outline:0;color:#e6eefc;font-family:var(--mono);font-size:12px}

/* ---------- files ---------- */
.files{display:flex;flex:1;min-height:0}
.files .side{width:170px}
.file-row{display:flex;align-items:center;gap:8px;padding:5px 9px;border-bottom:1px solid #eceef2;font-size:12px}
.file-row:hover{background:#f4f8ff}
.file-row .fi{width:16px;text-align:center}
.file-row .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row .fs{font-size:10.5px;color:#6f7683;font-variant-numeric:tabular-nums;white-space:nowrap}
.file-row.on{background:#e8f1ff;box-shadow:inset 3px 0 0 var(--blue)}
.file-prev{flex:1;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.file-prev .hd{padding:6px 10px;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;background:#f7f8fa}
.file-prev .bd{flex:1;overflow:auto;padding:10px;font-size:12px;line-height:1.65;white-space:pre-wrap;font-family:var(--mono);color:#20304a}
.wm-stamp{color:#a4162a;font-weight:700}

/* ---------- settings / about / log ---------- */
.set{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.set-row{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid #dde1e9;border-radius:7px;background:#fafbfd}
.set-row .lb{width:150px;flex:0 0 150px;font-size:12px;font-weight:700;color:#2b3a52}
.set-row .lb small{display:block;font-weight:400;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.set-row .ct{flex:1;min-width:0;font-size:12px;display:flex;flex-direction:column;gap:5px}
.set-row select,.set-row input[type=text]{padding:4px 7px;border-radius:5px;border:1px solid #a9b0bd;background:#fff;max-width:240px}
.seg{display:inline-flex;border:1px solid var(--chrome-3);border-radius:6px;overflow:hidden}
.seg button{padding:4px 12px;border:0;background:#fff;font-size:11.5px;border-right:1px solid var(--chrome-3)}
.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(180deg,#3f79cf,#2b5da8);color:#fff;font-weight:700}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:11.5px}
.sw .k{width:34px;height:18px;border-radius:10px;background:#c2c6cf;position:relative;transition:background .15s;border:0;padding:0}
.sw .k::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.sw .k.on{background:#2f9e4f}
.sw .k.on::after{left:18px}
.sw .k[disabled]{opacity:.5}
.about{padding:14px;overflow:auto;font-size:12.5px;line-height:1.65}
.about h3{font-size:13px;margin:14px 0 5px;padding-bottom:3px;border-bottom:1px solid #e3e6ec;color:#1d3a63}
.about h3:first-child{margin-top:0}
.about .facts{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0}
.about .fact{border:1px solid #dde1e9;border-radius:7px;padding:7px 10px;background:#fafbfd;font-size:11.5px}
.about .fact b{color:#173a63}
.about .fact .src{font:10px/1.4 var(--mono);color:#7c828d;word-break:break-all}
.about .invented{border-left:3px solid #a86400;background:#fffaf0;padding:7px 10px;font-size:11.5px;margin:8px 0}
.about .tabs{display:flex;gap:4px;margin-bottom:10px}
.about .tabs button{padding:4px 11px;border-radius:6px;border:1px solid var(--chrome-3);background:#fff;font-size:11.5px}
.about .tabs button.on{background:linear-gradient(180deg,#3f79cf,#2b5da8);color:#fff;border-color:#26579d;font-weight:700}

/* ---------- media player ---------- */
.media{display:flex;flex:1;min-height:0;background:#0b1119;color:#dce6f5}
.media .list{width:200px;flex:0 0 200px;border-right:1px solid #1e2836;overflow:auto;background:#101826}
.media .list button{display:block;width:100%;text-align:left;padding:6px 9px;border:0;border-bottom:1px solid #17202d;
  background:transparent;color:#c9d6e7;font-size:11.5px}
.media .list button.on{background:#1b2941;color:#fff;box-shadow:inset 3px 0 0 #c8102e}
.media .stage{flex:1;min-width:0;display:flex;flex-direction:column}
.media .screen{flex:1;min-height:110px;display:grid;place-items:center;position:relative;
  background:radial-gradient(60% 60% at 50% 40%,#1e2f4a,#0a1018 80%)}
.media .screen .cap{position:absolute;left:12px;bottom:10px;font-size:11px;color:#9fb2cc;font-family:var(--mono)}
.media .screen .bigstar{width:80px;height:80px;opacity:.5}
.media .ctl{display:flex;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid #1e2836;background:#0d1521}
.media .ctl .bar{flex:1;height:4px;border-radius:2px;background:#243044;overflow:hidden;display:block}
.media .ctl .bar i{display:block;height:100%;width:0;background:#c8102e;transition:width .25s linear}
.media .ctl button{border:1px solid #2b3b55;background:#16223a;color:#dce6f5;border-radius:5px;font-size:11px;padding:3px 9px}

/* ---------- game ---------- */
.game{padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center;overflow:auto}
.jboard{display:grid;grid-template-columns:repeat(5,44px);grid-template-rows:repeat(6,44px);gap:2px;
  background:#8a6a3f;padding:5px;border-radius:6px;box-shadow:inset 0 0 0 2px #5d4526}
.jc{background:#e8d3a9;border-radius:3px;display:grid;place-items:center;font-size:15px;font-weight:700;
  cursor:default;border:1px solid #c9ad78;position:relative}
.jc.dark{background:#dcc191}
.jc span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  box-shadow:0 1px 2px rgba(0,0,0,.3)}
.jc .r{background:radial-gradient(circle at 35% 30%,#e8606c,#a8102a);color:#fff;border:1px solid #7d0a1e}
.jc .b{background:radial-gradient(circle at 35% 30%,#8fb6ea,#2a4f86);color:#fff;border:1px solid #1c3659}
.jc.sel{outline:2px solid #2f6fd0;outline-offset:-2px}
.jc.mv::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:rgba(47,111,208,.55)}

/* ---------- dictionary / calc ---------- */
.dict{padding:9px;display:flex;flex-direction:column;gap:7px;overflow:auto}
.dict .bar{display:flex;gap:6px}
.dict .bar input{flex:1;min-width:0;padding:5px 9px;border-radius:6px;border:1px solid #a9b0bd}
.dict .res{font-size:12px}
.dict .ent{border-bottom:1px solid #eceef2;padding:7px 0}
.dict .ent .w{font-weight:700;font-size:13px;color:#173a63}
.dict .ent .p{font-size:11px;color:#6f7683;font-family:var(--mono)}
.dict .ent .m{font-size:12px;margin-top:2px}
.calc{padding:10px;display:flex;flex-direction:column;gap:7px;max-width:280px;margin:0 auto}
.calc .scr{padding:8px 10px;border-radius:6px;background:#101826;color:#e8f0ff;font-family:var(--mono);
  font-size:18px;text-align:right;min-height:44px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.calc .scr small{font-size:10px;color:#7d8ea8;min-height:12px}
.calc .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.calc .pad button{padding:9px 0;border-radius:6px;border:1px solid var(--chrome-3);background:linear-gradient(180deg,#fff,#e8eaef);font-size:13px}
.calc .pad button.op{background:linear-gradient(180deg,#f0f4fb,#dbe4f2);color:#1b4c97;font-weight:700}
.calc .pad button.eq{background:linear-gradient(180deg,#3f79cf,#2b5da8);color:#fff;border-color:#26579d;font-weight:700}

/* ============================================================
   css4 — responsive, motion, print
   ============================================================ */

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

/* ---------- <= 1024 : narrower side rails ---------- */
@media (max-width:1024px){
  .side{width:158px;flex-basis:158px}
  .basket{width:196px;flex-basis:196px}
  .mail-list{width:210px;flex-basis:210px}
  .mail-side{width:128px;flex-basis:128px}
  .sm-body{grid-template-columns:1.2fr 1fr}
}

/* ---------- <= 820 : tablet ---------- */
@media (max-width:820px){
  .dicon{width:78px}
  .dicon .ic{width:34px;height:34px}
  #icons{gap:2px}
  .dk{width:42px;height:42px;border-radius:10px}
  .dk svg{width:27px;height:27px}
  #dock{gap:4px;padding:5px 7px;border-radius:14px}
  .cat-wrap{flex-direction:column}
  .cat-filter{flex-direction:row;overflow-x:auto;border-bottom:1px solid var(--line);padding:5px}
  .cat-filter button{white-space:nowrap;font-size:11.5px;padding:4px 9px}
  .cat-filter .cnt{float:none;margin-left:4px}
  .side{width:100%;flex-basis:auto;max-height:132px;border-right:0;border-bottom:1px solid var(--line)}
  .files{flex-direction:column}
  .files .side{max-height:112px}
  .file-prev{border-left:0;border-top:1px solid var(--line)}
  .shop{flex-direction:column}
  .basket{width:100%;flex-basis:auto;max-height:180px;border-left:0;border-top:1px solid var(--line)}
  .mail{flex-direction:column}
  .mail-side{width:100%;flex-basis:auto;display:flex;gap:3px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .mail-side button{width:auto;white-space:nowrap;font-size:11.5px}
  .mail-list{width:100%;flex-basis:auto;max-height:150px;border-right:0;border-bottom:1px solid var(--line)}
  .media{flex-direction:column}
  .media .list{width:100%;flex-basis:auto;max-height:110px;border-right:0;border-bottom:1px solid #1e2836}
  .set-row{flex-direction:column;gap:5px}
  .set-row .lb{width:auto;flex-basis:auto}
  .sm-body{grid-template-columns:1fr}
  .sm-col:first-child{border-right:0;border-bottom:1px solid var(--line)}
}

/* ---------- <= 560 : phone ---------- */
@media (max-width:560px){
  :root{--mb:30px}
  #menubar{gap:0;padding:0 5px;font-size:11.5px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  #menubar::-webkit-scrollbar{display:none}
  .mb-item{padding:0 5px;font-size:11px}
  .mb-app{max-width:22vw}
  .mb-right .hide-s{display:none}
  #mbClock{min-width:46px;font-size:11px}
  #icons{left:8px;top:calc(var(--mb) + 8px);max-height:44vh}
  .dicon{width:66px}
  .dicon .ic{width:30px;height:30px}
  .dicon .nm{font-size:10px}
  #dockWrap{bottom:5px;padding:0 5px}
  #dock{gap:3px;padding:4px 5px;border-radius:12px;max-width:100%}
  .dk{width:37px;height:37px;border-radius:9px}
  .dk svg{width:23px;height:23px}
  .dk-sep{height:24px;margin:0 1px}
  #startMenu{left:4px;width:calc(100vw - 8px);max-height:calc(100vh - var(--mb) - 60px);overflow:auto}
  .wl-app{display:none}
  .pg-body{padding:11px 12px 0}
  .pg-band{padding:9px 12px}
  .pg-band .rt{display:none}
  .pg .cards{grid-template-columns:1fr}
  .pg .kv{grid-template-columns:1fr;gap:0 0}
  .pg .kv b{display:block;margin-top:6px;font-size:10.5px}
  .br-addr .lock{display:none}
  .mail-read .bd{padding:10px}
  .jboard{grid-template-columns:repeat(5,38px);grid-template-rows:repeat(6,38px)}
  .about{padding:11px}
  .md-box{max-height:88vh}
}

/* ---------- short screens ---------- */
@media (max-height:560px){
  #dockWrap{bottom:4px}
  .dk{width:38px;height:38px}
  #icons{max-height:calc(100% - var(--mb) - 80px)}
}

/* ---------- print : the info panel is the printable artefact ---------- */
@media print{
  #boot,#login,#desk,#toast,#modal{display:none !important}
  body{overflow:visible;background:#fff}
  .print-only{display:block !important}
}
.print-only{display:none}

/* ============================================================
   css5 — app interiors: browser, files, office, media, monitor,
          about, blocked pages, IDE extras, narrow-screen folding
   ============================================================ */

/* ---------------- Naenara browser ---------------- */
.br{display:flex;flex-direction:column;height:100%;min-height:0}
.br-bar{display:flex;align-items:center;gap:4px;padding:5px 6px;
  background:linear-gradient(180deg,#f6f7fa,#e3e6ed);border-bottom:1px solid var(--line)}
.nb{min-width:24px;padding:2px 6px;font-size:11.5px;line-height:1.35;border-radius:5px;
  border:1px solid var(--chrome-3);background:linear-gradient(180deg,#fff,#e9ecf2);color:#2b3038}
.nb:hover:not(:disabled){background:linear-gradient(180deg,#fff,#dde4ef)}
.nb:disabled{opacity:.38;cursor:default}
.nb.go{background:linear-gradient(180deg,#3f79cf,#2b5da8);border-color:#26579d;color:#fff;font-weight:700;padding:2px 9px}
#brAddr{flex:1 1 auto;min-width:48px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;
  background:#fff;font:11px/1.5 var(--mono);color:#1e2430;box-shadow:inset 0 1px 2px rgba(0,0,0,.07)}
.br-books{display:flex;gap:3px;padding:3px 6px;background:#e9ecf2;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none}
.br-books::-webkit-scrollbar{height:0}
.br-books button{flex:0 0 auto;font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap;
  border:1px solid var(--chrome-3);background:linear-gradient(180deg,#fff,#eef1f6);color:#243a5c}
.br-view{flex:1 1 auto;overflow:auto;background:#fff;min-height:0}
.br-stat{display:flex;gap:10px;align-items:center;padding:2px 8px;font-size:10px;color:#5b626d;
  background:linear-gradient(180deg,#f2f3f6,#e5e8ee);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden}
.br-stat span{overflow:hidden;text-overflow:ellipsis}

/* blocked / no-route / nxdomain */
.brk{padding:16px 18px 20px;max-width:660px;margin:0 auto;display:flex;flex-direction:column;gap:9px}
.bhd{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;
  border:1px solid #e3c4ca;background:linear-gradient(180deg,#fdf5f6,#f7e9ec)}
.bhd svg{width:30px;height:30px;flex:0 0 auto}
.bhd .bt{font-size:13.5px;font-weight:700;color:var(--red-d)}
.bhd .bs{font-size:10.5px;color:#7b828d;font-family:var(--mono)}
.brk p{margin:0;font-size:12px;line-height:1.65;color:#333a45}
.brk h3{margin:2px 0 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#7b828d}
.brk .kp{margin:0}
.brk .term-pre{margin:0}

/* ---------------- files ---------------- */
.fm{display:grid;grid-template-columns:148px minmax(0,1fr) 246px;height:100%;min-height:0}
.fm-side{display:flex;flex-direction:column;gap:1px;padding:5px;min-height:0;overflow:auto;
  background:linear-gradient(180deg,#eef1f6,#e7eaf1);border-right:1px solid var(--line)}
.fm-side button{display:flex;align-items:center;gap:6px;padding:5px 7px;border:0;border-radius:6px;
  background:transparent;font-size:11px;text-align:left;color:#2b3038}
.fm-side button:hover{background:rgba(255,255,255,.7)}
.fm-side button.on{background:linear-gradient(180deg,#3f79cf,#2b5da8);color:#fff}
.fm-side svg{width:16px;height:16px;flex:0 0 auto}
.fm-main{display:flex;flex-direction:column;min-height:0;min-width:0;background:#fff}
.fm-list{flex:1 1 auto;overflow:auto;padding:4px}
.fm-item{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:6px;align-items:center;
  width:100%;padding:4px 6px;border:0;border-radius:6px;background:transparent;text-align:left;font-size:11.5px}
.fm-item:hover{background:#eef3fb}
.fm-item.on{background:#dbe7f7;box-shadow:inset 0 0 0 1px #b9cdea}
.fm-item .ic svg{width:18px;height:18px;display:block}
.fm-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:4px;align-items:center}
.fm-item .sz{font-size:10px;color:#6f7683;font-family:var(--mono)}
.fm-prev{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:#fafbfc}
.fp-hd{padding:7px 9px;border-bottom:1px solid var(--line);font-size:11.5px;line-height:1.4}
.fp-bd{flex:1 1 auto;overflow:auto;padding:8px}
.fp-ft{display:flex;flex-wrap:wrap;gap:4px;padding:6px;border-top:1px solid var(--line);background:#f3f5f9}
.fp-ft .btn{font-size:10.5px;padding:3px 8px}
.doc-pre{margin:0;font:10.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;color:#2b3038}
.ph{display:flex;align-items:center;justify-content:center;height:104px;border:1px dashed var(--chrome-3);
  border-radius:6px;background:repeating-linear-gradient(45deg,#eef1f6,#eef1f6 6px,#e7ebf2 6px,#e7ebf2 12px);
  color:#7b828d;font-size:11px}

/* ---------------- office ---------------- */
.off{display:flex;flex-direction:column;min-height:0}
.off-page{flex:1 1 auto;overflow:auto;background:#e6e9ee;padding:12px;display:flex;flex-direction:column;align-items:center}
.off-hd{width:min(560px,100%);padding:13px 18px 7px;background:#fff;border:1px solid #d8dbe2;border-bottom:0;
  text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.off-hd .ttl{font-size:10.5px;letter-spacing:.24em;color:var(--red-d);font-weight:700}
.off-hd .sub{font-size:13.5px;font-weight:700;margin-top:3px;color:#22283a}
.off-page #offTxt{width:min(560px,100%);flex:1 1 auto;min-height:200px;padding:14px 18px;border:1px solid #d8dbe2;
  background:#fff;resize:none;outline:none;font:12px/1.8 var(--font);color:#22283a;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.off-page #offTxt[readonly]{background:#fbfaf7;color:#5b626d}
.off-ft{padding:3px 9px;border-top:1px solid var(--line);background:#f3f5f9;font-size:10px;color:#7b828d;
  display:flex;gap:8px;align-items:center}

/* ---------------- Manbang player ---------------- */
.mv-list{border-right:1px solid var(--line);background:linear-gradient(180deg,#eef1f6,#e7eaf1);
  overflow:auto;padding:4px;display:flex;flex-direction:column;gap:2px;min-height:0}
.mv-list button{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;border:0;border-radius:6px;
  background:transparent;font-size:11px;text-align:left}
.mv-list button:hover{background:rgba(255,255,255,.75)}
.mv-list button.on{background:linear-gradient(180deg,#3f79cf,#2b5da8);color:#fff}
.mv-list .d{font-size:10px;opacity:.75;font-family:var(--mono)}
.mv-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.mv-screen{position:relative;flex:1 1 auto;margin:8px;min-height:110px;border-radius:8px;overflow:hidden;
  display:flex;align-items:flex-end;padding:12px;color:#e9eefc;
  background:radial-gradient(circle at 50% 35%,#22304d,#0a0e17 72%);box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.mv-screen .cap{font-size:12px;line-height:1.6;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.bar2{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.16)}
.bar2 span{display:block;height:100%;width:0;background:linear-gradient(90deg,#c8102e,#ff5b6e)}
.mv-ctl{display:flex;align-items:center;gap:7px;padding:0 9px 7px}
.mv-ctl .btn{padding:2px 9px;font-size:11px;min-width:30px}

/* ---------------- activity monitor ---------------- */
.meter{display:grid;gap:3px}
.meter .lb{display:flex;justify-content:space-between;font-size:10.5px;color:#5b626d}
.meter .tr{height:9px;border-radius:5px;overflow:hidden;background:#e1e5ec;border:1px solid #d3d8e1}
.meter .tr span{display:block;height:100%;transition:width .4s linear;
  background:linear-gradient(90deg,#8d0018,#d0344c)}
#mnProc{margin-top:2px}
#mnProc td,#mnProc th{font-size:10.5px}

/* ---------------- about ---------------- */
.about{padding:12px 13px 16px;overflow:auto;display:flex;flex-direction:column;gap:7px}
.ab-hd{display:flex;gap:10px;align-items:center;padding-bottom:7px;border-bottom:1px solid var(--line)}
.ab-hd svg{width:40px;height:40px;flex:0 0 auto}
.ab-t{font-size:15px;font-weight:700;letter-spacing:.02em;color:#1d2740}
.ab-s{font-size:10.5px;color:#6f7683;margin-top:1px}
.ab-ul{margin:0 0 0 16px;padding:0;font-size:11px;line-height:1.65;color:#3c434e;display:flex;flex-direction:column;gap:3px}
.about h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--red-d);margin:7px 0 0}
.about .kv{font-size:11px}
.about p{margin:0}

/* ---------------- terminal ---------------- */
.term-wrap{display:flex;flex-direction:column;min-height:0;background:#0d1117}
.term{flex:1 1 auto;overflow:auto;padding:9px 11px;color:#cfd8e4;font:11.5px/1.55 var(--mono);
  white-space:pre-wrap;word-break:break-word}
.term .cmd{color:#8fd0a8}
.term .out{color:#cfd8e4}
.term .mono{color:#b6c3d6}
.term .ok{color:#96dca4}
.term .err{color:#ff9aa8}
.term .hdr{color:#ffd479}
.term-in{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid #1d242e;background:#121820}
.term-in .ps{color:#8fd0a8;font:12px var(--mono)}
.term-in input{flex:1 1 auto;min-width:0;background:transparent;border:0;outline:none;color:#e8eef7;font:11.5px var(--mono)}
.term-pre{margin:6px 0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#f2f4f8;
  font:10.5px/1.55 var(--mono);white-space:pre-wrap;color:#3c434e}
.wm{padding:7px 9px;border:1px dashed var(--chrome-3);border-radius:6px;background:#f6f7fa;
  font:10.5px/1.55 var(--mono);color:#5b626d;word-break:break-all}

/* ---------------- misc atoms ---------------- */
.rowlink{cursor:pointer}
.rowlink:hover{background:#eaf1fb}
.sz{font-size:10px;color:#6f7683}
.nm-s{font-size:10.5px;color:#5b626d}
.nm-t{font-weight:700;font-size:11.5px}
.st{font-size:11px;line-height:1.6;border-radius:7px;padding:7px 9px}
.st.good{background:#eef8f0;border:1px solid #bfe0c7;color:#1c6b34}
.st.bad{background:#fdf2f3;border:1px solid #eec7cd;color:#8d0018}
.st ul{margin:4px 0 0 16px;padding:0}
.st-panel{position:fixed;left:12px;right:12px;bottom:12px;max-height:46vh;overflow:auto;z-index:90;
  padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #c9ccd4;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.st-panel h3{margin:0 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7b828d}

/* ---------------- dictionary input ---------------- */
.dict input[type=search]{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;
  font-size:11.5px;outline:none}
.dict .res{margin-top:6px}

/* ---------------- narrow screens: fold panes ---------------- */
@media (max-width:700px){
  .fm{grid-template-columns:1fr}
  .fm-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .fm-side button{flex:0 0 auto}
  .fm-side > div{margin-left:0 !important;border-left:1px solid #d5d9e1;padding-left:8px !important}
  .fm-prev{display:none}
  .mail{grid-template-columns:minmax(0,1fr)}
  .mail-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .mail-side button{flex:0 0 auto}
  .mail-list{max-height:34%;border-right:0;border-bottom:1px solid var(--line)}
  .shop{grid-template-columns:1fr}
  .basket{border-left:0;border-top:1px solid var(--line);max-height:44%}
  .shop-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  .mv{grid-template-columns:1fr}
  .mv-list{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);max-height:84px}
  .mv-list button{flex:0 0 auto;flex-direction:column;align-items:flex-start;gap:2px}
  .off-page{padding:6px}
  .brk{padding:10px 11px 16px}
  .about{padding:9px}
  .term{font-size:11px}
  .br-books{gap:2px}
  .br-stat span:nth-child(3){display:none}
}
@media (max-width:420px){
  .fm-item{grid-template-columns:18px minmax(0,1fr)}
  .fm-item .sz{display:none}
  .br-books{display:none}
  .br-stat{font-size:9px}
  .good .thumb{height:42px}
}

/* ---------------- mail: three panes ---------------- */
.mail{display:grid;grid-template-columns:128px 208px minmax(0,1fr);min-height:0;height:100%;flex:1 1 auto}
.mail-side{min-height:0;overflow:auto}
.mail-list{min-height:0;overflow:auto}
.mail-read{min-height:0}

/* ---------------- 삼태성 IDE (appended: earlier block was dropped) ---------------- */
.ide{display:flex;flex-direction:column;min-height:0;height:100%}
.ide-main{display:flex;flex:1 1 auto;min-height:0;border-top:1px solid var(--line)}
.gutter{flex:0 0 40px;width:40px;padding:8px 5px;text-align:right;white-space:pre;overflow:hidden;
  font:11px/1.55 var(--mono);color:#7b828d;background:#eef1f6;border-right:1px solid var(--line)}
#ideTxt{flex:1 1 auto;min-width:0;border:0;resize:none;padding:8px;outline:none;
  font:11.5px/1.55 var(--mono);color:#1e2430;background:#fdfdfe;tab-size:4}
.ide-out{min-height:70px;max-height:118px;overflow:auto;padding:7px 9px;background:#1b1f27;color:#cfd6e2;
  font:11px/1.5 var(--mono);border-top:1px solid #000;white-space:pre-wrap}
.ide-out .er{color:#ff9aa8}

/* ---------------- layout fixes: shop grid, media grid ---------------- */
.shop{display:grid;grid-template-columns:minmax(0,1fr) 212px;min-height:0;height:100%;flex:1 1 auto}
.shop-main{min-height:0}
.mv{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:0;height:100%;flex:1 1 auto}

/* ============================================================
   final cascade: grid children must be allowed to shrink,
   and narrow rules win (this block is last on purpose)
   ============================================================ */
.app{min-width:0}
.mail>*,.mv>*,.shop>*,.fm>*,.ide>*{min-width:0}
.shop,.mail,.mv,.fm,.ide,.off,.term-wrap{overflow:hidden}
.basket,.mail-side,.mv-list,.fm-side{min-height:0}

@media (max-width:700px){
  .mail{grid-template-columns:minmax(0,1fr)}
  .mail-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .mail-list{max-height:34%;border-right:0;border-bottom:1px solid var(--line)}
  .mv{grid-template-columns:minmax(0,1fr)}
  .mv-list{flex-direction:row;overflow-x:auto;max-height:84px;border-right:0;border-bottom:1px solid var(--line)}
  .shop{grid-template-columns:minmax(0,1fr)}
  .basket{max-height:44%;border-left:0;border-top:1px solid var(--line)}
  .fm{grid-template-columns:minmax(0,1fr)}
  .fm-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .fm-prev{display:none}
}

@media (max-width:520px){.sm-col:first-child{grid-template-columns:1fr}}

/* ============================================================
   phone chrome: compact menu bar + two-row dock (final cascade)
   ============================================================ */
@media (max-width:560px){
  #menubar{overflow:visible;gap:3px;padding:0 5px}
  #menubar .mb-item{display:none}
  #mStarLbl{display:none}
  .mb-app{max-width:32vw;font-size:11.5px}
  #dockWrap{bottom:6px;padding:0 6px}
  #dock{display:grid;grid-template-columns:repeat(6,38px);gap:4px;padding:6px;border-radius:14px;
    overflow:visible;max-width:calc(100vw - 12px)}
  #dock .dk{width:38px;height:38px}
  #dock .dk svg{width:24px;height:24px}
  #dock .dk-sep{display:none}
  .win.max{height:auto}          /* JS sets the pixel height */
}
@media (max-width:390px){
  #dock{grid-template-columns:repeat(6,35px);gap:3px;padding:5px}
  #dock .dk{width:35px;height:35px}
  #dock .dk svg{width:22px;height:22px}
  .mb-app{max-width:27vw}
  #mbClock{min-width:40px;font-size:10.5px}
}

/* ---------------- key/value grid outside .pg pages ---------------- */
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 10px;align-items:baseline;
  font-size:11.5px;margin:6px 0}
.kv b{font-weight:600;color:#5a616d}
.kv span{min-width:0;overflow-wrap:anywhere;color:#2b3038}
</style>

  return RS;
})();

    const timer = setInterval(() => {
      pct = Math.min(100, pct + 4 + Math.random() * 7);
      bar.style.width = pct + '%';
      if (i < BOOT_LINES.length && pct > i * 9.5) {
        const row = BOOT_LINES[i++];
        const line = document.createElement('div');
        line.innerHTML = '<b>$</b> ' + RS.esc(RS.ko ? row[0] : row[1]);
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
      }
      if (pct >= 100) {
        clearInterval(timer);
        setTimeout(() => { RS.$('#boot').classList.add('hidden'); RS.showLogin(); }, 380);
      }
    }, 105);
    RS._bootTimer = timer;
  };

  /* ---------------- window manager ---------------- */
  RS.wins = [];
  let zTop = 30;
  RS.dockH = function () {
    const vw = window.innerWidth;
    if (vw <= 560) return vw <= 390 ? 96 : 100;   /* two-row dock */
    return 62;
  };
  RS.open = function (appId, arg) {
    const app = RS.APPS.find(a => a.id === appId) || RS.APPS.find(a => a.id === 'about');
    if (!app) { RS.toast('missing app: ' + appId, 'err'); return null; }
    if (!RS.state.user) RS.state.user = RS.USERS[0];
    // single-instance apps: refocus + optional deep link
    if (app.single) {
      const ex = RS.wins.find(w => w.app === app.id);
      if (ex) { RS.restore(ex.id); RS.focus(ex.id); if (app.onArg && arg) app.onArg(ex, arg); return ex; }
    }
    const vw = window.innerWidth, vh = window.innerHeight;
    const narrow = vw <= 620;
    const w = narrow ? vw - 8 : Math.min(app.w || 720, vw - 40);
    const h = narrow ? Math.max(240, vh - 34 - RS.dockH() - 6) : Math.min(app.h || 480, vh - 80);
    const n = RS.wins.length;
    const x = narrow ? 4 : Math.max(12, Math.min(28 + n * 26, vw - w - 12));
    const y = narrow ? 34 : Math.max(34, Math.min(38 + n * 22, vh - h - 74));
    const id = RS.uid('win');
    const el = RS.el('section', {
      class: 'win act' + (narrow ? ' max' : ''), id: id, role: 'dialog',
      'aria-label': RS.T(app.ko, app.en), style: 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px'
    });
    el.innerHTML =
      '<div class="wt">' +
        '<span class="tl">' +
          '<button class="c" data-g="' + RS.T('닫기', 'Close') + '" aria-label="' + RS.T('닫기', 'Close') + '"></button>' +
          '<button class="m" data-g="' + RS.T('최소화', 'Minimize') + '" aria-label="' + RS.T('최소화', 'Minimize') + '"></button>' +
          '<button class="z" data-g="' + RS.T('확대', 'Zoom') + '" aria-label="' + RS.T('확대', 'Zoom') + '"></button>' +
        '</span>' +
        '<span class="ti">' + RS.esc(RS.T(app.ko, app.en)) + '</span>' +
        '<span class="badge hidden">' + RS.T('읽기전용', 'READ-ONLY') + '</span>' +
      '</div>' +
      '<div class="wb"></div><div class="wr"></div>';
    RS.$('#winLayer').appendChild(el);
    const win = { id: id, app: app.id, el: el, body: RS.$('.wb', el), title: RS.T(app.ko, app.en),
      ic: app.ic, min: false, max: narrow, w: w, h: h };
    RS.wins.push(win);
    if (RS.state.user.ro) RS.$('.badge', el).classList.remove('hidden');
    RS.$$('.tl button', el).forEach((b, i) => {
      b.onclick = (e) => { e.stopPropagation(); [() => RS.close(id), () => RS.minimize(id), () => RS.zoom(id)][i](); };
    });
    RS.dragify(win);
    el.addEventListener('pointerdown', () => RS.focus(id), true);
    if (app.make) {
      try { app.make(win, arg); } catch (err) {
        win.body.innerHTML = '<div class="empty"><b>' + RS.T('프로그람 오류', 'Program error') + '</b>' +
          RS.esc(String(err && err.message || err)) + '</div>';
        console.error(err);
      }
    }
    RS.focus(id);
    RS.setMenuApp(win.title);
    RS.syncDock();
    RS.log('app', RS.T('프로그람 실행: ', 'program launch: ') + win.title);
    return win;
  };
  RS.setMenuApp = function (t) { RS.$('#mbApp').textContent = t; };
  RS.focus = function (id) {
    const win = RS.wins.find(w => w.id === id); if (!win) return;
    RS.wins.forEach(w => { w.el.classList.remove('act'); w.el.style.zIndex = 20; });
    win.el.classList.add('act');
    win.el.style.zIndex = ++zTop;
    RS.setMenuApp(win.title);
  };
  RS.focused = () => RS.wins.filter(w => w.el.classList.contains('act') && !w.min).pop();
  RS.setTitle = function (win, t) {
    win.title = t;
    const ti = RS.$('.ti', win.el); if (ti) ti.textContent = t;
    if (RS.focused() === win) RS.setMenuApp(t);
  };
  RS.close = function (id) {
    const i = RS.wins.findIndex(w => w.id === id); if (i < 0) return;
    RS.wins[i].el.remove();
    RS.wins.splice(i, 1);
    RS.syncDock();
    const top = RS.wins[RS.wins.length - 1];
    if (top) { RS.focus(top.id); } else { RS.setMenuApp(RS.T('내컴퓨터', 'My Computer')); }
  };
  RS.closeFocused = function () { const w = RS.focused(); if (w) RS.close(w.id); };
  RS.closeAll = function () { RS.wins.slice().forEach(w => RS.close(w.id)); };
  RS.minimize = function (id) {
    const w = RS.wins.find(x => x.id === id); if (!w) return;
    w.min = true; w.el.classList.add('min');
    const top = RS.wins.filter(x => !x.min).pop();
    if (top) RS.focus(top.id);
  };
  RS.restore = function (id) {
    const w = RS.wins.find(x => x.id === id); if (!w) return;
    w.min = false; w.el.classList.remove('min');
  };
  RS.zoom = function (id) {
    const w = RS.wins.find(x => x.id === id); if (!w) return;
    if (w.max) {
      w.max = false; w.el.classList.remove('max');
      w.el.style.left = w.px + 'px'; w.el.style.top = w.py + 'px';
      w.el.style.width = w.pw + 'px'; w.el.style.height = w.ph + 'px';
    } else {
      w.px = w.el.offsetLeft; w.py = w.el.offsetTop; w.pw = w.el.offsetWidth; w.ph = w.el.offsetHeight;
      w.max = true; w.el.classList.add('max');
      w.el.style.left = '0px'; w.el.style.top = 'var(--mb)';
      w.el.style.width = '100%';
      w.el.style.height = (window.innerWidth <= 620
        ? (window.innerHeight - 26 - RS.dockH() - 6) + 'px'
        : 'calc(100% - var(--mb) - 60px)');
    }
    w.el.style.zIndex = ++zTop;
  };
  RS.dragify = function (win) {
    const el = win.el, head = RS.$('.wt', el), grip = RS.$('.wr', el);
    head.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button') || win.max) return;
      const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
      head.setPointerCapture(e.pointerId);
      const mv = (m) => {
        const maxX = window.innerWidth - 80, maxY = window.innerHeight - 60;
        el.style.left = RS.clamp(ox + m.clientX - sx, -el.offsetWidth + 90, maxX) + 'px';
        el.style.top = RS.clamp(oy + m.clientY - sy, 26, maxY) + 'px';
      };
      const up = () => { head.removeEventListener('pointermove', mv); head.removeEventListener('pointerup', up); };
      head.addEventListener('pointermove', mv);
      head.addEventListener('pointerup', up);
    });
    head.addEventListener('dblclick', () => RS.zoom(win.id));
    let rsz = null;
    grip.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      rsz = { x: e.clientX, y: e.clientY, w: el.offsetWidth, h: el.offsetHeight };
      grip.setPointerCapture(e.pointerId);
    });
    grip.addEventListener('pointermove', (e) => {
      if (!rsz) return;
      el.style.width = Math.max(280, rsz.w + e.clientX - rsz.x) + 'px';
      el.style.height = Math.max(170, rsz.h + e.clientY - rsz.y) + 'px';
    });
    grip.addEventListener('pointerup', () => { rsz = null; });
  };

    if (!document.fullscreenElement) { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
    else { document.exitFullscreen && document.exitFullscreen(); }
  };

  /* repaint on resize: keep windows inside the desktop */
  RS.onResize = function () {
    RS.wins.forEach(w => {
      const el = w.el;
      if (w.max) {
        el.style.width = '100%';
        el.style.height = (window.innerWidth <= 620
          ? (window.innerHeight - 26 - RS.dockH() - 6) + 'px'
          : 'calc(100% - var(--mb) - 60px)');
        return;
      }
      const maxW = window.innerWidth - 20, maxH = window.innerHeight - 70;
      if (el.offsetWidth > maxW) el.style.width = maxW + 'px';
      if (el.offsetHeight > maxH) el.style.height = Math.max(170, maxH) + 'px';
      if (el.offsetLeft + 60 > window.innerWidth) el.style.left = Math.max(2, window.innerWidth - el.offsetWidth - 4) + 'px';
      if (el.offsetTop + 40 > window.innerHeight) el.style.top = Math.max(28, window.innerHeight - el.offsetHeight - 4) + 'px';
    });
  };
  window.addEventListener('resize', RS.onResize);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (RS.$('#modal').classList.contains('open')) return RS.closeModal();
      if (!RS.$('#startMenu').classList.contains('hidden')) return RS.closeStart();
      const d = RS.$('#mbDrop'); if (d) return d.remove();
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'w' && RS.state.user &&
        !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
      e.preventDefault(); RS.closeFocused();
    }
  });
  document.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('#startMenu') && !e.target.closest('#mStar')) RS.closeStart();
    if (!e.target.closest('.mb-item')) { const d = RS.$('#mbDrop'); if (d && !d.contains(e.target)) d.remove(); }
  });
})(window.RS);

  RS.eduAnswer = function (i) {
    const st = RS.eduState; const q = RS.QUIZ[st.i];
    const ok = i === q.k;
    if (ok) st.right++;
    RS.log('edu', T('학습평가 ', 'assessment ') + (st.i + 1) + (ok ? T(' 맞음', ' correct') : T(' 틀림', ' wrong')));
    const fb = RS.$('#eduFb');
    if (fb) fb.innerHTML = (ok ? '<span style="color:#1c6b34;font-weight:700">' + T('맞았습니다. ', 'Correct. ') + '</span>'
      : '<span style="color:#a4162a;font-weight:700">' + T('틀렸습니다. ', 'Not quite. ') + '</span>') + RS.esc(q.why);
    setTimeout(() => {
      st.i++;
      if (st.i >= RS.QUIZ.length) { st.done = true; RS.eduRender(); }
      else { const w = RS.wins.find(x => x.app === 'edu'); if (w) RS.eduTab('exam'); }
    }, 900);
  };
  RS.eduScore = function (box) {
    const st = RS.eduState;

    const pass = pct >= 67;
    box.innerHTML = '<div class="box" style="border-color:' + (pass ? '#a4d3b1' : '#e6c3c8') + ';background:' + (pass ? '#f2fbf4' : '#fff6f7') + '">' +

      '<div style="font-size:12px;margin-top:4px">' + T('맞은 수 ', 'Correct ') + st.right + ' / ' + RS.QUIZ.length +
        ' · ' + pct + '%</div>' +
      '<div style="font-size:11.5px;color:#5b626d;margin-top:4px">' +
        T('합격 기준 67%. 평가 결과는 감시기록에 남습니다.', 'Pass mark 67%. The result is written to the watch log.') + '</div>' +
      '<button class="btn pri" style="margin-top:8px" onclick="RS.eduReset()">' + T('다시 보기', 'Retake') + '</button></div>';

  RS.janggiInit = function (win) {
    win = win || RS.wins.find(w => w.app === 'game'); if (!win) return;
    const start = [
      // [col,row,side,type]  rows 0-1 red (top), 4-5 blue (bottom)
      [0, 0, 'r', 'K'], [2, 0, 'r', 'S'], [4, 0, 'r', 'S'],
      [1, 1, 'r', 'S'], [3, 1, 'r', 'S'],
      [0, 5, 'b', 'K'], [2, 5, 'b', 'S'], [4, 5, 'b', 'S'],
      [1, 4, 'b', 'S'], [3, 4, 'b', 'S']
    ];
    win.g = { pieces: start.map(p => ({ c: p[0], r: p[1], side: p[2], t: p[3] })), sel: null, turn: 'b', over: null, moves: 0 };

  };
  RS.janggiRender = function (win) {
    win = win || RS.wins.find(w => w.app === 'game'); if (!win) return;
    const g = win.g;
    const sel = g.sel;
    const legal = sel ? RS.janggiMoves(g, sel) : [];
    let cells = '';
    for (let r = 0; r < 6; r++) for (let c = 0; c < 5; c++) {
      const p = g.pieces.find(x => x.c === c && x.r === r && !x.dead);
      const isSel = sel && sel.c === c && sel.r === r;
      const isMv = legal.some(m => m.c === c && m.r === r);
      cells += '<div class="jc' + ((r + c) % 2 ? ' dark' : '') + (isSel ? ' sel' : '') + (isMv ? ' mv' : '') +
        '" data-c="' + c + '" data-r="' + r + '">' +
        (p ? '<span class="' + (p.side === 'b' ? 'b' : 'r') + '">' + (p.t === 'K' ? '왕' : '졸') + '</span>' : '') + '</div>';
    }
    win.body.innerHTML = '<div class="app"><div class="game">' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px">' +
        '<b>' + T('류경장기 (간이)', 'Ryugyong Janggi (simplified)') + '</b>' +
        '<span class="tag">' + T('5×6 · 왕과 졸', '5×6 · king and soldiers') + '</span>' +
        '<span style="margin-left:auto">' + (g.over ? '<b style="color:' + (g.over === 'b' ? '#1c6b34' : '#a4162a') + '">' +
          (g.over === 'b' ? T('청 승', 'Blue wins') : T('홍 승', 'Red wins')) + '</b>'
          : (g.turn === 'b' ? T('청 차례', 'Blue to move') : T('홍 차례', 'Red to move'))) + '</span>' +
      '</div>' +
      '<div class="jboard" id="jgBoard">' + cells + '</div>' +
      '<div style="display:flex;gap:6px">' +
        '<button class="btn" onclick="RS.janggiInit()">' + T('새 판', 'New game') + '</button>' +
        '<button class="btn" onclick="RS.janggiUndo()" ' + (g.moves ? '' : 'disabled') + '>' + T('무르기', 'Undo') + '</button>' +
      '</div>' +
      '<div style="font-size:10.5px;color:#6d7480;max-width:300px;text-align:center">' +
        T('규칙: 왕은 한 칸 상하좌우, 졸은 앞이나 옆으로 한 칸. 상대 왕을 잡으면 이깁니다. 실제 장기 규칙이 아닌 간이판입니다.',
          'Rules: king one step orthogonally, soldier one step forward or sideways. Capture the enemy king. Simplified, not real janggi.') + '</div>' +
      '</div></div>';
    RS.$$('#jgBoard .jc', win.el).forEach(cell => {
      cell.onclick = () => RS.janggiClick(+cell.dataset.c, +cell.dataset.r);
    });
  };
  RS.janggiMoves = function (g, from) {
    const p = g.pieces.find(x => x.c === from.c && x.r === from.r && !x.dead);
    if (!p) return [];
    const out = [];
    const dirs = p.t === 'K' ? [[1, 0], [-1, 0], [0, 1], [0, -1]] : [[0, p.side === 'b' ? -1 : 1], [1, 0], [-1, 0]];
    dirs.forEach(d => {
      const c = p.c + d[0], r = p.r + d[1];
      if (c < 0 || c > 4 || r < 0 || r > 5) return;
      const t = g.pieces.find(x => x.c === c && x.r === r && !x.dead);
      if (t && t.side === p.side) return;
      out.push({ c: c, r: r });
    });
    return out;
  };
  RS.janggiClick = function (c, r) {
    const win = RS.wins.find(w => w.app === 'game'); if (!win || !win.g) return;
    const g = win.g;
    if (g.over || g.turn !== 'b') return;
    const target = g.pieces.find(x => x.c === c && x.r === r && !x.dead);
    if (g.sel) {
      const ok = RS.janggiMoves(g, g.sel).some(m => m.c === c && m.r === r);
      if (ok) { RS.janggiMove(g, g.sel, { c: c, r: r }); return; }
      if (target && target.side === 'b') { g.sel = { c: c, r: r }; RS.janggiRender(win); return; }
      g.sel = null; RS.janggiRender(win); return;
    }
    if (target && target.side === 'b') { g.sel = { c: c, r: r }; RS.janggiRender(win); }
  };
  RS.janggiMove = function (g, from, to) {
    const win = RS.wins.find(w => w.app === 'game');
    const p = g.pieces.find(x => x.c === from.c && x.r === from.r && !x.dead);
    const cap = g.pieces.find(x => x.c === to.c && x.r === to.r && !x.dead);
    g.hist = g.hist || [];
    g.hist.push(JSON.stringify({ p: { c: p.c, r: p.r }, cap: cap ? { c: cap.c, r: cap.r, side: cap.side, t: cap.t } : null }));
    if (cap) {
      cap.dead = true;
      if (cap.t === 'K') { p.c = to.c; p.r = to.r; g.over = p.side; g.sel = null; RS.janggiRender(win); RS.gameEnd(win); return; }
    }
    p.c = to.c; p.r = to.r;
    g.sel = null; g.turn = 'r'; g.moves++;
    RS.janggiRender(win);
    setTimeout(() => RS.janggiAI(win), 420);
  };
  RS.janggiAI = function (win) {
    const g = win.g; if (!g || g.over) return;
    const mine = g.pieces.filter(p => !p.dead && p.side === 'r');
    const options = [];
    mine.forEach(p => RS.janggiMoves(g, p).forEach(m => options.push({ p: p, m: m })));
    if (!options.length) { g.over = 'b'; RS.janggiRender(win); return; }
    // prefer captures of the blue king, else random
    const kill = options.find(o => {
      const t = g.pieces.find(x => x.c === o.m.c && x.r === o.m.r && !x.dead);
      return t && t.t === 'K';
    });
    const pick = kill || options[Math.floor(Math.random() * options.length)];
    RS.janggiMove(g, { c: pick.p.c, r: pick.p.r }, pick.m);
  };
  RS.janggiUndo = function () {
    const win = RS.wins.find(w => w.app === 'game'); if (!win || !win.g || !win.g.hist) return;
    // undo two plies when possible (blue + red)
    for (let k = 0; k < 2 && win.g.hist.length; k++) {
      const st = JSON.parse(win.g.hist.pop());
      const p = win.g.pieces.find(x => x.c === st.p.c || x.r === st.p.r);
      const mover = win.g.pieces.find(x => !x.dead && (x.c === st.p.c && x.r === st.p.r));
      if (mover) { mover.c = st.p.c; mover.r = st.p.r; }
      if (st.cap) {
        const c = win.g.pieces.find(x => x.dead && x.c === st.cap.c && x.r === st.cap.r);
        if (c) c.dead = false;
      }
      win.g.over = null; win.g.turn = 'b';
    }
    win.g.sel = null;
    RS.janggiRender(win);
  };
  RS.gameEnd = function (win) {
    RS.log('game', T('류경장기 대국 종료', 'janggi game finished'));
    RS.toast(win.g.over === 'b' ? T('청이 이겼습니다.', 'Blue wins.') : T('홍이 이겼습니다.', 'Red wins.'), win.g.over === 'b' ? 'ok' : 'err');
  };
})(window.RS);

(function (RS) {

  RS.MK = RS.MK || {};

  /* ---------- tiny reversible obfuscation (NOT cryptography) ---------- */
  RS.bokemCode = function (text, pass) {
    const key = 'rs3:' + pass;
    let out = '';
    for (let i = 0; i < text.length; i++) {
      out += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return 'BOKEM1\n' + btoa(unescape(encodeURIComponent(out)));
  };
  RS.bokemDecode = function (blob, pass) {
    if (blob.indexOf('BOKEM1\n') !== 0) throw new Error('not a Bokem container');
    const raw = decodeURIComponent(escape(atob(blob.slice(7))));
    const key = 'rs3:' + pass;
    let out = '';
    for (let i = 0; i < raw.length; i++) {
      out += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return out;
  };
  RS.bokemScore = function (pass) {
    let s = 0;
    if (pass.length >= 8) s++;
    if (pass.length >= 12) s++;
    if (/[0-9]/.test(pass)) s++;
    if (/[a-zA-Z]/.test(pass) && /[^a-zA-Z0-9]/.test(pass)) s++;
    return s; // 0..4
  };

    const t = RS.$('#ideTxt', win.el); if (!t) return;

    t.onkeydown = (e) => {
      if (e.key === 'Tab') { e.preventDefault(); const s = t.selectionStart; t.value = t.value.slice(0, s) + '    ' + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = s + 4; RS.ideGutter(win); }
    };

  };
  RS.ideGutter = function (win) {
    const t = RS.$('#ideTxt', win.el), g = RS.$('#ideGut', win.el);
    if (!t || !g) return;
    const n = t.value.split('\n').length;
    let h = '';
    for (let i = 1; i <= n; i++) h += i + '\n';
    g.textContent = h;
  };
  RS.ideCheck = function (src) {
    const stack = []; const pairs = { ')': '(', ']': '[', '}': '{' };
    let line = 1; const errs = [];
    for (let i = 0; i < src.length; i++) {
      const ch = src[i];
      if (ch === '\n') line++;
      if (ch === '(' || ch === '[' || ch === '{') stack.push({ ch: ch, line: line });
      else if (pairs[ch]) {
        const top = stack.pop();
        if (!top || top.ch !== pairs[ch]) errs.push(T('닫는 괄호가 맞지 않습니다: ', 'mismatched bracket: ') + ch + ' :' + line);
      }
    }
    stack.forEach(s => errs.push(T('닫히지 않은 괄호: ', 'unclosed bracket: ') + s.ch + ' :' + s.line));
    if (!/int\s+main/.test(src)) errs.push(T('main 함수가 없습니다.', 'no main() function.'));
    if (src.indexOf('#include') < 0) errs.push(T('머리파일이 없습니다.', 'no #include.'));
    return errs;
  };
  RS.ideBuild = function () {
    const win = RS.wins.find(x => x.app === 'ide'); if (!win) return;
    RS.ideSave(win);
    const src = SRC[win.tab];
    const errs = RS.ideCheck(src);
    const out = RS.$('#ideOut', win.el);
    if (errs.length) {
      out.innerHTML = '<span class="er">' + errs.map(e => RS.esc(win.tab + ': ' + e)).join('<br>') + '</span><br>' +
        '<b style="color:#a4162a">' + errs.length + T('개 오류 · 짓기 실패', ' error(s) · build failed') + '</b>';
      RS.log('ide', T('짓기 실패: ', 'build failed: ') + win.tab);
      return;
    }
    out.innerHTML = '<span style="color:#1c6b34">gcc -o ' + RS.esc(win.tab.replace(/\.c$/, '')) + ' ' + RS.esc(win.tab) + '</span><br>' +
      T('경고 0 · 오류 0 · 실행파일을 만들었습니다.', '0 warnings · 0 errors · binary written.') + '<br>' +
      '<span style="color:#6f7683">' + RS.bytes(src.length) + ' → a.out</span>';
    RS.log('ide', T('짓기: ', 'build: ') + win.tab);
  };
  RS.ideRun = function () {
    const win = RS.wins.find(x => x.app === 'ide'); if (!win) return;
    const out = RS.$('#ideOut', win.el);
    const src = SRC[win.tab];
    const errs = RS.ideCheck(src);
    if (errs.length) { out.innerHTML = '<b style="color:#a4162a">' + T('먼저 짓기를 하십시오.', 'Build first.') + '</b>'; return; }
    const m = src.match(/i\s*<=\s*(\d+)/);
    const n = m ? +m[1] : 10;
    let sum = 0; for (let i = 1; i <= n; i++) sum += i;
    out.innerHTML = '<span style="color:#6f7683">$ ./a.out</span><br><b>합: ' + sum + '</b><br>' +
      '<span style="color:#6f7683">' + T('결과 코드 0', 'exit code 0') + '</span>';
    RS.log('ide', T('실행: ', 'run: ') + win.tab);
  };
})(window.RS);

  RS.catSet = function (c) {

        '</button>').join('') +

        '<div class="tbar"><b style="font-size:11.5px">' + RS.esc(T((DIRS.find(d => d[0] === win.dir) || DIRS[0])[1], (DIRS.find(d => d[0] === win.dir) || DIRS[0])[2])) + '</b>' +

      '<div class="fp-ft">' +
        '<button class="btn pri" onclick="RS.fmOpen(\'' + f.id + '\')">' + T('열기', 'Open') + '</button>' +

  RS.fmDir = function (d) {

  };

  };
  RS.fmOpen = function (id) {
    const f = RS.files().find(x => x.id === id); if (!f) return;
    if (f.kind === 'snd') { RS.open('media'); return; }
    if (f.kind === 'img') { RS.modal({ title: f.name, html: '<div class="ph" style="height:150px">' + T('그림 (합성)', 'Image (synthetic)') + '</div>' }); return; }

  RS.fmCopyUsb = function (id) {
    const f = RS.files().find(x => x.id === id); if (!f) return;
    const ro = RS.state.user && RS.state.user.ro;
    if (ro) { RS.toast(T('방문자 계정은 매체에 쓸 수 없습니다.', 'Visitor accounts cannot write to media.'), 'err'); return; }
    if (RS.state.watermark) {
      RS.modal({
        title: T('매체에 쓰기', 'Write to media'),
        html: '<p>' + T('《매체 관리 규정》에 따라 사본에 단말기 표시를 넣습니다. 파일을 어디로 옮겼는지 남습니다.',
          'Under the media rules, a terminal mark is written into the copy so its spread can be traced.') + '</p>' +
          '<div class="wm">© KCC · ' + RS.SERIAL + ' · 10.41.7.24 · ' + RS.stamp() + ' ' + RS.clock() + '</div>' +
          '<p style="font-size:11.5px;color:#616873">' + T('표시를 끄면 규정 위반으로 기록됩니다.', 'Turning this off is recorded as a violation.') + '</p>',
        buttons: [
          { label: T('취소', 'Cancel') },
          { label: T('표시를 넣고 복사', 'Copy with mark'), pri: true, fn: () => RS.fmDoCopy(f) }
        ]

        title: T('표시 없이 복사', 'Copy without mark'),

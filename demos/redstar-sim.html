        buttons: [
          { label: T('취소', 'Cancel') },
          { label: T('그래도 복사', 'Copy anyway'), pri: true, fn: () => { RS.log('denied', T('매체 표시 없이 복사', 'copy without media mark')); RS.fmDoCopy(f, true); } }
        ]
      });
    }
  };
  RS.fmDoCopy = function (f, bare) {
    const stamp = bare ? '' : '\n\n— — —\n© KCC · ' + RS.SERIAL + ' · 10.41.7.24 · ' + RS.stamp() + ' ' + RS.clock();
    const copy = { id: f.id + '_usb', dir: 'usb', name: f.name.replace(/(\.[^.]+)?$/, ' (사본)$1'),
      kind: f.kind, size: f.size + stamp.length, body: f.body + stamp, wm: !bare, mtime: T('오늘', 'today') };
    RS.files().push(copy);
    if (!bare) f.wm = true;
    RS.log(bare ? 'denied' : 'copy', (bare ? T('표시 없이 복사: ', 'bare copy: ') : T('매체 사본: ', 'media copy: ')) + f.name);
    RS.save();
    const w = RS.wins.find(x => x.app === 'files');
    if (w) { w.dir = '외부매체'; w.sel = copy.id; RS.filesRender(w); }
    RS.toast(bare ? T('표시 없이 복사했습니다. 기록되었습니다.', 'Copied without a mark. Recorded.') : T('표시를 넣어 복사했습니다.', 'Copied with the mark.'), bare ? 'err' : 'ok');
  };

      '<div class="sub">' + RS.esc(f.name.replace(/\.[^.]+$/, '')) + '</div></div>' +
      '<textarea id="offTxt" ' + (ro ? 'readonly' : '') + ' spellcheck="false" aria-label="' + T('본문', 'Body') + '">' + RS.esc(f.body) + '</textarea>';
    RS.$('#offFt', w.el).innerHTML = T('소광 오피스 3.0 · ', 'Sogwang Office 3.0 · ') +
      (RS.state.watermark ? '<span class="mono">© KCC · ' + RS.SERIAL + '</span>' : '<span style="color:#a4162a">' + T('표시 없음', 'no mark') + '</span>');
    const t = RS.$('#offTxt', w.el);
    const cnt = () => {
      const n = (t.value || '').length;
      RS.$('#offCnt', w.el).textContent = RS.num(n) + T('자', ' chars') + ' · ' + RS.num((t.value || '').split(/\s+/).filter(Boolean).length) + T('단어', ' words');

  RS.offSave = function () {

    if (RS.state.user && RS.state.user.ro) { RS.toast(T('읽기 전용입니다.', 'Read-only.'), 'err'); return; }
    const f = RS.files().find(x => x.id === w.fid);
    const t = RS.$('#offTxt', w.el);
    if (!f || !t) return;
    f.body = t.value; f.size = new Blob([f.body]).size; f.mtime = T('오늘', 'today');

    RS.log('office', T('문건 저장: ', 'document saved: ') + f.name);

  RS.offPrint = function () {
    const w = RS.wins.find(x => x.app === 'office');

        '<b>' + T('표시', 'Mark') + '</b><span class="mono">© KCC · ' + RS.SERIAL + '</span></div>' +
        '<p style="font-size:11.5px;color:#616873">' + T('모든 인쇄물에 단말기 표시가 들어갑니다.', 'Every print carries the terminal mark.') + '</p>'
    });

  /* ============================================================
     Manbang media player
     ============================================================ */
  const PROG = [
    ['조선중앙텔레비죤 녹화', 'KCTV recording', 3480],
    ['과학기술 강좌 12', 'Science lecture 12', 1480],
    ['원격강의 다시보기', 'Remote lecture replay', 2465],
    ['만수대 예술단 공연', 'Mansudae concert', 4350]
  ];
  RS.MK.media = function (win, arg) {
    win.idx = arg || 0; win.t = 0; win.playing = false;
    win.body.innerHTML = '<div class="app mv">' +
      '<div class="mv-list" id="mvList"></div>' +
      '<div class="mv-main">' +
        '<div class="mv-screen"><div class="cap" id="mvCap">' + T('재생기를 고르십시오.', 'Pick a recording.') + '</div>' +
          '<div class="bar2"><span id="mvProg"></span></div></div>' +
        '<div class="mv-ctl"><button class="btn" id="mvPlay" onclick="RS.mvToggle()">▶</button>' +
          '<span id="mvTime" class="mono" style="font-size:11px">00:00</span>' +
          '<input id="mvSeek" type="range" min="0" max="100" value="0" oninput="RS.mvSeek(this.value)" style="flex:1">' +
          '<span id="mvDur" class="mono" style="font-size:11px">00:00</span></div>' +
        '<div style="font-size:10.5px;color:#6f7683;padding:0 8px 6px">' +
          T('소리와 영상은 넣지 않았습니다. 자막만 흐릅니다.', 'No audio or video is embedded; only captions run.') + '</div>' +
      '</div></div>';
    RS.mvList(win);
    RS.mvPick(win.idx, false);
  };
  RS.mvList = function (win) {
    const box = RS.$('#mvList', win.el); if (!box) return;
    box.innerHTML = PROG.map((p, i) =>
      '<button class="' + (i === win.idx ? 'on' : '') + '" onclick="RS.mvPick(' + i + ',true)">' +
        '<span class="nm">' + RS.esc(T(p[0], p[1])) + '</span>' +
        '<span class="d">' + RS.mmss(p[2]) + '</span></button>').join('');
  };
  RS.mmss = function (s) {
    s = Math.max(0, Math.round(s));
    return RS.pad(Math.floor(s / 60)) + ':' + RS.pad(s % 60);
  };
  RS.CAPTIONS = [
    '— 록화물 —', '평양 · 조선중앙텔레비죤', '《공업도안 전시회》', '자체 기술로 만든 설비들이 소개되였다.',
    '학생들은 원격강의를 듣고 학습평가를 본다.', '《과학기술전당》 전자도서관', '망의 자료를 현장에서 리용하는 사업이 진행되였다.',
    '— 끝 —'
  ];
  RS.mvPick = function (i, play) {
    const w = RS.wins.find(x => x.app === 'media'); if (!w) return;
    w.idx = i; w.t = 0; w.playing = !!play;
    RS.mvList(w);
    const d = PROG[i][2];
    RS.$('#mvDur', w.el).textContent = RS.mmss(d);
    RS.$('#mvSeek', w.el).value = 0;
    RS.mvPaint(w);
    clearInterval(w.timer);
    if (w.playing) w.timer = setInterval(() => RS.mvTick(w), 500);
    RS.log('media', T('재생: ', 'play: ') + PROG[i][0]);
  };
  RS.mvPaint = function (w) {
    const d = PROG[w.idx][2];
    const cap = RS.$('#mvCap', w.el), prog = RS.$('#mvProg', w.el), time = RS.$('#mvTime', w.el);
    if (!cap) return;
    cap.textContent = RS.CAPTIONS[Math.min(RS.CAPTIONS.length - 1, Math.floor(w.t / (d / RS.CAPTIONS.length)))];
    prog.style.width = (w.t / d * 100) + '%';
    time.textContent = RS.mmss(w.t);
    RS.$('#mvPlay', w.el).textContent = w.playing ? '❚❚' : '▶';
  };
  RS.mvTick = function (w) {
    if (!document.body.contains(w.el)) { clearInterval(w.timer); return; }
    w.t = Math.min(PROG[w.idx][2], w.t + 1.5);
    RS.mvPaint(w);
    if (w.t >= PROG[w.idx][2]) { w.playing = false; clearInterval(w.timer); RS.mvPaint(w); }
  };
  RS.mvToggle = function () {
    const w = RS.wins.find(x => x.app === 'media'); if (!w) return;
    w.playing = !w.playing;
    clearInterval(w.timer);
    if (w.playing) w.timer = setInterval(() => RS.mvTick(w), 500);
    RS.mvPaint(w);

    const st = qs.get('selftest');
    if (st || qs.get('probe')) {
      RS.skipBoot();
      RS.$('#login').classList.add('hidden');
      RS.$('#desk').classList.remove('hidden');
      RS.state.user = RS.USERS[qs.get('user') === 'guest' ? 1 : 0];
      RS.renderDesktop();
      RS.paintChrome();
      RS.startClock();
      if (st) RS.runSelftest(false);
      if (qs.get('probe')) RS.layoutProbe();
      const app = qs.get('app');
      if (app) RS.open(app, qs.get('url') || qs.get('arg') || undefined);
      return;
    }
    RS.boot();
  };

  RS.runSelftest = function (show) {
    RS._quiet = true;                 /* no toasts / no UI side effects while testing */
    const rows = []; let pass = 0;
    RS.SELFTEST.forEach((c, i) => {
      let ok = false, err = '';
      try { ok = !!c[1](); } catch (e) { err = String(e && e.message || e); }
      if (ok) pass++; else rows.push((i + 1) + '. ' + c[0] + (err ? ' — ' + err : ''));
    });
    // app sweep: every registered app must build without the error panel
    let appFail = [];
    const pre = RS.wins.map(w => w.id);
    RS.APPS.forEach(a => {
      let w = null;
      try {
        w = RS.open(a.id);
        const txt = w.body.textContent || '';
        if (!w.body.children.length || /Program error|프로그람 오류/.test(txt)) appFail.push(a.id);
      } catch (e) { appFail.push(a.id + ' (' + (e.message || e) + ')'); }
      finally { if (w && pre.indexOf(w.id) < 0) RS.close(w.id); }
    });
    const appOk = appFail.length === 0;
    if (appOk) pass++;
    const total = RS.SELFTEST.length + 1;
    const out = { pass: pass, total: total, fail: rows.concat(appOk ? [] : ['app sweep: ' + appFail.join(', ')]), at: new Date().toISOString() };
    RS.selftestOut = out;
    const html = '<div class="st ' + (out.fail.length ? 'bad' : 'good') + '">' +
      '<b>' + (out.fail.length ? '✗ ' : '✓ ') + pass + ' / ' + total + '</b> ' +
      T('검사 통과', 'checks passed') +
      (out.fail.length ? '<ul>' + out.fail.map(f => '<li>' + RS.esc(f) + '</li>').join('') + '</ul>' : '') +
      '</div>';
    const box = RS.$('#stOut'); if (box) box.innerHTML = html;
    const panel = RS.$('#selftest');
    if (panel) {
      panel.textContent = pass + '/' + total + (out.fail.length ? ' FAIL: ' + out.fail.join(' ; ') : ' PASS');
      if (show) { panel.className = 'st-panel'; panel.innerHTML = '<h3>self-test</h3>' + html + '<p>' + out.at + '</p>'; }
    }
    document.body.setAttribute('data-st', JSON.stringify(out));
    RS._quiet = false;
    document.title = (out.fail.length ? 'FAIL ' : 'OK ') + pass + '/' + total + ' — ' + T('붉은별 3.0', 'Red Star OS 3.0');
    if (window.console) console.log('[selftest]', pass + '/' + total, out.fail);
    return out;
  };

  /* ============================================================
     Layout probe (headless verification at 3 widths)
     ============================================================ */
  RS.layoutProbe = function () {
    const out = { vw: window.innerWidth, vh: window.innerHeight, docW: document.documentElement.scrollWidth, rows: [] };
    const check = (label, el) => {
      if (!el) { out.rows.push([label, 'MISSING']); return; }
      const r = el.getBoundingClientRect();
      if (r.right > out.vw + 1 || r.left < -1 || r.bottom > out.vh + 1) {
        out.rows.push([label, 'OUT', Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]);
      }
    };
    check('#menubar', RS.$('#menubar'));
    check('#dockWrap', RS.$('#dockWrap'));
    check('#icons', RS.$('#icons'));
    RS.APPS.forEach(a => {
      let w = null;
      try {
        w = RS.open(a.id);
        const r = w.el.getBoundingClientRect();
        const dockTop = (RS.$('#dockWrap') || { getBoundingClientRect: () => ({ top: out.vh }) }).getBoundingClientRect().top;
        if (r.bottom > dockTop + 2) {
          out.rows.push(['win:' + a.id, 'UNDER_DOCK', Math.round(r.bottom), Math.round(dockTop)]);
        }
        if (r.right > out.vw + 1 || r.bottom > out.vh + 1 || r.left < -1) {
          out.rows.push(['win:' + a.id, 'OUT', Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]);
        }
        if (w.body.scrollWidth > w.body.clientWidth + 2) {
          out.rows.push(['win:' + a.id, 'HSCROLL', w.body.scrollWidth, w.body.clientWidth]);
        }
        if (!w.body.children.length) out.rows.push(['win:' + a.id, 'EMPTY']);
      } catch (e) { out.rows.push(['win:' + a.id, 'ERR', String(e.message || e)]); }
      finally { if (w) RS.close(w.id); }
    });
    // modal + start menu fit
    RS.toggleStart();
    check('#startMenu', RS.$('#startMenu'));
    RS.closeStart();
    RS.modal({ title: T('검사', 'probe'), text: T('상자 크기 검사', 'box fit check'), buttons: [{ label: 'OK' }] });
    check('#modal', RS.$('.md-box') || RS.$('#modal'));
    RS.closeModal();
    out.ok = out.rows.length === 0;
    const d = document.createElement('div');
    d.id = 'probe'; d.style.display = 'none'; d.textContent = JSON.stringify(out);
    document.body.appendChild(d);
    console.log('[probe]', JSON.stringify(out));
    return out;
  };

  /* expose the command table for the self-test */
  RS.CMDS = CMDS;
})(window.RS);

RS.initOuter();
</script>

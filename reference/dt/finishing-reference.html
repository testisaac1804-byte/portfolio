<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finishing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: #f5f5f5;
    color: #212121;
  }
  .page {
    max-width: 1100px;
    margin: 0 auto;
    background: #fff;
    min-height: 100vh;
    box-shadow: 0 0 20px rgba(0,0,0,0.08);
  }
  .banner {
    width: 100%;
    display: block;
    height: auto;
    background: #303033;
  }
  .content { padding: 28px 24px 48px; }
  h1 {
    font-size: 2.2rem;
    font-weight: 700;
    color: #212121;
    margin-bottom: 8px;
  }
  .sub { color: #666; font-size: 0.95rem; margin-bottom: 24px; }
  .poster-wrap {
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
  .poster { width: 100%; height: auto; display: block; }
  h2 {
    font-size: 1.3rem;
    margin: 32px 0 14px;
    color: #212121;
    border-bottom: 2px solid #f0f0f0;
    padding-bottom: 8px;
  }
  .vids {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .vid-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: #fafafa;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    text-decoration: none;
    color: #212121;
    font-weight: 600;
    transition: background 0.15s, border-color 0.15s;
  }
  .vid-card:hover { background: #f0f0f0; border-color: #bdbdbd; }
  .vid-play {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: #d93025;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
    flex-shrink: 0;
  }
  footer {
    margin-top: 40px;
    padding: 16px 24px;
    border-top: 1px solid #eee;
    color: #999;
    font-size: 0.85rem;
    text-align: center;
  }
</style>
</head>
